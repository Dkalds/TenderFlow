version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    # El trío fastapi/starlette/uvicorn sale del grupo automático (2026-08-17,
    # PR #187). Dependabot los etiquetaba como "minor" —0.136→0.141, 1.3→1.6,
    # 0.46→0.52— pero ese salto deja `include_router` devolviendo objetos
    # `_IncludedRouter` opacos en `app.routes`: la API responde 500 en todas las
    # rutas y no supera ni el gate de arranque del job E2E. Actualizarlos exige
    # auditar todo lo que recorre `app.routes` (api/, scripts/gen_status.py,
    # tests/test_exports.py), así que va en un PR propio y a mano. Los topes que
    # lo hacen efectivo están en requirements.in y pyproject.toml.
    ignore:
      - dependency-name: "fastapi"
      - dependency-name: "starlette"
      - dependency-name: "uvicorn"
      # scikit-learn 1.9.x: regresión de HistGradientBoostingRegressor con una
      # columna numérica 100% NaN (detalle en requirements.in). El techo `<1.9`
      # de los .in no basta por sí solo: Dependabot lo ensancha al proponer la
      # versión (en #294 pasó a `<1.10` y así llegó a master). La 1.10 no se
      # ignora: su PR tiene que pasar tests/test_s3_feature_todo_nan.py.
      - dependency-name: "scikit-learn"
        versions: [">=1.9, <1.10"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    # eslint 10 rompe `npm ci` (ERESOLVE, ver PR #284, 2026-09-08):
    # eslint-plugin-jsx-a11y@6.10.2 —dependencia de eslint-config-next@16.3.3—
    # solo declara peer `eslint@"^3..^9"`, y no hay versión de
    # eslint-plugin-jsx-a11y ni de eslint-config-next todavía que soporte
    # eslint 10. Bloqueado en upstream, no es arreglable desde este repo; se
    # quita el ignore cuando esa cadena de peers lo soporte.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    # `all` aquí es explicitud, no un arreglo: para npm equivale al conjunto
    # de dependencias declaradas, que es lo que el bloque ya cubría por
    # defecto. El escalón `indirect` que sí alcanza transitivas existe en
    # bundler/pip/composer/cargo/gomod/uv, no en npm.
    #
    # Que quede dicho para el próximo que venga a buscar aquí el arreglo de un
    # aviso transitivo: `allow` solo gobierna las **version updates**, no las
    # security updates, así que no era esto lo que faltaba para nanoid (#104).
    # Lo que faltaba era tenerlas habilitadas: `automated-security-fixes`
    # estaba en `false` hasta el 2026-08-30.
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # El `package.json` de la raíz (@vercel/analytics, @vercel/speed-insights) es
  # un segundo árbol npm que el bloque de `/web` no ve: `directory` no es
  # recursivo. Sin esta entrada nadie lo vigilaba.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
