name: Domain truth audit

# Los defectos de datos (fecha_limite ausente, UTE contadas de más, baja
# calculada contra el presupuesto equivocado) no los detecta ningún test: no
# son regresiones de código, son formas del feed real que llegan por la
# ingesta. `scripts/audit_domain_truth.py` los medía desde hace meses, pero
# solo cuando alguien lo ejecutaba a mano — así que en la práctica se
# descubrían semanas después, mirando la aplicación.
#
# Corre después del scrape mensual de las 06:00 para medir sobre datos frescos.
# La alerta viaja por email (observability.notify): el job en rojo significa
# "la auditoría no pudo ejecutarse", no "el dato está mal". Mismo contrato que
# healthcheck.yml.

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Verdad del dato (umbrales + alerta)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # La sección (b) (multi-lote) necesita los ZIP mensuales en disco y este
      # runner es efímero: reporta "sin ZIP cacheados" y no evalúa umbral. Las
      # otras tres miden contra la BD, que es donde está la señal accionable.
      - name: Run domain truth audit
        env:
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL || 'warn' }}
          LOG_FORMAT: json
        run: python scripts/audit_domain_truth.py --check --alert

      # El JSON permite diffear entre ejecuciones para calibrar los umbrales
      # con datos reales antes de apretarlos (ver el docstring del script).
      - name: Export measurements as JSON
        if: always()
        env:
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
        run: python scripts/audit_domain_truth.py --json > domain-truth.json

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: domain-truth-measurements
          path: domain-truth.json
          if-no-files-found: ignore
