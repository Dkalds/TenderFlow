name: Database Backup

on:
  schedule:
    # Ejecutar cada día a las 03:00 UTC (fuera de ventanas de scraping)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      include_turso:
        description: "Incluir backup de Turso (requiere CLI instalado en runner)"
        required: false
        default: false
        type: boolean
      keep_s3:
        description: "Número de backups a retener en S3/R2"
        required: false
        default: "30"
        type: string

permissions:
  contents: read  # solo lectura sobre el repo

jobs:
  backup:
    name: Backup DB → S3/R2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # DATABASE_URL a nivel de job para que los `if: env.DATABASE_URL (==|!=) ''`
    # de los steps evalúen correctamente (el contexto env de un step no está
    # disponible en su propio `if`). Vacío si el secret no está definido.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      # ── Rama Postgres (post-cutover F3d) ─────────────────────────────
      - name: Backup Postgres with pg_dump (when DATABASE_URL is set)
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX || 'backups/' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          set -eo pipefail
          mkdir -p data/backups
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="data/backups/tenderflow_pg_${TIMESTAMP}.dump"
          # Password fuera de la línea de comandos (evita /proc/<pid>/cmdline y ps):
          # se parsea DATABASE_URL a variables PG* y la password viaja por PGPASSWORD.
          eval "$(python -c '
          import os, shlex
          from urllib.parse import urlsplit, parse_qs, unquote
          u = urlsplit(os.environ["DATABASE_URL"])
          ssl = parse_qs(u.query).get("sslmode", ["require"])[-1]
          print("export PGHOST=%s" % shlex.quote(u.hostname or ""))
          print("export PGPORT=%s" % (u.port or 5432))
          print("export PGUSER=%s" % shlex.quote(unquote(u.username or "")))
          print("export PGDATABASE=%s" % shlex.quote((u.path or "/").lstrip("/") or "postgres"))
          print("export PGSSLMODE=%s" % shlex.quote(ssl))
          print("export PGPASSWORD=%s" % shlex.quote(unquote(u.password or "")))
          ')"
          echo "Backup Postgres → $BACKUP_FILE (host=$PGHOST db=$PGDATABASE ssl=$PGSSLMODE)"
          pg_dump --format=custom --no-owner --no-acl --file="$BACKUP_FILE"
          unset PGPASSWORD
          echo "Backup completado: $(du -sh "$BACKUP_FILE" | cut -f1)"
          # Cifrar el dump (contiene PII + hashes de api_keys/totp_secrets) antes de subirlo.
          # Sin BACKUP_ENCRYPTION_KEY: se sube a S3 privado pero NUNCA como artefacto de
          # GitHub (el glob del artefacto es solo *.dump.gpg).
          UPLOAD_FILE="$BACKUP_FILE"
          if [ -n "${BACKUP_ENCRYPTION_KEY:-}" ]; then
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_ENCRYPTION_KEY" --output "${BACKUP_FILE}.gpg" "$BACKUP_FILE"
          rm -f "$BACKUP_FILE"
          UPLOAD_FILE="${BACKUP_FILE}.gpg"
          echo "Dump cifrado → $UPLOAD_FILE"
          else
          echo "::warning::BACKUP_ENCRYPTION_KEY no definido — el dump NO se cifra; se sube a S3 privado pero no como artefacto de GitHub."
          fi
          # Subir a S3/R2 si está configurado (bucket privado). Solo el fichero resultante.
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
          UPLOAD_FILE="$UPLOAD_FILE" python -c "
          import boto3, os, pathlib
          s3 = boto3.client('s3', endpoint_url=os.environ.get('AWS_ENDPOINT_URL') or None)
          f = pathlib.Path(os.environ['UPLOAD_FILE'])
          key = os.environ.get('BACKUP_S3_PREFIX', 'backups/') + f.name
          s3.upload_file(str(f), os.environ['BACKUP_S3_BUCKET'], key)
          print('Uploaded to s3://%s/%s' % (os.environ['BACKUP_S3_BUCKET'], key))
          "
          fi

      # ── Rama SQLite legacy (pre-cutover) ──────────────────────────────
      - name: Download latest SQLite DB
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          mkdir -p data
          if [ -n "$TURSO_DATABASE_URL" ]; then
            echo "Turso configurado — la DB será descargada en tiempo de ejecución por el script"
          else
            echo "Sin Turso configurado — solo se respalda la DB local si existe."
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || '' }}

      - name: Run SQLite backup
        if: ${{ env.DATABASE_URL == '' }}
        env:
          ENV: prod
          APP_PROFILE: scraper
          KEEP_S3_INPUT: ${{ inputs.keep_s3 || '30' }}
          INCLUDE_TURSO: ${{ inputs.include_turso }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX || 'backups/' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          DATABASE_PATH: ${{ secrets.DATABASE_PATH || '' }}
          DATABASE_URL: ""
        run: |
          EXTRA=""
          if [ "$INCLUDE_TURSO" = "true" ]; then
            EXTRA="--turso"
          fi
          python scripts/backup_db.py --s3 --keep 3 --keep-s3 "${KEEP_S3_INPUT}" ${EXTRA}

      - name: Upload backup artifact (fallback)
        # Sube el backup como artefacto de GitHub Actions si el upload S3 falla.
        # Los artefactos se retienen 90 días. SOLO ficheros cifrados/comprimidos:
        # nunca un dump PG en claro (*.dump) — contiene PII + hashes de secretos.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            data/backups/*.db.gz
            data/backups/*.dump.gpg
          retention-days: 90
          if-no-files-found: warn
