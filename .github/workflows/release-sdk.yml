name: Release SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to publish (e.g. 0.1.0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate-sdk:
    name: Generate & publish Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # Exportar el schema importa `api.app` entera (rutas, middleware,
      # Prometheus, BD): con solo fastapi/uvicorn/pydantic el import fallaba y el
      # job no llegaba a generar nada. Misma instalación y mismo script que el
      # job `codegen-drift` de ci.yml, que exporta el mismo fichero en cada PR.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Export OpenAPI JSON (offline)
        env:
          ENV: dev
        run: python scripts/export_openapi.py openapi.json

      - name: Install openapi-generator-cli
        run: |
          npm install --global @openapitools/openapi-generator-cli@2.13.4 --quiet 2>&1 | tail -5

      - name: Determine SDK version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            RAW_VERSION="$INPUT_VERSION"
          else
            # Strip leading 'v' from tag name
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9._-]*)?$ ]]; then
            echo "::error::Invalid SDK version format: $RAW_VERSION"
            exit 1
          fi
          echo "sdk_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Python SDK
        env:
          SDK_VERSION: ${{ steps.version.outputs.sdk_version }}
          REPO: ${{ github.repository }}
        run: |
          openapi-generator-cli generate \
            --input-spec openapi.json \
            --generator-name python \
            --output sdk/ \
            --additional-properties=\
          packageName=licitaciones_sap_sdk,\
          projectName=licitaciones-sap-sdk,\
          packageVersion="$SDK_VERSION",\
          packageUrl="https://github.com/$REPO"

      - name: Build SDK wheel
        working-directory: sdk
        run: |
          pip install --quiet build
          python -m build --wheel --sdist

      - name: Publish SDK to PyPI (Test)
        working-directory: sdk
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          pip install --quiet twine
          twine upload --repository testpypi dist/* --skip-existing
        continue-on-error: true  # Don't fail release if TestPyPI publish fails

      - name: Upload SDK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licitaciones-sap-sdk-${{ steps.version.outputs.sdk_version }}
          path: sdk/dist/
          retention-days: 30
