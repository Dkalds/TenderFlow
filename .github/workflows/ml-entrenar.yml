name: Entrenar y publicar modelos ML

# Los tres entrenamientos que publican artefactos en una Release, en un solo
# workflow: se elige cuál con `modelo` y solo corre su job. Antes eran
# `train-model.yml` (clasificador SAP), `train-predictivos.yml` (baja y
# retención) y `train-tech.yml` (clasificador multi-tecnología); el porqué de
# cada uno sigue encima de su job.
#
# Comparten lo que los separa de la ingesta: publicar exige
# `contents: write`, y ese permiso no debe estar en `scrape-daily.yml`.
#
# Quién lo lanza:
#   - `sap`: una persona, o el paso semanal `sap_active_learning` del cierre de
#     `scrape-daily.yml` por `workflow_dispatch` sin entradas
#     (`scheduler/concept_drift.py`), que por eso es el valor por defecto;
#   - `predictivos`: el día 1 de cada mes a las 03:00 UTC, o a mano;
#   - `tecnologias`: el día 1 de cada mes a las 05:00 UTC, o a mano.
#
# Los dos `cron` de abajo deciden el job por `github.event.schedule`: cambiar
# uno exige cambiar el mismo literal en el `if:` de su job.

on:
  schedule:
    # Predictivos: día 1 a las 03:00 UTC, fuera de la ventana del scrape (cada
    # 4 h desde las 00:23, 120 min de presupuesto: la de las 00:23 acaba como
    # tarde a las 02:23). El scoring diario se encadena al final de las pasadas
    # de `scrape-daily` (ver `ml-scoring.yml`), y el modelo nuevo no se sirve
    # hasta que alguien lo activa.
    - cron: "0 3 1 * *"
    # Tecnologías: día 1 a las 05:00 UTC, después de los predictivos para no
    # competir por la BD. Las etiquetas no circulares (feedback humano +
    # `llm_tech_labeling`) se acumulan despacio y no justifican más.
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      modelo:
        description: "Qué modelo entrenar y publicar"
        type: choice
        default: sap
        options:
          - sap
          - predictivos
          - tecnologias

permissions:
  contents: write # necesario para crear/actualizar releases y subir artefactos

# Un grupo por modelo. Dos entrenamientos del mismo modelo a la vez numerarían
# y activarían cada uno su versión sin saber del otro, y el último en activar
# ganaría aunque fuera el peor: el segundo espera. Modelos distintos no se
# esperan entre sí, como cuando eran tres ficheros.
concurrency:
  group: >-
    ml-entrenar-${{ github.event_name == 'schedule'
    && (github.event.schedule == '0 3 1 * *' && 'predictivos' || 'tecnologias')
    || inputs.modelo || 'sap' }}
  cancel-in-progress: false

jobs:
  # ── sap ─────────────────────────────────────────────
  # Antes: train-model.yml («Train & publish ML model»).
  #
  # Entrena el clasificador SAP, lo publica en la Release y activa la versión,
  # en ese orden: entrenar → subir → comprobar lo subido → activar. Es el único
  # camino que publica el modelo, así que también es el único que lo activa.
  #
  # Dónde y con qué nombre (2026-10): en la Release de tag fijo `ml-models`, la
  # de los predictivos, y con el sha256 en el nombre
  # (`sap_classifier-<sha12>.pkl`, `shared.model_artifacts.content_addressed_path`).
  # Antes subía `sap_classifier.pkl` a *latest* borrando el asset anterior: la
  # subida sustituía el de la versión activa, así que «Train model» la retiraba
  # primero, el modelo se servía sin cotejar hasta la activación y un fallo de
  # la subida, ya borrado el asset, dejaba a los runners sin modelo. Ahora la
  # versión activa sigue activa, y servible, hasta que se activa la nueva. El
  # `sap_classifier.pkl` de nombre fijo de `v1.0.0-models` (mayo) no se toca: es
  # lo que se sirve mientras no haya versión activa.
  #
  # Lo lanza una persona, o el paso semanal `sap_active_learning` del cierre de
  # `scrape-daily.yml` cuando hay etiquetas humanas que el último entrenamiento
  # no vio (`scheduler/concept_drift.py::maybe_retrain_classifier`). Ese paso
  # entrenaba por su cuenta dentro de su runner, sin poder publicar nada: el
  # 2026-09-29 dejó activa una versión sin artefacto y `ml_scoring` cayó cuatro
  # días.
  sap:
    # Sin entradas (el dispatch de `concept_drift.py`) vale el default `sap`; el
    # `== ''` cubre además un dispatch que no las reciba.
    if: inputs.modelo == 'sap' || (github.event_name == 'workflow_dispatch' && inputs.modelo == '')
    name: Train classifier & upload to release
    runs-on: ubuntu-latest
    # 60 y no 15: `seed_negatives(spread_months=6)` descarga SEIS bulks
    # mensuales de PLACSP donde antes descargaba uno, y este runner no tiene
    # `data/downloads/` cacheado (ningún workflow del repo lo cachea; los ZIP
    # son grandes y una caché de varios GB para un job manual se desalojaría
    # entre ejecuciones). La referencia del repo para trabajo de bulks es
    # `scrape-bulk.yml`, que presupuesta 120 min; 60 cubre 6 descargas más el
    # entrenamiento con margen.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: ./.github/actions/preparar-python

      # Entrena y pasa el gate, pero NO activa: el candidato que lo supera queda
      # registrado sin activar (`promoted=true`) hasta «Activar la versión
      # publicada», y emite `artefactos` (su `.pkl` con el sha256 en el nombre
      # y su `.sha256`). No toca la versión activa: el asset nuevo tiene otro
      # nombre y no sustituye el suyo.
      - name: Train model
        id: train
        env:
          # ENV=prod porque este job lee y escribe en la BD de producción, así
          # que los validators de datos (TLS de DATABASE_URL) deben estar
          # activos. APP_PROFILE=scraper omite los secretos del proceso HTTP.
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          LOG_FORMAT: json
        run: python -m scheduler.jobs.ml_training_run

      # El gate de promoción (`services/ml/promotion.py`) solo escribe el
      # artefacto si el candidato lo supera, así que su ausencia es un
      # desenlace legítimo y no un fallo. Sin este corte, el `ls` de abajo
      # moría con "cannot access" sin explicar nada.
      - name: Report rejected candidate
        if: steps.train.outputs.promoted != 'true'
        # Los valores van por `env` y no interpolados en el script: una
        # expresión de Actions dentro de `run:` se sustituye ANTES de que bash
        # vea la línea, así que un backtick o una comilla en el texto rompería
        # el paso (o algo peor).
        env:
          VERSION: ${{ steps.train.outputs.version }}
          REASONS: ${{ steps.train.outputs.rejection_reasons }}
          RECALL_NO_KEYWORD: ${{ steps.train.outputs.recall_no_keyword }}
          N_TRAIN: ${{ steps.train.outputs.n_train }}
          N_TEST: ${{ steps.train.outputs.n_test }}
        run: |
          {
            echo "## Modelo NO publicado"
            echo
            echo "El entrenamiento terminó correctamente, pero el candidato no superó el"
            echo "gate de promoción: no se subió nada y lo que se sirve no cambia."
            echo
            echo "- Versión registrada (sin activar): \`$VERSION\`"
            echo "- Motivos: \`$REASONS\`"
            echo "- recall_no_keyword: \`$RECALL_NO_KEYWORD\`"
            echo "- n_train / n_test: \`$N_TRAIN\` / \`$N_TEST\`"
            echo
            echo "La versión queda en \`model_versions\` para inspección y rollback."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify model artifact
        if: steps.train.outputs.promoted == 'true'
        env:
          ARTEFACTOS: ${{ steps.train.outputs.artefactos }}
        run: |
          set -euo pipefail
          # `promoted=true` sin `artefactos` es un fallo de verdad: el gate dio
          # el candidato por bueno y no dejó nada que subir.
          if [ -z "$ARTEFACTOS" ]; then
            echo "::error::El candidato pasó el gate pero no hay artefacto que subir"
            exit 1
          fi
          # shellcheck disable=SC2086 -- rutas sin espacios, split intencional
          ls -lh $ARTEFACTOS
          for ruta in $ARTEFACTOS; do
            case "$ruta" in *.sha256) cat "$ruta"; echo ;; esac
          done

      - name: Upload model to release
        if: steps.train.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTEFACTOS: ${{ steps.train.outputs.artefactos }}
          # Mismo literal que `shared.release_assets.ML_MODELS_RELEASE_TAG`, la
          # primera Release en la que busca shared/model_artifacts.py. Lo fija
          # tests/test_unit_train_model_workflow.py: si divergen, se publica
          # donde nadie busca primero.
          TAG: ml-models
          VERSION: ${{ steps.train.outputs.version }}
          RECALL_NO_KEYWORD: ${{ steps.train.outputs.recall_no_keyword }}
          N_TRAIN: ${{ steps.train.outputs.n_train }}
          N_TEST: ${{ steps.train.outputs.n_test }}
        run: |
          set -euo pipefail
          # Los valores llegan por `env`, no interpolados: una expresión de
          # Actions dentro de `run:` se sustituye antes de que bash lea la línea.
          #
          # Tag fijo y nunca *latest* (`--latest=false`), como en
          # el job `predictivos`, que normalmente ya la ha creado. La crea
          # `github.token`, así que su `release: published` no dispara
          # `release-sdk.yml`.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No existe la Release $TAG; creándola"
            gh release create "$TAG" --title "ML Models" \
              --notes "Artefactos de modelo con el sha256 en el nombre (clasificador SAP, baja, retención). Los publica ml-entrenar.yml; no es una release de software." \
              --latest=false
          fi
          # Sin `gh release delete-asset`: el nombre lleva el hash del
          # contenido, así que no hay asset anterior que retirar y el de la
          # versión activa sigue en su sitio. `--clobber` solo puede reescribir
          # los mismos bytes; se conserva para que relanzar no falle.
          # shellcheck disable=SC2086 -- rutas sin espacios, split intencional
          gh release upload "$TAG" $ARTEFACTOS --clobber
          echo "Artefactos publicados en $TAG: $ARTEFACTOS"

          # `gh release upload` sale 0 aunque el asset acabe con otro nombre.
          # Los procesos piden el asset por el nombre EXACTO registrado en
          # model_versions: se comprueba nombre a nombre. El sha256 lo coteja
          # «Activar la versión publicada».
          PUBLICADOS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for ruta in $ARTEFACTOS; do
            nombre=$(basename "$ruta")
            if ! echo "$PUBLICADOS" | grep -Fqx "$nombre"; then
              echo "::error::$nombre no aparece en los assets de $TAG"
              exit 1
            fi
          done
          {
            echo "## Modelo publicado"
            echo
            echo "- Release: \`$TAG\`"
            echo "- Versión: \`$VERSION\`"
            for ruta in $ARTEFACTOS; do echo "- Asset: \`$(basename "$ruta")\`"; done
            echo "- recall_no_keyword: \`$RECALL_NO_KEYWORD\`"
            echo "- n_train / n_test: \`$N_TRAIN\` / \`$N_TEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # La versión se activa AQUÍ, después de subir, y solo si la Release
      # publica el sha256 que quedó registrado: el paso lee el `digest` del
      # asset de la API de Releases y lo coteja con `model_versions` antes de
      # tocar `is_active`. Después recalcula `ml_proba` entero con el modelo ya
      # activo.
      #
      # Hasta 2026-10 «Train model» activaba la versión y la subida iba tres
      # pasos más abajo, con el `precompute` forzado —que recorre toda la
      # población— en medio. Un fallo ahí dejaba activa una versión cuyo
      # artefacto no estaba publicado, y todos los runners caían por
      # `ModelArtifactMismatch`: lo mismo que ocurrió el 2026-09-29 por el
      # camino del reentrenamiento automático.
      #
      # Si este paso (o la subida) falla, no cambia lo que se sirve: sigue
      # activa la versión que lo estuviera, con su asset intacto, o —sin
      # versión activa— el `sap_classifier.pkl` de nombre fijo. Relanzar el
      # workflow lo resuelve; ver docs/runbooks/model-rollback.md.
      - name: Activar la versión publicada
        if: steps.train.outputs.promoted == 'true'
        env:
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          LOG_FORMAT: json
          # Para leer la Release por la API sin chocar con el límite anónimo.
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.train.outputs.version }}
        run: python -m scheduler.jobs.ml_training_run activar --version "$VERSION"

      # S6.1: la medición del cambio de población, después de que el paso
      # anterior haya reescrito `ml_proba` con el modelo nuevo.
      # No bloquea —el artefacto ya está entrenado y el gate ya decidió—, pero
      # deja en el run el número que dice si el clasificador discrimina: la
      # proporción de filas puntuadas por encima de 0.7. El 2026-09-04 era el
      # 90,64%, con el modelo puntuando 683k filas de PSCP que nunca vio.
      - name: Medir la discriminación del clasificador
        if: steps.train.outputs.promoted == 'true'
        continue-on-error: true
        env:
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
        run: |
          {
            echo "## Auditoría de verdad del dato (post-entrenamiento)"
            echo
            echo '```'
            python scripts/audit_domain_truth.py --check 2>&1 \
              || echo "(algún umbral superado — ver las líneas de arriba)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── predictivos ─────────────────────────────────────────────
  # Antes: train-predictivos.yml («Train & publish modelos predictivos»).
  #
  # Re-entrenamiento mensual de los modelos predictivos (baja y retención,
  # RFC 20260611-2) **y publicación de sus artefactos en la Release `ml-models`**.
  #
  # Por qué existe este workflow y no es un paso más de la pipeline canónica:
  # hasta 2026-08 `ml_retrain` vivía en `CANONICAL_STEPS` (dentro de
  # `scrape-daily.yml`), que corre con `permissions: contents: read`. Entrenaba
  # en el runner, registraba `path` + `sha256` en `model_versions`… y el `.pkl`
  # moría con el runner efímero. Ninguna Release lo publicaba —`train-model.yml`
  # solo sube `sap_classifier`— así que `shared/model_artifacts.py` no podía
  # resolver el artefacto de ninguna versión activa y `ml-scoring.yml` servía el
  # baseline histórico indefinidamente, en verde. Publicar exige
  # `contents: write`, y ese permiso no debe estar en el job de ingesta.
  #
  # Dónde y con qué nombre se publica (2026-09): en la Release de tag fijo
  # `ml-models` (`shared.release_assets.ML_MODELS_RELEASE_TAG`), que nunca es
  # *latest*, y con el sha256 en el nombre (`baja_model-3fa9c1d2e4b5.pkl`, ver
  # `shared.model_artifacts.rename_to_content_address`). Antes subía con nombre
  # fijo a lo que fuera *latest*, y eso fallaba de dos maneras:
  #   - el reentrenamiento registra vN+1 SIN activarla, pero `--clobber` pisaba
  #     el asset de la vN activa: `ml-scoring` bajaba vN+1 para la fila vN, el
  #     sha256 no cuadraba y `ModelArtifactMismatch` tumbaba el scoring cada día
  #     hasta que alguien activara la nueva;
  #   - `release.yml` crea una *latest* nueva, sin assets de modelo, con cada
  #     tag `v*`: publicar una versión de software dejaba al scoring sin
  #     artefactos.
  # Las versiones registradas antes, con nombre fijo, se siguen resolviendo: el
  # resolvedor busca por nombre en `ml-models`, en *latest* y en las Releases
  # más recientes.
  #
  # La activación de la versión nueva sigue siendo decisión humana vía
  # `db.model_registry` (salvo `ML_PRED_AUTO_ACTIVATE`): este workflow deja el
  # artefacto disponible, no cambia lo que se sirve.
  predictivos:
    if: github.event.schedule == '0 3 1 * *' || inputs.modelo == 'predictivos'
    name: Retrain baja/retención & upload to release
    runs-on: ubuntu-latest
    # Construye el dataset histórico completo y explora hiperparámetros sobre
    # varios folds para dos modelos: presupuesto holgado frente a los 15 min
    # del clasificador SAP.
    timeout-minutes: 45

    env:
      # Mismos ejes que el resto de jobs de datos: ENV=prod activa los
      # validators (TLS de DATABASE_URL, alertas); APP_PROFILE=scraper omite
      # los secretos del proceso HTTP.
      ENV: prod
      APP_PROFILE: scraper
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
      LOG_FORMAT: json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: ./.github/actions/preparar-python

      # Overrides de repositorio → $GITHUB_ENV, y SOLO si están definidos.
      #
      # Antes el step de reentrenamiento llevaba
      # `ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL || 'warn' }}`. Ese literal no
      # es un default: SUSTITUYE al de `config/settings.py` cuando la variable
      # no está definida, que es el caso normal. Dos fuentes de verdad para el
      # mismo valor, y gana la del YAML, que ningún test mira — el patrón ya
      # costó dos incidentes (ver ml-scoring.yml). Así el default vigente es
      # siempre el del código y la variable de repo lo pisa solo si alguien la
      # define de verdad. Verificado por scripts/check_env_parity.py.
      - name: Exportar overrides de repositorio definidos
        env:
          IN_ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL }}
        run: |
          set -u
          if [ -n "${IN_ALERT_MIN_LEVEL:-}" ]; then
            echo "ALERT_MIN_LEVEL=$IN_ALERT_MIN_LEVEL" >> "$GITHUB_ENV"
          fi

      # Emite `artefactos` (rutas separadas por espacio, ya con el sha256 en el
      # nombre, más su `.sha256`) por $GITHUB_OUTPUT. Sale vacío si ninguno de
      # los dos modelos tenía histórico suficiente, que no es un fallo: se
      # sigue sirviendo el baseline.
      - name: Retrain predictive models
        id: retrain
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: python -m scheduler.jobs.ml_predicciones retrain

      - name: Upload artifacts to release
        if: steps.retrain.outputs.artefactos != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTEFACTOS: ${{ steps.retrain.outputs.artefactos }}
          # Mismo literal que `shared.release_assets.ML_MODELS_RELEASE_TAG`, la
          # primera Release en la que busca shared/model_artifacts.py. Lo fija
          # tests/test_unit_train_predictivos_workflow.py: si divergen, se
          # publica donde nadie busca.
          TAG: ml-models
        run: |
          set -euo pipefail
          # Tag fijo y nunca *latest* (`--latest=false`): una release de
          # software no la desplaza, y ella no le quita el puesto a ninguna.
          # La crea `github.token`, así que su evento `release: published` no
          # dispara `release-sdk.yml`: GitHub no encadena workflows por
          # eventos de ese token.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No existe la Release $TAG; creándola"
            gh release create "$TAG" --title "ML Models" \
              --notes "Artefactos de los modelos predictivos (baja, retención) con el sha256 en el nombre. Los publica ml-entrenar.yml; no es una release de software." \
              --latest=false
          fi
          # `--clobber` ya es inocuo: el nombre lleva el hash del contenido,
          # así que solo puede reescribir los mismos bytes. Se conserva para
          # que relanzar el workflow no falle por un asset que ya está.
          # shellcheck disable=SC2086 -- rutas sin espacios, split intencional
          gh release upload "$TAG" $ARTEFACTOS --clobber
          echo "Artefactos publicados en $TAG: $ARTEFACTOS"

          # `gh release upload` sale 0 aunque el asset acabe con otro nombre
          # (colisiones, sufijos). El scoring busca el asset por el nombre
          # EXACTO del fichero registrado en model_versions, así que se
          # comprueba nombre a nombre en vez de confiar en el código de salida.
          PUBLICADOS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for ruta in $ARTEFACTOS; do
            nombre=$(basename "$ruta")
            if ! echo "$PUBLICADOS" | grep -Fqx "$nombre"; then
              echo "::error::$nombre no aparece en los assets de $TAG; ml-scoring no podrá resolverlo"
              exit 1
            fi
          done
          echo "Verificado: todos los artefactos están en $TAG"

  # ── tecnologias ─────────────────────────────────────────────
  # Antes: train-tech.yml («Train & publish clasificador multi-tecnología»).
  #
  # Entrena `TechnologyClassifier` y **publica su artefacto en la Release**.
  #
  # Por qué existe: hasta 2026-09 `data/models/tech_classifier.pkl` no lo
  # producía ningún workflow. El único camino era el subcomando local
  # `python -m scraper.ml_classifier train-tech`, y la clase ni siquiera tenía
  # `ensure_downloaded`, así que en los runners de Actions el fichero no existía
  # nunca y el paso canónico `ml_tecnologias` salía `no_model` en TODAS las
  # pasadas de `scrape-daily.yml` desde que el paso existe — no desde una
  # regresión concreta, sino desde siempre.
  #
  # Gemelo de los jobs `sap` (SAP binario) y `predictivos`
  # (baja/retención). Publicar exige `contents: write`, y ese permiso no debe
  # estar en el job de ingesta: por eso es un workflow aparte y no un paso de la
  # pipeline canónica.
  #
  # El gate de publicación vive en `scheduler/jobs/tech_training_run.py`: un
  # modelo entrenado sobre `licitaciones.tecnologia` (el regex de los conectores)
  # NO se publica, porque serviría una copia del regex pisando la señal de pliego
  # que `tech_signal_merge` funde sobre esas mismas columnas. El suelo son
  # `ML_TECH_MIN_POS_READY` etiquetas independientes (feedback humano o LLM), y
  # por debajo de él el job **ni entrena**: el resultado se descartaría igual.
  #
  # Con los datos del 2026-09-03 (33 licitaciones con etiqueta humana, 0 del LLM) este workflow
  # termina en verde en ~1 min sin publicar nada, explicando el motivo en el step
  # summary. Es el desenlace correcto, no un fallo — pero significa que
  # `ml_tecnologias` sigue sin modelo hasta que haya etiquetas de verdad.
  tecnologias:
    if: github.event.schedule == '0 5 1 * *' || inputs.modelo == 'tecnologias'
    name: Train tech classifier & upload to release
    runs-on: ubuntu-latest
    # Un OneVsRest sobre ~13 etiquetas y el corpus entero de `licitaciones`
    # (~700k filas el 2026-09-03), que `train_from_db` materializa en un
    # DataFrame. No hay exploración de hiperparámetros ni folds, pero sí un
    # TF-IDF sobre todo el texto: mismo presupuesto que baja/retención. Cuando
    # el gate no llega al suelo de etiquetas el job sale en ~1 min sin entrenar,
    # así que este techo solo se paga cuando hay algo que entrenar de verdad.
    timeout-minutes: 45

    env:
      # Mismos ejes que el resto de jobs de datos: ENV=prod activa los
      # validators (TLS de DATABASE_URL, alertas); APP_PROFILE=scraper omite
      # los secretos que solo necesita el proceso HTTP.
      ENV: prod
      APP_PROFILE: scraper
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
      LOG_FORMAT: json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: ./.github/actions/preparar-python

      # Emite `publicable` y `artefactos` (rutas separadas por espacio) en
      # $GITHUB_OUTPUT. Sale en verde con `publicable=false` cuando el gate
      # rechaza: es el mecanismo funcionando, no un fallo.
      # Override de repositorio → $GITHUB_ENV, y SOLO si está definido.
      #
      # Antes esto era `ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL || 'warn' }}`
      # en el `env:` del step de abajo. Ese literal no es un default: SUSTITUYE
      # al de `config/settings.py` cuando la variable no está definida, que es
      # el caso normal. Son dos fuentes de verdad para el mismo valor y gana la
      # del YAML, que ningún test mira. En este repo ya costó un incidente
      # documentado (el modelo EOL `deepseek-v4-pro` tumbando el lote entero de
      # fichas), y `scripts/check_env_parity.py` lo bloquea desde entonces.
      - name: Exportar overrides definidos
        env:
          VAR_ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL }}
        run: |
          set -u
          if [ -n "${VAR_ALERT_MIN_LEVEL:-}" ]; then
            echo "ALERT_MIN_LEVEL=$VAR_ALERT_MIN_LEVEL" >> "$GITHUB_ENV"
          fi

      - name: Train tech classifier
        id: train
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: python -m scheduler.jobs.tech_training_run

      # S6.2: el conteo de etiquetas por origen que dejó el entrenamiento.
      # `train_from_db` escribe una entrada append-only por run en
      # `data/models/tech_registry.json` con `label_sources`, y este paso la
      # sube al summary. Es la única forma de saber, mirando un run, si el
      # modelo se entrenó con etiquetas humanas o con el regex: este modelo no
      # se registra en `model_versions` a propósito (ver el docstring de
      # `scheduler/jobs/tech_training_run.py`).
      #
      # `if: always()` y no `success()`: cuando el gate rechaza, el conteo es
      # justo lo que hay que mirar. Si el job ni entrenó, el fichero no existe
      # y el paso lo dice sin fallar.
      - name: Report label sources
        if: always()
        run: |
          set -u
          REGISTRO=data/models/tech_registry.json
          {
            echo "## Etiquetas del entrenamiento"
            echo
            if [ -f "$REGISTRO" ]; then
              echo '```json'
              # Última entrada del registro: el run que acaba de terminar.
              python -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1]))[-1], indent=2, ensure_ascii=False))" "$REGISTRO"
              echo '```'
            else
              echo "Sin registro: el job no llegó a entrenar (ver el gate de arriba)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Los valores van por `env` y no interpolados en el `run:`: una expresión
      # de Actions se sustituye ANTES de que bash lea la línea, así que un
      # backtick o una comilla en el texto rompería el paso (o algo peor).
      - name: Report rejected candidate
        if: steps.train.outputs.publicable != 'true'
        env:
          MOTIVO: ${{ steps.train.outputs.motivo }}
          N_INDEP: ${{ steps.train.outputs.n_etiquetas_independientes }}
          UMBRAL: ${{ steps.train.outputs.umbral }}
          PCT_KEYWORDS: ${{ steps.train.outputs.pct_keywords }}
          N_MODELS: ${{ steps.train.outputs.n_models }}
          N_SAMPLES: ${{ steps.train.outputs.n_samples }}
        run: |
          {
            echo "## Modelo NO publicado"
            echo
            echo "Solo se publica un modelo con etiquetas **independientes del regex**"
            echo "de \`matches_technology()\`. Publicar uno circular serviría una copia"
            echo "del regex pisando la señal de pliego que \`tech_signal_merge\` funde."
            echo
            echo "- Motivo: \`$MOTIVO\`"
            echo "- Etiquetas independientes: \`$N_INDEP\` (umbral \`$UMBRAL\`)"
            echo "- % de filas etiquetadas por keywords: \`$PCT_KEYWORDS\`"
            echo "- n_models / n_samples: \`$N_MODELS\` / \`$N_SAMPLES\`"
            echo
            echo "Para desbloquearlo hacen falta etiquetas no circulares: feedback"
            echo "humano en \`ml_feedback\`, o activar \`LLM_TECH_LABELING_ENABLED\` en"
            echo "\`scrape-daily.yml\` para que \`licitacion_tecnologia_pliego\` acumule"
            echo "filas con \`method IN ('llm_metadata','llm')\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts to release
        if: steps.train.outputs.publicable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTEFACTOS: ${{ steps.train.outputs.artefactos }}
          MACRO_F1: ${{ steps.train.outputs.macro_f1_all_labels }}
          N_MODELS: ${{ steps.train.outputs.n_models }}
          PCT_KEYWORDS: ${{ steps.train.outputs.pct_keywords }}
        run: |
          set -euo pipefail
          # `gh release view` sin argumentos resuelve la MISMA release que
          # consulta `shared/release_assets.py` (`/releases/latest`). Ojo con
          # `gh release list --limit 1`, que devuelve la más reciente por fecha
          # de creación y puede no ser la marcada como latest: subir ahí deja
          # el asset donde nadie lo busca.
          TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            TAG="v0.0.0-model"
            echo "No hay releases publicadas; creando $TAG"
            gh release create "$TAG" --title "ML Models" --notes "Artefactos de modelo"
          fi
          # shellcheck disable=SC2086 -- rutas sin espacios, split intencional
          gh release upload "$TAG" $ARTEFACTOS --clobber

          # `gh release upload` sale 0 aunque el asset acabe con otro nombre
          # (colisiones, sufijos). `ensure_downloaded` busca por el nombre
          # EXACTO, así que se comprueba nombre a nombre.
          PUBLICADOS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for ruta in $ARTEFACTOS; do
            nombre=$(basename "$ruta")
            if ! echo "$PUBLICADOS" | grep -Fqx "$nombre"; then
              echo "::error::$nombre no aparece en los assets de $TAG; ml_tecnologias no podrá resolverlo"
              exit 1
            fi
          done
          {
            echo "## Modelo publicado"
            echo
            echo "- Release: \`$TAG\`"
            echo "- n_models: \`$N_MODELS\`"
            echo "- macro_f1_all_labels: \`$MACRO_F1\`"
            echo "- % de filas etiquetadas por keywords: \`$PCT_KEYWORDS\`"
            echo
            echo "Ojo al último dato: el gate solo garantiza un **suelo** de etiquetas"
            echo "independientes, no que la mayoría lo sean. Si ese porcentaje sigue"
            echo "alto, las métricas siguen midiendo en buena parte imitación del regex."
          } >> "$GITHUB_STEP_SUMMARY"
