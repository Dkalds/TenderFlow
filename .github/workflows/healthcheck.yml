name: Healthcheck

on:
  schedule:
    - cron: "0 */6 * * *"  # cada 6 horas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Overrides de repositorio → $GITHUB_ENV, y SOLO si están definidos.
      #
      # Antes era `ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL || 'warn' }}` en el
      # `env:` del step. Ese literal no es un default: SUSTITUYE al de
      # `config/settings.py` cuando la variable no está definida, que es el caso
      # normal. Son dos fuentes de verdad para el mismo valor y gana la del
      # YAML, que ningún test mira. El patrón ya costó dos incidentes (el modelo
      # `deepseek-v4-pro` EOL tumbando el lote entero de fichas). Así el default
      # vigente es siempre el del código, y la variable de repo lo pisa solo
      # cuando alguien la define de verdad.
      # Verificado por scripts/check_env_parity.py.
      - name: Exportar overrides de repositorio definidos
        env:
          IN_ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL }}
        run: |
          set -u
          if [ -n "${IN_ALERT_MIN_LEVEL:-}" ]; then
            echo "ALERT_MIN_LEVEL=$IN_ALERT_MIN_LEVEL" >> "$GITHUB_ENV"
          fi

      - name: Run healthcheck
        env:
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          LOG_FORMAT: json
        run: python -m scheduler.healthcheck --alert --freshness-hours 36
