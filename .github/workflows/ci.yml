name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main", "develop"]
  # Barrido semanal. Existe por una sola razón: es donde vive ahora la matriz de
  # Python 3.12 (ver el job `test`). Producción está fijada a `python:3.13.13`
  # en docker/Dockerfile.api, así que pagar 3.12 en cada PR era duplicar el job
  # más caro de la suite (25 min) para verificar una versión que no se despliega
  # en ningún sitio. Semanal basta para detectar que 3.12 dejó de funcionar
  # antes de que a alguien le haga falta.
  schedule:
    - cron: "0 3 * * 1"  # Lunes 03:00 UTC, antes del barrido de security.yml

permissions:
  contents: read

concurrency:
  # El evento entra en el grupo: sin él, el cron semanal sobre `master` cancela
  # (cancel-in-progress) el run del push que estuviera en curso sobre la misma
  # ref, y el commit se queda sin CI.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static analysis: merged quality + pre-commit (misma setup) ──────
  static-analysis:
    name: Lint, typecheck & pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # [pliegos]: mypy necesita el módulo pypdf instalado para
          # scraper/document_fetcher.py (no solo un stub) — sin esto falla
          # con "Cannot find implementation or library stub for module pypdf".
          pip install -e ".[pliegos]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      # `make typecheck` (mypy .) y no una lista de paquetes: la lista omitía
      # `services/` y `llm/`, o sea que el invariante de AGENTS.md §3.1 ("todo el
      # código de producción pasa strict") no estaba verificado justo para el
      # paquete más grande. Apuntar al target del Makefile evita que la lista
      # vuelva a quedarse atrás cuando aparezca un paquete nuevo.
      - name: Type check (mypy)
        run: make typecheck

      # Previene el patrón que causó el incidente de psycopg-pool: alguien
      # agrega una dependencia a requirements.in y olvida recompilar
      # requirements.txt, que es lo que instala docker/Dockerfile.api.
      - name: Verify requirements.txt is in sync with requirements.in
        run: python scripts/check_requirements_sync.py

      # Convierte ADR-012 ("un solo plano de orquestación") en invariante
      # verificado. Sin esto, un job puede quedar registrado pero sin ningún
      # plano que lo ejecute — el fallo que dejó los digests diarios sin
      # enviar y la retención sin purgar durante meses.
      # ADR-014 — integridad analítica del frontend. Bloqueante desde
      # 2026-07-28: los cinco patrones sistémicos que diagnosticó la ADR están
      # a cero, así que el gate pasa de "modo aviso" (que nadie ejecutaba, ni
      # siquiera en CI) a invariante ejecutable. Un hallazgo nuevo se justifica
      # en su línea con `fdi-allow:<categoria>` o se corrige. Vive en este job
      # y no en `frontend` porque el checker es Python y `frontend` es Node.
      - name: Verify frontend analytical integrity (ADR-014)
        run: python scripts/check_frontend_invariants.py --strict

      # Misma lección otra vez: el guard de la superficie pública estaba
      # escrito y pasando limpio, pero no lo invocaba nadie (ni el Makefile, ni
      # este workflow, ni pre-commit) mientras varios docstrings afirmaban que
      # corría en CI. Es el único control automático de la restricción dura del
      # producto —la superficie anónima publica solo el dato base del anuncio
      # oficial, nada de adjudicatarios, NIF ni analítica propia— y la fuga que
      # vigila no rompe nada: el endpoint responde 200 con un campo de más.
      - name: Verify public surface (sin adjudicatarios, NIF ni analítica propia)
        run: python scripts/check_public_surface.py --strict

      - name: Verify scheduler job parity (ADR-012)
        env:
          ENV: dev
        run: python scripts/check_job_parity.py

      # docs/STATUS.md se deriva del código: paridad de jobs, ratchet TID251,
      # motor de la suite, superficie de la API. Si un hecho se puede calcular,
      # no se escribe a mano — es lo que evitaba que el backlog siguiera
      # marcando como pendiente trabajo ya integrado.
      - name: Verify docs/STATUS.md is in sync with the code
        env:
          ENV: dev
        run: python scripts/gen_status.py --check

      # Un validador nuevo en Settings que exija una variable en producción pasa
      # CI en verde y revienta al arrancar el contenedor. Aquí se comprueba que
      # todo lo obligatorio esté declarado en render.yaml.
      - name: Verify env parity (settings ↔ render.yaml ↔ .env.example)
        env:
          ENV: dev
        run: python scripts/check_env_parity.py

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # ── Tests contra el motor de producción (ADR-018, ADR-021) ─────────
  # Hubo un job `test` sobre SQLite y otro `test-postgres` sobre el motor
  # real. Con SQLite retirado (ADR-021) eran el mismo job, así que se
  # consolidaron: esta es la única suite y corre contra Postgres.
  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 3.13 en cada PR; 3.12 SOLO en el barrido semanal (`schedule`).
        #
        # Producción corre `python:3.13.13-slim-bookworm` (docker/Dockerfile.api,
        # y `.python-version` fija lo mismo), así que 3.12 no se despliega en
        # ningún sitio: pagarlo en cada PR duplicaba el job más caro de la suite
        # —25 minutos de techo, ~3100 tests con `-n auto`— para verificar una
        # versión que nadie ejecuta. Semanal detecta que 3.12 dejó de funcionar
        # con semanas de antelación sobre el día en que hiciera falta.
        python-version: ${{ github.event_name == 'schedule' && fromJSON('["3.12","3.13"]') || fromJSON('["3.13"]') }}
    # Postgres es el único motor desde ADR-021: la suite ya no tiene camino
    # SQLite, así que este job necesita una instancia real. Imagen pgvector
    # porque la migración v56 hace `CREATE EXTENSION vector`.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero de CI, no es un secreto real
          POSTGRES_DB: tenderflow_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # [pliegos]: tests/test_document_fetcher.py ejercita extracción real
          # de PDF (pypdf), no solo el fallback de "extra ausente".
          pip install -e ".[pliegos]"

      # `-n auto`: el fixture de sesión materializa el DDL una sola vez entre
      # workers (lock de fichero en el tmp compartido del run) y los schemas
      # por test llevan el pid, así que no colisionan. Medido en un contenedor
      # de 4 CPUs: 3094 tests en 359 s con -n auto, frente a >600 s en serie,
      # sin fallos de aislamiento. El techo del job son 25 min.
      # Si el paralelo diera falsos rojos, quitar `-n auto` restaura la
      # ejecución en serie sin ningún otro cambio.
      # `--cov-report=json` es nuevo: lo consume el gate por módulo del step
      # siguiente, que hasta ahora no ejecutaba nadie.
      - name: Run tests with coverage
        env:
          ENV: dev
          TEST_DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_suite  # pragma: allowlist secret
        run: >-
          pytest -n auto --cov=.
          --cov-report=term-missing --cov-report=xml --cov-report=json
          --cov-fail-under=78

      # Pisos de cobertura POR MÓDULO (scripts/check_coverage_per_module.py).
      # Hasta ahora sus umbrales —scraper 75 %, shared 80 %, api 65 %…— no los
      # enforzaba nadie: el único invocador era `Makefile:66`
      # (`make check-coverage-modules`), un target manual que no está en
      # `make check` ni en ningún workflow. El `--cov-fail-under=78` global de
      # arriba no los sustituye: un módulo puede desplomarse a 40 % y el total
      # seguir por encima de 78 si otro sube.
      #
      # Va aquí y no en `static-analysis`, que es donde pedía el plan, por un
      # motivo material: el checker lee `coverage.json`, que solo existe después
      # de correr la suite. `static-analysis` no ejecuta tests (ni debe: es el
      # job rápido de lint/typecheck, 10 min de techo) y hacerlo depender de
      # `test` invertiría el orden y le añadiría 25 min. Este es el único job con
      # los datos delante y no cuesta un runner extra.
      #
      # Solo en 3.13: en el barrido semanal la matriz añade 3.12 y el gate
      # duplicado no aporta nada — la cobertura no depende del intérprete.
      - name: Coverage floors per module
        if: matrix.python-version == '3.13'
        run: python scripts/check_coverage_per_module.py

      - name: Upload coverage XML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

      # E5: gate de cobertura sobre el diff del PR.
      # Falla el job si las líneas modificadas no están cubiertas al >= 80 %.
      # Solo aplica en pull_request — no bloquea pushes a main.
      - name: Diff coverage gate (PR only)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install diff-cover
          # Sin --depth=1: el checkout de este job ya usa fetch-depth: 0, así
          # que la historia está completa. Volver a traer la base en shallow
          # le ponía una frontera a origin/$BASE_REF y diff-cover moría con
          # "fatal: origin/master...HEAD: no merge base". Colaba solo cuando
          # el tip de la base era padre directo del merge del PR (es decir,
          # justo después de integrar master), y fallaba el resto de veces.
          git fetch origin "$BASE_REF"
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80 \
            --html-report=diff-cover.html
        continue-on-error: false

      - name: Upload diff-cover report
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-cover-report
          path: diff-cover.html

  # ── Fuzzing del contrato API ────────────────────────────────────────
  # La suite prueba los caminos que alguien pensó en escribir. Este job genera
  # entradas desde el propio OpenAPI y comprueba que ninguna de las ~137
  # operaciones devuelve 5xx: un 4xx es validación funcionando, un 500 es una
  # excepción sin manejar. Encontró cuatro en su primera ejecución.
  # Bloqueante desde el día 1 con una allowlist que solo puede encoger — un
  # gate en "modo aviso" no lo ejecuta nadie (misma lección que ADR-014).
  api-fuzz:
    name: API contract fuzzing (Schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero de CI, no es un secreto real
          POSTGRES_DB: tenderflow_fuzz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: dev
      DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_fuzz  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Instalación inline (mismo patrón que diff-cover en el job `test`):
          # es tooling de un único job, no una dependencia de la suite. Si
          # alguna vez se usa en local, mover a requirements-dev.in y recompilar
          # (scripts/check_requirements_sync.py lo verifica).
          # Hypothesis va pineado igual que schemathesis: el gate se declara
          # determinista (`derandomize=True` en scripts/fuzz_api_contract.py),
          # pero el corpus lo genera Hypothesis, así que con un rango abierto
          # los 25 ejemplos por operación cambiaban al resolver pip una versión
          # nueva. Eso hace que un fallo latente aparezca en el PR de quien
          # pasaba por ahí (pasó el 2026-08-13 con el NUL de /competitive/bajas,
          # vivo desde el 3-ago). Pinear no oculta nada: un 5xx sigue siendo un
          # 5xx, pero el gate culpa al commit correcto.
          # jsonschema-rs va pineado por el mismo motivo, y hacía falta: es
          # el core Rust del que sale `CanonicalSchema`, y schemathesis lo
          # declara `>=0.49.0`, sin cota superior. Al publicarse la 0.50.0
          # desapareció `CanonicalSchema.is_satisfiable()`, que schemathesis
          # 4.24.3 sigue llamando, así que el gate reventaba con un
          # AttributeError *generando* los casos — antes de tocar ninguna
          # ruta, y en todos los PRs a la vez. Comprobado que 0.49.9 expone
          # el método y 0.50.0 no.
          pip install "schemathesis==4.24.3" "hypothesis==6.165.5" "jsonschema-rs==0.49.9"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Seed deterministic data
        run: python scripts/seed_dev.py --with-predicciones

      - name: Fuzz every operation
        run: python scripts/fuzz_api_contract.py --max-examples 25

  # ── Cola con dramatiq real ──────────────────────────────────────────
  # ── Schema: dry-run de compilación de migraciones ──────────────────
  schema-migrations:
    name: Schema migrations (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Generate SQL for all migrations (no apply)
        env:
          ENV: dev
        run: |
          alembic upgrade head --sql > /tmp/migrations.sql
          echo "---- SQL preview (first 200 lines) ----"
          head -n 200 /tmp/migrations.sql
          test -s /tmp/migrations.sql

  # ── Schema: online apply real contra Postgres (no solo --sql dry-run) ──
  # `--sql` (job de arriba) solo valida que alembic compile SQL contra
  # SQLite; nunca detecta DDL escrita para SQLite que rompe en Postgres real
  # (AUTOINCREMENT, datetime('now'), sqlite_master...) -- exactamente la
  # clase de bug de v51/v53/v54/v55. Este job corre `alembic upgrade head`
  # online contra un Postgres real, más el downgrade/re-upgrade que
  # verifica reversibilidad.
  schema-migrations-postgres:
    name: Schema migrations (online apply, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # pgvector/pgvector:pg16 en vez de postgres:16 desnudo: v56 corre
        # `CREATE EXTENSION IF NOT EXISTS vector` (plan Pliegos+RAG, F5) --
        # la extensión pgvector requiere los binarios compilados, ausentes en
        # la imagen oficial de Postgres. Imagen mantenida por el proyecto
        # pgvector, basada en postgres:16 + la extensión precompilada.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero local, no es un secreto real
          POSTGRES_DB: tenderflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Apply all migrations against real Postgres
        env:
          ENV: dev
          DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_ci  # pragma: allowlist secret
        run: alembic upgrade head

      # BLOQUEANTE desde ADR-021. Antes no lo era porque la cadena nunca se
      # había ejercitado en downgrade contra Postgres real; se verificó que sí
      # lo es. El destino es `baseline002`, no `base`: `baseline001` lanza a
      # propósito ("No se puede revertir el baseline"), así que `downgrade base`
      # no puede terminar nunca en verde y no sirve de gate.
      #
      # Sustituye a tests/test_rollback_alembic_migrations.py, que verificaba lo
      # mismo sellando Alembic sobre el schema SQLite de db/schema.py — un motor
      # que ya no existe (ADR-021). Esto lo comprueba contra el real.
      - name: Downgrade a baseline (verifica reversibilidad de v14..head)
        env:
          ENV: dev
          DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_ci  # pragma: allowlist secret
        run: alembic downgrade baseline002

      - name: Re-upgrade a head (verifica el round-trip completo)
        env:
          ENV: dev
          DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_ci  # pragma: allowlist secret
        run: alembic upgrade head

  # ── Security audit (independiente) ──────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # 12 y no 5. Los 5 estaban calibrados para caché de pip CALIENTE: en master,
    # con la caché poblada, el job termina en ~1 min. En una rama nueva la caché
    # falla, hay que descargar `pip-audit` más los ~130 pines de
    # `requirements.txt`, y el job se fue a 5 m 15 s — o sea que **fallaba por
    # estrenar rama**, no por encontrar nada. Un gate que se pone rojo por un
    # fallo de caché enseña a re-lanzar sin leer, que es como se acaba
    # re-lanzando uno que sí tenía razón.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt

      - name: Audit dependencies
        # CVEs ignoradas (re-evaluar trimestralmente):
        #   PYSEC-2024-277 — dependencia transitiva, no afecta a rutas críticas. Última revisión: 2026-05.
        #   PYSEC-2026-161 — sin fix disponible. Última revisión: 2026-05.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2026-161

      # `requirements-dev.txt` tiene 132 pines, de los cuales 76 son los
      # mismos de `requirements.txt` y ya los cubre el paso de arriba: lo que
      # este añade son los ~56 restantes (pytest, schemathesis, diff-cover…),
      # que hasta ahora no auditaba nadie. No van a la imagen de producción,
      # pero se ejecutan en CI con el checkout del repo delante, así que un
      # paquete comprometido ahí es un problema real.
      #
      # Siguen fuera de cobertura los que los workflows instalan a mano y sin
      # fijar (bandit en ci.yml y security.yml, mutmut en mutation-sample.yml,
      # detect-secrets en security.yml): no están en ningún lockfile.
      - name: Audit dev dependencies
        run: >-
          pip-audit -r requirements-dev.txt
          --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2026-161

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # No había **ningún** escáner de dependencias npm en todo el repo: la
      # alerta de nanoid (#104, GHSA-2v37-7h3g-55p8) vivió desde el 2026-08-14
      # sin que CI pudiera verla. Trivy solo mira la imagen de la API, que no
      # lleva `node_modules`. Son dos árboles distintos —`/web` es la app y la
      # raíz lleva los paquetes de Vercel—, y `npm audit` no es recursivo.
      - name: Audit npm dependencies (web)
        working-directory: web
        run: npm audit --audit-level=high

      - name: Audit npm dependencies (raíz)
        run: npm audit --audit-level=high

  # ── SAST: depende de static-analysis (ahorra runner si lint falla) ─
  bandit:
    name: SAST (bandit)
    needs: [static-analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Lee la configuración de [tool.bandit] en pyproject.toml
        run: |
          bandit -c pyproject.toml -r api db scraper scheduler shared config \
            --format json --output bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Docker: depende de tests (solo build si tests pasan) ───────────
  docker-build:
    name: Docker build + Trivy scan
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image (runtime target)
        run: docker build -f docker/Dockerfile.api --target runtime --tag licitaciones-sap:ci .

      - name: Smoke test (image starts)
        run: |
          docker run --rm -e ENV=dev --entrypoint python licitaciones-sap:ci -c "import api.app; print('imports OK')"

      - name: Trivy vulnerability scan (image) — tabla en consola
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          # Fichero de excepciones documentadas (falsos positivos / sin fix disponible)
          trivyignores: .trivyignore

      - name: Trivy vulnerability scan (image) — SARIF para upload
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.sarif

  # ── Contrato API↔web: openapi.json y api.d.ts sin drift ─────────────
  codegen-drift:
    name: Codegen Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Export OpenAPI schema (offline)
        env:
          ENV: dev
        run: python scripts/export_openapi.py

      - name: Regenerate typed client
        run: npm run codegen:file
        working-directory: web

      - name: Fail on drift (regenerar con `make openapi` y commitear)
        run: git diff --exit-code api/openapi.json web/src/generated/api.d.ts

      # El gate de arriba verifica que el artefacto está SINCRONIZADO, no que
      # el contrato DIGA algo: una ruta que devuelve `dict[str, Any]` lo pasa
      # y genera `{ [key: string]: unknown }` en el cliente. Este ratchet
      # (allowlist que sólo puede encoger, patrón TID251) impide que la
      # superficie opaca crezca.
      - name: API contract ratchet (no new opaque responses)
        run: python scripts/check_openapi_contract.py

  # ── Frontend: typecheck, lint, unit tests, build ────────────────────
  frontend:
    name: Frontend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage (vitest)
        # Los umbrales viven en web/vitest.config.ts (statements 68 %, lines 70 %,
        # functions 68 %, branches 63 %). Falla el job si la cobertura baja.
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-coverage-lcov
          path: web/coverage/lcov.info
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  # ── Frontend E2E: Playwright contra backend real (BLOQUEANTE) ───────
  # Antes era un smoke con `continue-on-error: true`, es decir, un job que no
  # podía suspender: sin backend todas las rutas redirigían a /login y los
  # specs aceptaban "estoy en el dashboard O en el login" como éxito. Ahora el
  # job aprovisiona Postgres, aplica migraciones, siembra datos deterministas,
  # levanta la API y sirve el build de producción, así que los specs pueden
  # exigir contenido concreto — y el job bloquea el merge.
  frontend-e2e:
    name: Frontend E2E (Playwright, backend real)
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero de CI, no es un secreto real
          POSTGRES_DB: tenderflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: dev
      DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_e2e  # pragma: allowlist secret
      # Alta self-service ABIERTA en el E2E, y declarada, no heredada.
      #
      # `api/routes/auth.py::register` la abre con `ALLOW_SELF_REGISTRATION` o
      # con `ENV=dev`, y `web/e2e/login.spec.ts` decide con la variable pública
      # si ejercita la pestaña de «Crear cuenta» o comprueba que no se ofrece.
      # Sin declararlas, esa spec verificaba siempre la rama cerrada y la
      # abierta no la probaba nadie — y el caso del borrado RGPD, que necesita
      # una cuenta desechable porque anonimiza al usuario y le revoca las
      # sesiones, no tenía cómo crearla sin tocar el usuario del seed del que
      # depende el resto de la suite.
      ALLOW_SELF_REGISTRATION: "1"
      NEXT_PUBLIC_ALLOW_SELF_REGISTRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Seed deterministic data
        run: python scripts/seed_dev.py --with-predicciones

      # El limitador es global por IP (120 req/60s) y los specs cargan decenas
      # de páginas, cada una con varias llamadas a través del proxy: sin subir
      # el techo, la suite se llenaría de 429 y fallaría por el motivo
      # equivocado. `/api/v1/health/ready` tampoco está exento.
      - name: Start API
        env:
          APP_PROFILE: api
          API_RATE_LIMIT_MAX_CALLS: "100000"
        run: |
          nohup python -m uvicorn api.app:app --host 0.0.0.0 --port 8080 > /tmp/uvicorn.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:8080/api/v1/health/ready > /dev/null; do sleep 1; done'
          echo "API lista"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # `API_BASE_URL` se hornea aquí: los rewrites de next.config.ts se
      # resuelven en build time, no al arrancar. Con la API ya viva, el
      # codegen best-effort resuelve el spec real en vez de degradar.
      - name: Build frontend
        working-directory: web
        env:
          API_BASE_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: web
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

      # Sin esto, un fallo por backend caído se diagnostica a ciegas.
      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-api-log
          path: /tmp/uvicorn.log
          if-no-files-found: ignore

  # El check `Commitlint (PR titles)` no está aquí: vive en pr-title.yml porque
  # necesita el evento `edited` (corregir el título de un PR debe volver a
  # evaluarlo) y este workflow no puede escucharlo sin relanzar la suite entera
  # a cada edición del título o la descripción.
