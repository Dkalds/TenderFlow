name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main", "develop"]
  # Sin `schedule`: el barrido semanal existía solo para la matriz de Python
  # 3.12 del job `test`. Desde 2026-10 `requires-python` es `>=3.13`, la misma
  # menor de `.python-version`, la imagen y los lockfiles, y no queda otra
  # versión que probar.

permissions:
  contents: read

concurrency:
  # El evento entra en el grupo: sin él, un run de otro evento sobre la misma
  # ref (el cron semanal que hubo hasta 2026-10, un `push` y un `pull_request`)
  # cancela (cancel-in-progress) el que estuviera en curso, y el commit se queda
  # sin CI.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static analysis: merged quality + pre-commit (misma setup) ──────
  static-analysis:
    name: Lint, typecheck & pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Postgres aquí no es para tests: `scripts/gen_schema_doc.py --check`
    # necesita una base sobre la que aplicar `alembic upgrade head` para leer
    # el catálogo. Sin instancia real el documento volvería a mantenerse a
    # mano, que es exactamente lo que lo dejó describiendo un motor retirado y
    # las versiones v1-v20 mientras Alembic iba por la v102. Imagen pgvector
    # porque v56 hace `CREATE EXTENSION vector`.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero de CI, no es un secreto real
          POSTGRES_DB: tenderflow_schema_doc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # [pliegos]: mypy necesita el módulo pypdf instalado para
          # scraper/document_fetcher.py (no solo un stub) — sin esto falla
          # con "Cannot find implementation or library stub for module pypdf".
          pip install -e ".[pliegos]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      # `make typecheck` (mypy .) y no una lista de paquetes: la lista omitía
      # `services/` y `llm/`, o sea que el invariante de AGENTS.md §3.1 ("todo el
      # código de producción pasa strict") no estaba verificado justo para el
      # paquete más grande. Apuntar al target del Makefile evita que la lista
      # vuelva a quedarse atrás cuando aparezca un paquete nuevo.
      - name: Type check (mypy)
        run: make typecheck

      # Los gates y ratchets de scripts/check_*.py corren agrupados: la lista,
      # el grupo de cada uno y el motivo de los que no corren aquí viven en
      # scripts/run_gates.py (tests/test_unit_run_gates.py falla ante un
      # check_* sin clasificar). Ninguno corta a los demás: el resumen final
      # dice todos los que fallan, no solo el primero.
      - name: Gates stdlib (make gates)
        run: make gates

      - name: Gates que importan la app (make gates-deps)
        run: make gates-deps

      - name: Verify generated docs (retención, índices RFC y ADR)
        run: |
          python scripts/gen_retention_doc.py --check
          python scripts/gen_rfc_index.py --check
          python scripts/gen_adr_index.py --check

      # docs/STATUS.md se deriva del código: paridad de jobs, ratchet TID251,
      # motor de la suite, superficie de la API. Si un hecho se puede calcular,
      # no se escribe a mano — es lo que evitaba que el backlog siguiera
      # marcando como pendiente trabajo ya integrado.
      - name: Verify docs/STATUS.md is in sync with the code
        env:
          ENV: dev
        run: python scripts/gen_status.py --check

      # Misma regla que STATUS.md, aplicada al esquema: docs/database-schema.md
      # se deriva de una BD migrada a head. Se mantuvo a mano hasta 2026-09 y
      # acabó documentando tablas y un motor que ya no existían.
      - name: Verify docs/database-schema.md is in sync with the schema
        env:
          ENV: dev
          TEST_DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_schema_doc  # pragma: allowlist secret
        run: python scripts/gen_schema_doc.py --check

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # ── Tests contra el motor de producción (ADR-018, ADR-021) ─────────
  # Hubo un job `test` sobre SQLite y otro `test-postgres` sobre el motor
  # real. Con SQLite retirado (ADR-021) eran el mismo job, así que se
  # consolidaron: esta es la única suite y corre contra Postgres.
  test:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Una sola versión: la de `.python-version`, la imagen de producción y
        # `requires-python` (>=3.13). Hasta 2026-10 el barrido semanal añadía
        # 3.12; con el suelo en 3.13 ya no es una versión soportada. Sigue siendo
        # matriz para que el check conserve su nombre, `Tests (Postgres) (3.13)`,
        # que es el que exige la protección de `master`.
        # tests/test_unit_version_python.py ata esta lista a `.python-version`.
        python-version: ["3.13"]
    # Postgres es el único motor desde ADR-021: la suite ya no tiene camino
    # SQLite, así que este job necesita una instancia real. Imagen pgvector
    # porque la migración v56 hace `CREATE EXTENSION vector`.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero de CI, no es un secreto real
          POSTGRES_DB: tenderflow_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # [pliegos]: tests/test_document_fetcher.py ejercita extracción real
          # de PDF (pypdf), no solo el fallback de "extra ausente".
          pip install -e ".[pliegos]"

      # `-n auto`: el fixture de sesión materializa el DDL una sola vez entre
      # workers (lock de fichero en el tmp compartido del run) y los schemas
      # por test llevan el pid, así que no colisionan. Medido en un contenedor
      # de 4 CPUs: 3094 tests en 359 s con -n auto, frente a >600 s en serie,
      # sin fallos de aislamiento. El techo del job son 35 min desde el
      # 2026-10-17: con ~8.900 tests el paso tarda unos 19 min en `master`
      # (run 39065274885, 18 min 54 s), y en el PR #483, solapado con ese run,
      # superó los 25 min del techo anterior y el runner lo canceló sin que
      # ningún test fallara. 35 deja margen a un runner lento sin tapar una
      # suite que se dispare: una pasada normal queda a ~15 min del límite.
      # Si el paralelo diera falsos rojos, quitar `-n auto` restaura la
      # ejecución en serie sin ningún otro cambio.
      # `--cov-report=json` es nuevo: lo consume el gate por módulo del step
      # siguiente, que hasta ahora no ejecutaba nadie.
      - name: Run tests with coverage
        env:
          ENV: dev
          TEST_DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_suite  # pragma: allowlist secret
        run: >-
          pytest -n auto --cov=.
          --cov-report=term-missing --cov-report=xml --cov-report=json
          --cov-fail-under=78

      # Pisos de cobertura POR MÓDULO (scripts/check_coverage_per_module.py).
      # Hasta ahora sus umbrales —scraper 75 %, shared 80 %, api 65 %…— no los
      # enforzaba nadie: el único invocador era `Makefile:66`
      # (`make check-coverage-modules`), un target manual que no está en
      # `make check` ni en ningún workflow. El `--cov-fail-under=78` global de
      # arriba no los sustituye: un módulo puede desplomarse a 40 % y el total
      # seguir por encima de 78 si otro sube.
      #
      # Va aquí y no en `static-analysis`, que es donde pedía el plan, por un
      # motivo material: el checker lee `coverage.json`, que solo existe después
      # de correr la suite. `static-analysis` no ejecuta tests (ni debe: es el
      # job rápido de lint/typecheck, 10 min de techo) y hacerlo depender de
      # `test` invertiría el orden y le añadiría 25 min. Este es el único job con
      # los datos delante y no cuesta un runner extra.
      #
      - name: Coverage floors per module
        run: python scripts/check_coverage_per_module.py

      - name: Upload coverage XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

      # E5: gate de cobertura sobre el diff del PR.
      # Falla el job si las líneas modificadas no están cubiertas al >= 80 %.
      # Solo aplica en pull_request — no bloquea pushes a main.
      - name: Diff coverage gate (PR only)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install diff-cover
          # Sin --depth=1: el checkout de este job ya usa fetch-depth: 0, así
          # que la historia está completa. Volver a traer la base en shallow
          # le ponía una frontera a origin/$BASE_REF y diff-cover moría con
          # "fatal: origin/master...HEAD: no merge base". Colaba solo cuando
          # el tip de la base era padre directo del merge del PR (es decir,
          # justo después de integrar master), y fallaba el resto de veces.
          git fetch origin "$BASE_REF"
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80 \
            --html-report=diff-cover.html
        continue-on-error: false

      - name: Upload diff-cover report
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff-cover-report
          path: diff-cover.html

  # ── Fuzzing del contrato API ────────────────────────────────────────
  # La suite prueba los caminos que alguien pensó en escribir. Este job genera
  # entradas desde el propio OpenAPI y comprueba que ninguna de las ~137
  # operaciones devuelve 5xx: un 4xx es validación funcionando, un 500 es una
  # excepción sin manejar. Encontró cuatro en su primera ejecución.
  # Bloqueante desde el día 1 con una allowlist que solo puede encoger — un
  # gate en "modo aviso" no lo ejecuta nadie (misma lección que ADR-014).
  api-fuzz:
    name: API contract fuzzing (Schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero de CI, no es un secreto real
          POSTGRES_DB: tenderflow_fuzz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: dev
      DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_fuzz  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Instalación inline (mismo patrón que diff-cover en el job `test`):
          # es tooling de un único job, no una dependencia de la suite. Si
          # alguna vez se usa en local, mover a requirements-dev.in y recompilar
          # (scripts/check_requirements_sync.py lo verifica).
          # Hypothesis va pineado igual que schemathesis: el gate se declara
          # determinista (`derandomize=True` en scripts/fuzz_api_contract.py),
          # pero el corpus lo genera Hypothesis, así que con un rango abierto
          # los 25 ejemplos por operación cambiaban al resolver pip una versión
          # nueva. Eso hace que un fallo latente aparezca en el PR de quien
          # pasaba por ahí (pasó el 2026-08-13 con el NUL de /competitive/bajas,
          # vivo desde el 3-ago). Pinear no oculta nada: un 5xx sigue siendo un
          # 5xx, pero el gate culpa al commit correcto.
          # jsonschema-rs va pineado por el mismo motivo, y hacía falta: es
          # el core Rust del que sale `CanonicalSchema`, y schemathesis lo
          # declara `>=0.49.0`, sin cota superior. Al publicarse la 0.50.0
          # desapareció `CanonicalSchema.is_satisfiable()`, que schemathesis
          # 4.24.3 sigue llamando, así que el gate reventaba con un
          # AttributeError *generando* los casos — antes de tocar ninguna
          # ruta, y en todos los PRs a la vez. Comprobado que 0.49.9 expone
          # el método y 0.50.0 no.
          pip install "schemathesis==4.24.3" "hypothesis==6.165.5" "jsonschema-rs==0.49.9"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Seed deterministic data
        run: python scripts/seed_dev.py --with-predicciones

      - name: Fuzz every operation
        run: python scripts/fuzz_api_contract.py --max-examples 25

  # ── Cola con dramatiq real ──────────────────────────────────────────
  # ── Schema: online apply real contra Postgres ──────────────────────
  # Corre `alembic upgrade head` online contra un Postgres real, más el
  # downgrade/re-upgrade que verifica reversibilidad. Sustituye al antiguo
  # dry-run `--sql`, que solo compilaba contra SQLite (ADR-021 lo retiró): en
  # modo offline las migraciones no pueden inspeccionar el esquema, así que
  # contra Postgres no hay `--sql` posible, y contra SQLite eran casi todas
  # no-op y nunca detectaban DDL que rompe en Postgres (v51/v53/v54/v55).
  schema-migrations-postgres:
    name: Schema migrations (online apply, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # pgvector/pgvector:pg16 en vez de postgres:16 desnudo: v56 corre
        # `CREATE EXTENSION IF NOT EXISTS vector` (plan Pliegos+RAG, F5) --
        # la extensión pgvector requiere los binarios compilados, ausentes en
        # la imagen oficial de Postgres. Imagen mantenida por el proyecto
        # pgvector, basada en postgres:16 + la extensión precompilada.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero local, no es un secreto real
          POSTGRES_DB: tenderflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Apply all migrations against real Postgres
        env:
          ENV: dev
          DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_ci  # pragma: allowlist secret
        run: alembic upgrade head

      # BLOQUEANTE desde ADR-021. Antes no lo era porque la cadena nunca se
      # había ejercitado en downgrade contra Postgres real; se verificó que sí
      # lo es. El destino es `baseline002`, no `base`: `baseline001` lanza a
      # propósito ("No se puede revertir el baseline"), así que `downgrade base`
      # no puede terminar nunca en verde y no sirve de gate.
      #
      # Sustituye a tests/test_rollback_alembic_migrations.py, que verificaba lo
      # mismo sellando Alembic sobre el schema SQLite de db/schema.py — un motor
      # que ya no existe (ADR-021). Esto lo comprueba contra el real.
      - name: Downgrade a baseline (verifica reversibilidad de v14..head)
        env:
          ENV: dev
          DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_ci  # pragma: allowlist secret
        run: alembic downgrade baseline002

      - name: Re-upgrade a head (verifica el round-trip completo)
        env:
          ENV: dev
          DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_ci  # pragma: allowlist secret
        run: alembic upgrade head

  # ── Security audit (independiente) ──────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # 12 y no 5. Los 5 estaban calibrados para caché de pip CALIENTE: en master,
    # con la caché poblada, el job termina en ~1 min. En una rama nueva la caché
    # falla, hay que descargar `pip-audit` más los ~130 pines de
    # `requirements.txt`, y el job se fue a 5 m 15 s — o sea que **fallaba por
    # estrenar rama**, no por encontrar nada. Un gate que se pone rojo por un
    # fallo de caché enseña a re-lanzar sin leer, que es como se acaba
    # re-lanzando uno que sí tenía razón.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt

      - name: Audit dependencies
        # CVEs ignoradas (re-evaluar trimestralmente):
        #   PYSEC-2024-277 — dependencia transitiva, no afecta a rutas críticas. Última revisión: 2026-05.
        #   PYSEC-2026-161 — sin fix disponible. Última revisión: 2026-05.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2026-161

      # `requirements-dev.txt` tiene 132 pines, de los cuales 76 son los
      # mismos de `requirements.txt` y ya los cubre el paso de arriba: lo que
      # este añade son los ~56 restantes (pytest, schemathesis, diff-cover…),
      # que hasta ahora no auditaba nadie. No van a la imagen de producción,
      # pero se ejecutan en CI con el checkout del repo delante, así que un
      # paquete comprometido ahí es un problema real.
      #
      # Siguen fuera de cobertura los que los workflows instalan a mano y sin
      # fijar (bandit en ci.yml y security.yml, mutmut en mutation-sample.yml,
      # detect-secrets en security.yml): no están en ningún lockfile.
      - name: Audit dev dependencies
        run: >-
          pip-audit -r requirements-dev.txt
          --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2026-161

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # No había **ningún** escáner de dependencias npm en todo el repo: la
      # alerta de nanoid (#104, GHSA-2v37-7h3g-55p8) vivió desde el 2026-08-14
      # sin que CI pudiera verla. Trivy solo mira la imagen de la API, que no
      # lleva `node_modules`. `/web` es el único árbol npm del repo (el
      # `package.json` raíz, duplicado de `/web`, se retiró).
      #
      # Pasa por `scripts/check_npm_audit.py` y no por `npm audit
      # --audit-level=high` a secas porque `npm audit` no tiene `--ignore`: un
      # aviso sin versión corregida (braces, GHSA-vfj7-8cjw-p6xm, 2026-10-03)
      # dejaba el job rojo en todas las ramas y tapaba cualquier aviso posterior.
      # El script mantiene el mismo umbral, también para devDependencies, y sus
      # excepciones caducan: están en `EXCEPCIONES`, dentro del propio script.
      - name: Audit npm dependencies (web)
        run: python scripts/check_npm_audit.py

  # ── SAST: depende de static-analysis (ahorra runner si lint falla) ─
  bandit:
    name: SAST (bandit)
    needs: [static-analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Lee la configuración de [tool.bandit] en pyproject.toml
        run: |
          bandit -c pyproject.toml -r api db scraper scheduler shared config \
            --format json --output bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Docker: depende de tests (solo build si tests pasan) ───────────
  docker-build:
    name: Docker build + Trivy scan
    needs: [test]
    runs-on: ubuntu-latest
    # 10 → 15 min: desde C3.1 se construyen dos variantes de la imagen.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # C3.1 (2026-09-18): `docker/Dockerfile.api` construye dos variantes con
      # el build arg `REQUIREMENTS_FILE`. La de la API (por defecto) instala
      # `requirements-api.txt`, sin lxml ni el ML clásico; la del pipeline, que
      # es la que corre `tenderflow-worker` en render.yaml, instala
      # `requirements-pipeline.txt`. Se construyen y se prueban las dos: la del
      # worker también llega a producción.
      - name: Build Docker image — variante API (runtime target)
        run: docker build -f docker/Dockerfile.api --target runtime --tag licitaciones-sap:ci .

      - name: Smoke test — variante API arranca sin el pipeline
        run: |
          docker run --rm -e ENV=dev -e APP_PROFILE=api --entrypoint python licitaciones-sap:ci -c "import api.app; print('imports OK')"
          # El corte tiene que verse en la imagen, no solo en el lockfile.
          docker run --rm --entrypoint python licitaciones-sap:ci -c "
          import importlib.util, sys
          presentes = [m for m in ('sklearn', 'scipy', 'statsmodels', 'networkx', 'lxml') if importlib.util.find_spec(m)]
          print('paquetes del pipeline en la imagen de la API:', presentes or 'ninguno')
          sys.exit(1 if presentes else 0)
          "

      - name: Build Docker image — variante pipeline (worker)
        run: |
          docker build -f docker/Dockerfile.api --target runtime \
            --build-arg REQUIREMENTS_FILE=requirements-pipeline.txt \
            --tag licitaciones-sap:ci-pipeline .

      - name: Smoke test — variante pipeline arranca el worker
        run: |
          docker run --rm -e ENV=dev -e APP_PROFILE=worker --entrypoint python licitaciones-sap:ci-pipeline -c "
          import api.app, scheduler.worker, scheduler.cron_plane, scheduler.jobs
          import sklearn, statsmodels, networkx, lxml
          print('imports OK')
          "

      # Aceptación de C3.1: el tamaño se mide aquí, en cada build, y no a mano.
      - name: Tamaño de las dos variantes
        run: |
          api=$(docker image inspect -f '{{.Size}}' licitaciones-sap:ci)
          pipe=$(docker image inspect -f '{{.Size}}' licitaciones-sap:ci-pipeline)
          {
            echo "### Tamaño de imagen (C3.1)"
            echo ""
            echo "| Variante | MB |"
            echo "|---|---:|"
            echo "| API (\`requirements-api.txt\`) | $((api / 1048576)) |"
            echo "| Pipeline / worker (\`requirements-pipeline.txt\`) | $((pipe / 1048576)) |"
            echo "| API / pipeline | $((api * 100 / pipe)) % |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy vulnerability scan (image) — tabla en consola
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          # Fichero de excepciones documentadas (falsos positivos / sin fix disponible)
          trivyignores: .trivyignore

      - name: Trivy vulnerability scan (image) — SARIF para upload
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.sarif

  # ── Contrato API↔web: openapi.json y api.d.ts sin drift ─────────────
  codegen-drift:
    name: Codegen Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Export OpenAPI schema (offline)
        env:
          ENV: dev
        run: python scripts/export_openapi.py

      - name: Regenerate typed client
        run: npm run codegen:file
        working-directory: web

      - name: Fail on drift (regenerar con `make openapi` y commitear)
        run: git diff --exit-code api/openapi.json web/src/generated/api.d.ts

      # El gate de arriba verifica que el artefacto está SINCRONIZADO, no que
      # el contrato DIGA algo: una ruta que devuelve `dict[str, Any]` lo pasa
      # y genera `{ [key: string]: unknown }` en el cliente. Este ratchet
      # (allowlist que sólo puede encoger, patrón TID251) impide que la
      # superficie opaca crezca.
      - name: API contract ratchet (no new opaque responses)
        run: python scripts/check_openapi_contract.py

  # ── Contrato: cambios incompatibles y fixtures del frontend (C8.2, C8.3) ──
  #
  # `codegen-drift` verifica que openapi.json y api.d.ts están SINCRONIZADOS.
  # Esto es otra pregunta: ¿el contrato cambió de forma que rompa a un cliente
  # ya desplegado? Borrar un campo de una respuesta pasa `codegen-drift` en
  # verde, porque los dos artefactos se regeneran juntos y el diff cuadra.
  api-contract-compat:
    name: API contract (breaking changes · fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Solo en PR: comparar `master` consigo mismo no dice nada.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hace falta el commit base para exportar su OpenAPI.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Export OpenAPI (PR)
        env:
          ENV: dev
        run: python scripts/export_openapi.py /tmp/openapi-head.json

      - name: Export OpenAPI (base)
        env:
          ENV: dev
          # Los datos del evento entran por env y nunca interpolados en el
          # script: `${{ }}` dentro de `run:` es lo que Semgrep marca como
          # run-shell-injection, y el nombre de una rama admite `$(...)`.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git worktree add /tmp/base "origin/${BASE_REF}"
          # El script se ejecuta desde el árbol base, no desde el de la PR: lo
          # que interesa es el contrato que la base publica hoy.
          (cd /tmp/base && python scripts/export_openapi.py /tmp/openapi-base.json)

      - name: Detect breaking changes
        env:
          # Por env, como BASE_REF en el paso anterior.
          API_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          ARGS=(--base /tmp/openapi-base.json --head /tmp/openapi-head.json)
          if [ "${API_BREAKING}" = "true" ]; then
            # La etiqueta autoriza el cambio; la RFC dice dónde está documentado.
            # Sin RFC el script falla igual, que es lo que se quiere: romper el
            # contrato sin dejar rastro escrito no es una opción.
            ARGS+=(--allow-breaking --rfc "${PR_URL}")
          fi
          python scripts/check_api_breaking.py "${ARGS[@]}"

      - name: Frontend fixtures match the contract
        run: python scripts/check_contract_fixtures.py --openapi /tmp/openapi-head.json

  # ── Frontend: typecheck, lint, unit tests, build ────────────────────
  frontend:
    name: Frontend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage (vitest)
        # Los umbrales viven en web/vitest.config.ts (statements 68 %, lines 70 %,
        # functions 68 %, branches 63 %). Falla el job si la cobertura baja.
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage-lcov
          path: web/coverage/lcov.info
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      # C7.6: el presupuesto de First Load JS por ruta. Va DESPUÉS del build
      # porque lee `.next/diagnostics/route-bundle-stats.json`, que la build
      # escribe. El techo de `web/bundle-budget.json` solo puede bajar: una ruta
      # que engorda falla aquí, no en el móvil de un cliente.
      - name: Bundle budget (C7.6)
        working-directory: ${{ github.workspace }}
        # `python3` y no `python`: el runner de ubuntu trae el primero, y este
        # job no instala Python porque no lo necesita para nada más.
        run: python3 scripts/check_bundle_budget.py

      # El informe del analizador se adjunta al job para poder responder «¿qué
      # la engordó?» sin tener que reproducir la build en local.
      - name: Bundle analyzer report
        if: always()
        working-directory: web
        run: ANALYZE=true npm run build
        continue-on-error: true

      - name: Upload bundle analyzer report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-bundle-analyzer
          path: web/.next/analyze/
          if-no-files-found: ignore

  # ── Frontend E2E: Playwright contra backend real (BLOQUEANTE) ───────
  # Antes era un smoke con `continue-on-error: true`, es decir, un job que no
  # podía suspender: sin backend todas las rutas redirigían a /login y los
  # specs aceptaban "estoy en el dashboard O en el login" como éxito. Ahora el
  # job aprovisiona Postgres, aplica migraciones, siembra datos deterministas,
  # levanta la API y sirve el build de producción, así que los specs pueden
  # exigir contenido concreto — y el job bloquea el merge.
  frontend-e2e:
    name: Frontend E2E (Playwright, backend real)
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero de CI, no es un secreto real
          POSTGRES_DB: tenderflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: dev
      DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_e2e  # pragma: allowlist secret
      # Alta ABIERTA en el E2E, y declarada, no heredada.
      #
      # `api/routes/auth.py::register` la abre con `ALLOW_SELF_REGISTRATION` o
      # con `ENV=dev`: crea la cuenta verificada y abre sesión (201). La
      # necesita el caso del borrado RGPD, que anonimiza al usuario y le revoca
      # las sesiones, y por eso crea una cuenta desechable en vez de tocar el
      # usuario del seed del que depende el resto de la suite. La pestaña de
      # «Crear cuenta» ya no depende de ninguna variable pública: se muestra
      # siempre desde el RFC 2026-10-21-alta-con-contrasena-tras-concesion.
      ALLOW_SELF_REGISTRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Seed deterministic data
        run: python scripts/seed_dev.py --with-predicciones

      # El limitador es global por IP (120 req/60s) y los specs cargan decenas
      # de páginas, cada una con varias llamadas a través del proxy: sin subir
      # el techo, la suite se llenaría de 429 y fallaría por el motivo
      # equivocado. `/api/v1/health/ready` tampoco está exento.
      - name: Start API
        env:
          APP_PROFILE: api
          API_RATE_LIMIT_MAX_CALLS: "100000"
        run: |
          nohup python -m uvicorn api.app:app --host 0.0.0.0 --port 8080 > /tmp/uvicorn.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:8080/api/v1/health/ready > /dev/null; do sleep 1; done'
          echo "API lista"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # `API_BASE_URL` se hornea aquí: los rewrites de next.config.ts se
      # resuelven en build time, no al arrancar. Con la API ya viva, el
      # codegen best-effort resuelve el spec real en vez de degradar.
      - name: Build frontend
        working-directory: web
        env:
          API_BASE_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: web
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

      # Sin esto, un fallo por backend caído se diagnostica a ciegas.
      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-api-log
          path: /tmp/uvicorn.log
          if-no-files-found: ignore

  # El check `Commitlint (PR titles)` no está aquí: vive en pr-title.yml porque
  # necesita el evento `edited` (corregir el título de un PR debe volver a
  # evaluarlo) y este workflow no puede escucharlo sin relanzar la suite entera
  # a cada edición del título o la descripción.
