name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static analysis: merged quality + pre-commit (misma setup) ──────
  static-analysis:
    name: Lint, typecheck & pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # [pliegos]: mypy necesita el módulo pypdf instalado para
          # scraper/document_fetcher.py (no solo un stub) — sin esto falla
          # con "Cannot find implementation or library stub for module pypdf".
          pip install -e ".[pliegos]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy scraper/ db/ scheduler/ observability/ config/ api/ shared/

      # Previene el patrón que causó el incidente de psycopg-pool: alguien
      # agrega una dependencia a requirements.in y olvida recompilar
      # requirements.txt, que es lo que instala docker/Dockerfile.api.
      - name: Verify requirements.txt is in sync with requirements.in
        run: python scripts/check_requirements_sync.py

      - uses: pre-commit/action@v3.0.1

  # ── Tests: multiplataforma, independiente ──────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # [pliegos]: tests/test_document_fetcher.py ejercita extracción real
          # de PDF (pypdf), no solo el fallback de "extra ausente".
          pip install -e ".[pliegos]"

      - name: Run tests with coverage
        env:
          ENV: dev
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=78

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

      # E5: gate de cobertura sobre el diff del PR.
      # Falla el job si las líneas modificadas no están cubiertas al >= 80 %.
      # Solo aplica en pull_request — no bloquea pushes a main.
      - name: Diff coverage gate (PR only)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install diff-cover
          git fetch origin "$BASE_REF" --depth=1
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80 \
            --html-report=diff-cover.html
        continue-on-error: false

      - name: Upload diff-cover report
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover-report
          path: diff-cover.html

  # ── Cola con dramatiq real ──────────────────────────────────────────
  # ── Schema: merged dry-run + rollback tests ────────────────────────
  schema-migrations:
    name: Schema migrations (dry-run + rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Generate SQL for all migrations (no apply)
        env:
          ENV: dev
        run: |
          alembic upgrade head --sql > /tmp/migrations.sql
          echo "---- SQL preview (first 200 lines) ----"
          head -n 200 /tmp/migrations.sql
          test -s /tmp/migrations.sql

      - name: Run migration rollback tests
        env:
          ENV: dev
        run: pytest tests/test_rollback_alembic_migrations.py tests/test_rollback_legacy_migrations.py -v --no-cov

  # ── Schema: online apply real contra Postgres (no solo --sql dry-run) ──
  # `--sql` (job de arriba) solo valida que alembic compile SQL contra
  # SQLite; nunca detecta DDL escrita para SQLite que rompe en Postgres real
  # (AUTOINCREMENT, datetime('now'), sqlite_master...) -- exactamente la
  # clase de bug de v51/v53/v54/v55. Este job corre `alembic upgrade head`
  # online contra un Postgres real, más `downgrade base` para verificar
  # reversibilidad.
  schema-migrations-postgres:
    name: Schema migrations (online apply, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # pgvector/pgvector:pg16 en vez de postgres:16 desnudo: v56 corre
        # `CREATE EXTENSION IF NOT EXISTS vector` (plan Pliegos+RAG, F5) --
        # la extensión pgvector requiere los binarios compilados, ausentes en
        # la imagen oficial de Postgres. Imagen mantenida por el proyecto
        # pgvector, basada en postgres:16 + la extensión precompilada.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- contenedor efímero local, no es un secreto real
          POSTGRES_DB: tenderflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Apply all migrations against real Postgres
        env:
          ENV: dev
          DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_ci  # pragma: allowlist secret
        run: alembic upgrade head

      - name: Downgrade to base (verifica reversibilidad)
        # No bloqueante todavia: la cadena v14-v50 nunca se ejercitó en
        # downgrade contra Postgres real; puede haber problemas de orden de
        # FKs preexistentes sin relación con baseline002/v53/v54/v55.
        continue-on-error: true
        env:
          ENV: dev
          DATABASE_URL: postgresql://tenderflow:tenderflow@localhost:5432/tenderflow_ci  # pragma: allowlist secret
        run: alembic downgrade base

  # ── Security audit (independiente) ──────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt

      - name: Audit dependencies
        # CVEs ignoradas (re-evaluar trimestralmente):
        #   PYSEC-2024-277 — dependencia transitiva, no afecta a rutas críticas. Última revisión: 2026-05.
        #   PYSEC-2026-161 — sin fix disponible. Última revisión: 2026-05.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2026-161

  # ── SAST: depende de static-analysis (ahorra runner si lint falla) ─
  bandit:
    name: SAST (bandit)
    needs: [static-analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Lee la configuración de [tool.bandit] en pyproject.toml
        run: |
          bandit -c pyproject.toml -r api db scraper scheduler shared config \
            --format json --output bandit-report.json || true
          bandit -c pyproject.toml -r api db scraper scheduler shared config

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Docker: depende de tests (solo build si tests pasan) ───────────
  docker-build:
    name: Docker build + Trivy scan
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image (runtime target)
        run: docker build -f docker/Dockerfile.api --target runtime --tag licitaciones-sap:ci .

      - name: Smoke test (image starts)
        run: |
          docker run --rm -e ENV=dev --entrypoint python licitaciones-sap:ci -c "import api.app; print('imports OK')"

      - name: Trivy vulnerability scan (image) — tabla en consola
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          # Fichero de excepciones documentadas (falsos positivos / sin fix disponible)
          trivyignores: .trivyignore

      - name: Trivy vulnerability scan (image) — SARIF para upload
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

  # ── Contrato API↔web: openapi.json y api.d.ts sin drift ─────────────
  codegen-drift:
    name: Codegen Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Export OpenAPI schema (offline)
        env:
          ENV: dev
        run: python scripts/export_openapi.py

      - name: Regenerate typed client
        run: npm run codegen:file
        working-directory: web

      - name: Fail on drift (regenerar con `make openapi` y commitear)
        run: git diff --exit-code api/openapi.json web/src/generated/api.d.ts

  # ── Frontend: typecheck, lint, unit tests, build ────────────────────
  frontend:
    name: Frontend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage (vitest)
        # Los umbrales viven en web/vitest.config.ts (statements 68 %, lines 70 %,
        # functions 68 %, branches 63 %). Falla el job si la cobertura baja.
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-lcov
          path: web/coverage/lcov.info
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  # ── Frontend E2E: Playwright smoke (no bloqueante) ──────────────────
  # Los specs de web/e2e son smoke tests tolerantes (verifican que las páginas
  # cargan sin errores de consola). Se ejecutan solo tras el build del frontend
  # y NO bloquean el merge (continue-on-error) porque dependen de que el backend
  # esté disponible con datos — algo que este pipeline no aprovisiona todavía.
  # Cuando los specs sean deterministas contra un backend seed, quitar
  # `continue-on-error` para volverlos bloqueantes.
  frontend-e2e:
    name: Frontend E2E (Playwright smoke)
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
