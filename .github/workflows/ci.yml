name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy dashboard/ scraper/ db/ scheduler/ observability/ config/ api/ shared/

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests with coverage
        env:
          ENV: dev
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

      # E5: gate de cobertura sobre el diff del PR.
      # Falla el job si las líneas modificadas no están cubiertas al >= 80 %.
      # Solo aplica en pull_request — no bloquea pushes a main.
      - name: Diff coverage gate (PR only)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install diff-cover
          git fetch origin "$BASE_REF" --depth=1
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80 \
            --html-report=diff-cover.html
        continue-on-error: false

      - name: Upload diff-cover report
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover-report
          path: diff-cover.html

  pre-commit:
    name: pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - uses: pre-commit/action@v3.0.1

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-277 --ignore-vuln PYSEC-2026-161

  migrations-dryrun:
    name: Alembic migrations dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate SQL for all migrations (no apply)
        env:
          ENV: dev
        run: |
          alembic upgrade head --sql > /tmp/migrations.sql
          echo "---- SQL preview (first 200 lines) ----"
          head -n 200 /tmp/migrations.sql
          test -s /tmp/migrations.sql

  migrations-rollback:
    name: Alembic migrations rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run migration rollback tests
        env:
          ENV: dev
        run: pytest tests/test_migrations_rollback.py -v --no-cov

  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Lee la configuración de [tool.bandit] en pyproject.toml
        run: |
          bandit -c pyproject.toml -r api db scraper scheduler dashboard shared config \
            --format json --output bandit-report.json || true
          bandit -c pyproject.toml -r api db scraper scheduler dashboard shared config

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  docker-build:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (runtime target)
        run: docker build -f docker/Dockerfile.api --target runtime --tag licitaciones-sap:ci .

      - name: Smoke test (image starts)
        run: |
          docker run --rm -e ENV=dev --entrypoint python licitaciones-sap:ci -c "import api.app; print('imports OK')"

      - name: Trivy vulnerability scan (image) — tabla en consola
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          # Fichero de excepciones documentadas (falsos positivos / sin fix disponible)
          trivyignores: .trivyignore

      - name: Trivy vulnerability scan (image) — SARIF para upload
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

  agents-sync-check:
    name: Agents Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify agents canon is in sync with generated files
        run: python scripts/sync_agents.py --check
