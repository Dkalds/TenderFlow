name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static analysis: merged quality + pre-commit (misma setup) ──────
  static-analysis:
    name: Lint, typecheck & pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy dashboard/ scraper/ db/ scheduler/ observability/ config/ api/ shared/

      - uses: pre-commit/action@v3.0.1

  # ── Tests: multiplataforma, independiente ──────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests with coverage
        env:
          ENV: dev
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

      # E5: gate de cobertura sobre el diff del PR.
      # Falla el job si las líneas modificadas no están cubiertas al >= 80 %.
      # Solo aplica en pull_request — no bloquea pushes a main.
      - name: Diff coverage gate (PR only)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install diff-cover
          git fetch origin "$BASE_REF" --depth=1
          diff-cover coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80 \
            --html-report=diff-cover.html
        continue-on-error: false

      - name: Upload diff-cover report
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover-report
          path: diff-cover.html

  # ── Schema: merged dry-run + rollback tests ────────────────────────
  schema-migrations:
    name: Schema migrations (dry-run + rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Generate SQL for all migrations (no apply)
        env:
          ENV: dev
        run: |
          alembic upgrade head --sql > /tmp/migrations.sql
          echo "---- SQL preview (first 200 lines) ----"
          head -n 200 /tmp/migrations.sql
          test -s /tmp/migrations.sql

      - name: Run migration rollback tests
        env:
          ENV: dev
        run: pytest tests/test_migrations_rollback.py -v --no-cov

  # ── Security audit (independiente) ──────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt

      - name: Audit dependencies
        # CVEs ignoradas (re-evaluar trimestralmente):
        #   PYSEC-2024-277 — dependencia transitiva, no afecta a rutas críticas. Última revisión: 2026-05.
        #   PYSEC-2026-161 — sin fix disponible. Última revisión: 2026-05.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-277 --ignore-vuln PYSEC-2026-161

  # ── SAST: depende de static-analysis (ahorra runner si lint falla) ─
  bandit:
    name: SAST (bandit)
    needs: [static-analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        # Lee la configuración de [tool.bandit] en pyproject.toml
        run: |
          bandit -c pyproject.toml -r api db scraper scheduler dashboard shared config \
            --format json --output bandit-report.json || true
          bandit -c pyproject.toml -r api db scraper scheduler dashboard shared config

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Docker: depende de tests (solo build si tests pasan) ───────────
  docker-build:
    name: Docker build + Trivy scan
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image (runtime target)
        run: docker build --target runtime --tag licitaciones-sap:ci .

      - name: Smoke test (image starts)
        run: |
          docker run --rm -e ENV=dev --entrypoint python licitaciones-sap:ci -c "import api.app; print('imports OK')"

      - name: Trivy vulnerability scan (image) — tabla en consola
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          # Fichero de excepciones documentadas (falsos positivos / sin fix disponible)
          trivyignores: .trivyignore

      - name: Trivy vulnerability scan (image) — SARIF para upload
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "licitaciones-sap:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

  # ── Agents sync check (independiente) ──────────────────────────────
  agents-sync-check:
    name: Agents Sync Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify agents canon is in sync with generated files
        run: python scripts/sync_agents.py --check

  # ── Frontend: typecheck, lint, unit tests, build ────────────────────
  frontend:
    name: Frontend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build
