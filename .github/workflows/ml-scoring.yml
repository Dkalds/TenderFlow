name: ML scoring predicciones

on:
  schedule:
    # Diario a las 07:30 UTC — tras el scrape de las 06:00 (timeout 30 min),
    # replica el orden del scheduler local (ml_scoring_baja corre tras la ingesta).
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-scoring
  cancel-in-progress: false

jobs:
  scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scoring batch
        env:
          # ENV=prod porque este job escribe en la BD de producción, así que
          # los validators de datos (TLS de DATABASE_URL, alertas) deben estar
          # activos. APP_PROFILE=scraper omite los secretos que solo necesita
          # el proceso HTTP (SIGNING_KEY, REDIS_URL, CORS): son ejes distintos.
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          LOG_FORMAT: json
        run: python -m scheduler.jobs.ml_predicciones scoring

      - name: Verify predicciones materialized
        env:
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          LOG_FORMAT: json
        run: python -m scheduler.jobs.ml_predicciones verify
