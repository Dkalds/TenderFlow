name: ML scoring predicciones

on:
  # Encadenado al final de cada pasada del carril de ingesta. Hasta 2026-09 era
  # un cron fijo (`30 7 * * *`) pensado para caer "entre scrapes", y no se
  # cumplía: en 30 runs (2026-08-26 → 2026-09-24) arrancó entre las 08:05 y las
  # 19:29 UTC, casi siempre hacia las 12-13 — encima de la pasada de las 12:00
  # que decía esquivar. Tras el `completed` de `scrape-daily.yml` el scoring
  # corre sobre datos recién ingeridos y nunca a la vez que la ingesta.
  # `scrape-daily` corre seis veces al día: el guard (`debe-correr`) deja pasar
  # solo la primera de cada día UTC y salta el resto en ~1 min.
  workflow_run:
    workflows: ["Scrape PLACSP diario (ATOM live feed + conectores)"]
    types: [completed]
  # Red de seguridad: si el carril de ingesta dejara de correr, el scoring y
  # sus monitores (drift, calibración, purgas) se pararían con él en silencio.
  # Minuto fuera de la hora en punto, que es cuando más retrasa Actions sus
  # crons. Si ese día ya hubo scoring, el guard lo salta.
  schedule:
    - cron: "17 9 * * *"
  # Manual: fuerza la corrida aunque ya se haya puntuado hoy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-scoring
  cancel-in-progress: false

jobs:
  scoring:
    name: Score predicciones & verify
    runs-on: ubuntu-latest
    # El 2026-09-20 el job usó 1.190 s de estos 1.200: ~11 min eran features
    # de retención que la rama baseline calculaba y tiraba, más un minuto
    # esperando hilos del pool que el CLI no cerraba. Sin ese trabajo el batch
    # ronda los 5 min; el margen queda para cuando haya modelo activo. El
    # desglose por fase sale en el resumen del job (`duraciones_s`) para ver
    # venir el siguiente acercamiento al límite.
    timeout-minutes: 20

    env:
      # ENV=prod porque este job escribe en la BD de producción, así que
      # los validators de datos (TLS de DATABASE_URL, alertas) deben estar
      # activos. APP_PROFILE=scraper omite los secretos que solo necesita
      # el proceso HTTP (SIGNING_KEY, REDIS_URL, CORS): son ejes distintos.
      ENV: prod
      APP_PROFILE: scraper
      # ADR-012: este workflow es parte del plano de orquestación activo.
      SCHEDULER_PLANE: actions
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
      LOG_FORMAT: json
      # `data/models/` es efímero en el runner: shared/model_artifacts.py
      # descarga el artefacto de la versión activa desde las Releases. Sin
      # token esa llamada va anónima contra api.github.com (60 req/h por IP, y
      # las IPs de los runners son compartidas), así que el artefacto se
      # quedaba sin resolver y el batch degradaba a baseline. Mismo patrón que
      # scrape-daily.yml.
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Overrides de repositorio → $GITHUB_ENV, y SOLO si están definidos.
      #
      # Antes esto vivía como `X: ${{ vars.X || 'literal' }}` en el `env:` del
      # step. Ese literal no es un default: SUSTITUYE al de `config/settings.py`
      # cuando la variable no está definida, que es el caso normal. Son dos
      # fuentes de verdad para el mismo valor y gana la del YAML, que ningún
      # test mira — el patrón ya costó dos incidentes (el modelo
      # `deepseek-v4-pro` EOL devolviendo 410 y tumbando el lote entero de
      # fichas, con el default de settings ya corregido). Así el default vigente
      # es siempre el del código, y la variable de repo lo pisa solo cuando
      # alguien la define de verdad.
      # Verificado por scripts/check_env_parity.py.
      - name: Exportar overrides de repositorio definidos
        env:
          IN_ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL }}
        run: |
          set -u
          if [ -n "${IN_ALERT_MIN_LEVEL:-}" ]; then
            echo "ALERT_MIN_LEVEL=$IN_ALERT_MIN_LEVEL" >> "$GITHUB_ENV"
          fi

      # Una corrida al día (UTC), dispare lo que dispare el workflow. Mira el
      # `computed_at` más reciente de `predicciones_baja`; el dispatch manual
      # fuerza. Si no puede leer la BD deja pasar: los steps reales harán
      # visible el error en vez de saltarse el día en silencio.
      - name: ¿Toca puntuar hoy?
        id: guard
        env:
          ML_SCORING_FORZAR: ${{ github.event_name == 'workflow_dispatch' }}
        run: python -m scheduler.jobs.ml_predicciones debe-correr

      - name: Scoring saltado
        if: steps.guard.outputs.correr != 'true'
        env:
          MOTIVO: ${{ steps.guard.outputs.motivo }}
        run: |
          echo "Scoring saltado (${MOTIVO:-sin motivo}): una corrida al día UTC." >> "$GITHUB_STEP_SUMMARY"

      # Código y schema se despliegan con disparadores distintos (`migrate.yml`
      # es manual). El 2026-09-19 el batch reventó a mitad con
      # `UndefinedColumn: lote_numero`: código de v140 contra una BD sin v140.
      # Mismo criterio que `/health/ready`; si la BD va por detrás, el job
      # falla aquí, antes de escribir nada, diciendo qué hacer.
      # La conexión del preflight no lleva `statement_timeout` (es la misma
      # receta que `/health/ready`); un SELECT sobre `alembic_version` no se
      # bloquea, pero el límite del step es un seguro barato.
      - name: Preflight de schema
        if: steps.guard.outputs.correr == 'true'
        timeout-minutes: 3
        run: python -m db.schema_revision

      # El batch calcula drift (PSI por feature) y calibración, y ambos avisan
      # por `observability.alerts.notify` (paso 7 del RFC 20260611-2). El canal
      # es opcional por diseño —si no está configurado la alerta solo se
      # loguea— así que sin estos secretos las alertas de deriva se quedaban en
      # el runner y morían con él. Escribe en $GITHUB_OUTPUT el `computed_at` y
      # las filas del batch agregado de baja (los usa el verify) y el resumen
      # de la corrida en $GITHUB_STEP_SUMMARY.
      - name: Run scoring batch
        id: scoring
        if: steps.guard.outputs.correr == 'true'
        timeout-minutes: 15
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: python -m scheduler.jobs.ml_predicciones scoring

      # Verifica las filas de ESTA corrida, no "algo reciente": cuenta las
      # filas agregadas con el `computed_at` exacto que reportó el batch. La
      # ventana de 26 h que usaba antes dependía de que el cron arrancara a la
      # misma hora cada día, y arrancaba con hasta ~10 h de diferencia.
      - name: Verify predicciones materialized
        if: steps.guard.outputs.correr == 'true'
        env:
          ML_VERIFY_COMPUTED_AT: ${{ steps.scoring.outputs.baja_computed_at }}
          ML_VERIFY_FILAS: ${{ steps.scoring.outputs.baja_filas }}
        run: python -m scheduler.jobs.ml_predicciones verify
