name: Scrape PLACSP bulk (refresh de N meses — manual)

# Carril bulk: descarga los ZIP mensuales de PLACSP y refresca los últimos N
# meses completos.
#
# **No tiene `schedule` a propósito.** Hasta 2026-08 corría a diario (primero
# como `scrape.yml`, luego plegado en `scrape-daily.yml` como segundo cron de
# las 05:30 UTC) y no aportaba nada: el carril ATOM de `scrape-daily.yml` ya
# trae las novedades cada 4 horas, así que el bulk sólo reprocesaba meses
# enteros que la ingesta incremental ya tenía. Lo que sí hacía era competir por
# la BD y por la ventana del carril diario.
#
# Se dispara a mano (Actions → este workflow → "Run workflow") cuando hace
# falta de verdad:
#   - hueco histórico detectado (auditoría de datos, `make audit-truth-check`);
#   - cambio de filtros/clasificador que obliga a reprocesar meses ya ingeridos;
#   - entradas `bulk_YYYYMM` acumuladas en la DLQ (el carril diario ya no las
#     reintenta — ver `scheduler/pipeline_runs.py::_run_dlq_retry`);
#   - tras una caída larga de la BD, para cerrar lo que el ATOM no alcance.
#
# Comparte el `concurrency.group: scrape` con `scrape-daily.yml`: ADR-012 exige
# un solo plano activo contra la misma BD, así que un bulk manual y un tick
# diario nunca corren a la vez — el segundo espera a que acabe el primero.
# Para backfill de un mes concreto y anterior a la ventana de N meses, usar
# `python -m scheduler.run_update --backfill YEAR MONTH` (target `make scrape`).

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Cuántos meses recientes refrescar (se ignora si hay backfill_desde)"
        default: "3"
        required: false
      # Reingesta histórica en orden ascendente (runbook reingesta-unica-placsp):
      # el ZIP mensual no trae <updated>, así que gana el último mes escrito y
      # `months` (de nuevo a viejo) dejaría cada expediente en su versión más
      # vieja. Un mes de PLACSP pasa de 2 h: un tramo por job, cada uno empieza
      # donde terminó el anterior.
      backfill_desde:
        description: "Reingesta: primer mes, YYYY-MM (vacío = refresco por months)"
        default: ""
        required: false
      backfill_hasta:
        description: "Reingesta: último mes incluido, YYYY-MM (vacío = el mismo que backfill_desde)"
        default: ""
        required: false
      # Backfill de una familia CPV recién añadida al universo de ingesta (la 32,
      # 2026-10-30): la reingesta de PLACSP solo parsea las entries con esa
      # familia (minutos por mes en vez de horas) y, antes, TED y PSCP leen solo
      # sus avisos de esa familia. Ninguna de las tres pasadas mueve un cursor.
      solo_cpv:
        description: "Backfill de una familia CPV, p. ej. 32 (vacío = todo). Exige backfill_desde"
        default: ""
        required: false
      ted_desde:
        description: "Con solo_cpv: primer día de TED, YYYYMMDD (su corpus empieza el 2026-06-01)"
        default: "20260601"
        required: false

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  bulk:
    runs-on: ubuntu-latest
    # Un mes de PLACSP son varios ZIP de miles de avisos, y el step reintenta
    # hasta dos veces: el bulk necesita un único step largo, mientras que el
    # carril diario reparte sus 120 min entre la ingesta (45), seis conectores
    # y el cierre (20). Al ser manual, un job largo no bloquea ninguna cadencia.
    #
    # 240 y no 120: el run de `months=3` del 2026-10-19 (#502) llegó a registrar
    # `status: ok, months_ok: 3` en el healthcheck pero el job se canceló
    # exactamente a los 120 min, con el pool de BD aún sin cerrar. El bulk
    # corre además los pasos post-ingesta, así que no hay un tiempo medido que
    # fijar con más precisión: 240 deja margen sobre lo observado (>120) sin
    # acercarse al tope de 360 de GitHub. Si un run vuelve a tocar el techo,
    # mirar primero qué paso consume el tiempo antes de subirlo otra vez.
    timeout-minutes: 240

    env:
      # Mismo perfil que el carril diario: escribe en la BD de producción, así
      # que los validators de datos (TLS de DATABASE_URL, alertas) tienen que
      # estar activos. APP_PROFILE=scraper omite los secretos que sólo necesita
      # el proceso HTTP.
      ENV: prod
      APP_PROFILE: scraper
      # ADR-012: el plano de orquestación activo es GitHub Actions.
      SCHEDULER_PLANE: actions
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
      LOG_FORMAT: json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Mismo preflight que `scrape-daily.yml` y `ml-scoring.yml`: el
      # 2026-10-27 (run 40437624919) este carril escribió tres meses con el
      # código de la fase B de identidad PLACSP contra una BD sin `v164`
      # (#577). Si la BD no es de la misma generación que el código, el
      # refresco (`success()` implícito) no arranca.
      - name: Preflight de schema
        timeout-minutes: 3
        run: python -m db.schema_revision

      # Overrides de repositorio → $GITHUB_ENV, y SOLO si están definidos.
      #
      # Antes esto vivía como `X: ${{ vars.X || 'literal' }}` en el `env:` del
      # step. Ese literal no es un default: SUSTITUYE al de `config/settings.py`
      # cuando la variable no está definida, que es el caso normal. Son dos
      # fuentes de verdad para el mismo valor y gana la del YAML, que ningún
      # test mira. Aquí ya costó un incidente concreto y documentado: el modelo
      # `deepseek-v4-pro` quedó EOL en NVIDIA el 2026-08-07 y devolvía 410; el
      # default de settings ya estaba corregido, pero el literal del workflow lo
      # pisaba y tumbó el lote entero. Así el default vigente es siempre el del
      # código, y la variable de repo lo pisa solo cuando alguien la define.
      # Verificado por scripts/check_env_parity.py.
      - name: Exportar overrides de repositorio definidos
        env:
          IN_ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL }}
          IN_LLM_TECH_LABELING_ENABLED: ${{ vars.LLM_TECH_LABELING_ENABLED }}
          IN_LLM_TECH_LABELING_MODEL: ${{ vars.LLM_TECH_LABELING_MODEL }}
          IN_LLM_TECH_LABELING_BATCH: ${{ vars.LLM_TECH_LABELING_BATCH }}
          IN_LLM_TECH_FEEDBACK_ENABLED: ${{ vars.LLM_TECH_FEEDBACK_ENABLED }}
        run: |
          set -u
          if [ -n "${IN_ALERT_MIN_LEVEL:-}" ]; then
            echo "ALERT_MIN_LEVEL=$IN_ALERT_MIN_LEVEL" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_LLM_TECH_LABELING_ENABLED:-}" ]; then
            echo "LLM_TECH_LABELING_ENABLED=$IN_LLM_TECH_LABELING_ENABLED" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_LLM_TECH_LABELING_MODEL:-}" ]; then
            echo "LLM_TECH_LABELING_MODEL=$IN_LLM_TECH_LABELING_MODEL" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_LLM_TECH_LABELING_BATCH:-}" ]; then
            echo "LLM_TECH_LABELING_BATCH=$IN_LLM_TECH_LABELING_BATCH" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_LLM_TECH_FEEDBACK_ENABLED:-}" ]; then
            echo "LLM_TECH_FEEDBACK_ENABLED=$IN_LLM_TECH_FEEDBACK_ENABLED" >> "$GITHUB_ENV"
          fi

      # Antes de PLACSP para que los pasos post-ingesta del bulk (vista pública,
      # dedupe, empresas) vean también lo que entra por aquí.
      - name: Backfill TED y PSCP de la familia CPV
        if: inputs.solo_cpv != ''
        timeout-minutes: 30
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          PSCP_DATASET_ID: ${{ vars.PSCP_DATASET_ID }}
          PSCP_APP_TOKEN: ${{ secrets.PSCP_APP_TOKEN }}
          SOLO_CPV: ${{ inputs.solo_cpv }}
          TED_DESDE: ${{ inputs.ted_desde }}
          BACKFILL_DESDE: ${{ inputs.backfill_desde }}
        run: |
          if [ -z "$BACKFILL_DESDE" ]; then
            echo "::error::solo_cpv exige backfill_desde"
            exit 1
          fi
          if ! [[ "$SOLO_CPV" =~ ^[0-9]{2,8}(,[0-9]{2,8})*$ ]]; then
            echo "::error::solo_cpv inválido '$SOLO_CPV': prefijos numéricos separados por coma"
            exit 1
          fi
          if ! [[ "$TED_DESDE" =~ ^[0-9]{8}$ ]]; then
            echo "::error::ted_desde inválido '$TED_DESDE': se espera YYYYMMDD"
            exit 1
          fi
          python -m scraper.connectors.ted --desde "$TED_DESDE" --cpv "$SOLO_CPV"
          python -m scraper.connectors.pscp --desde 2000-01-01 --solo-cpv "$SOLO_CPV"

      - name: Run bulk refresh
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          SCRAPER_MONTHS: ${{ inputs.months || 3 }}
          BACKFILL_DESDE: ${{ inputs.backfill_desde }}
          BACKFILL_HASTA: ${{ inputs.backfill_hasta }}
          SOLO_CPV: ${{ inputs.solo_cpv }}
          # El bulk también corre los pasos post-ingesta, así que ejecuta
          # `llm_tech_labeling` igual que el carril diario. Sin estas variables,
          # un bulk manual consumiría la ventana diaria del paso sin clasificar
          # nada (ver `_run_periodic`: el lock solo se suelta si el paso falla).
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          # Los inputs llegan por env y se validan antes de usarse: nunca se
          # interpolan dentro del script.
          if [ -n "${BACKFILL_DESDE}" ]; then
            HASTA="${BACKFILL_HASTA:-$BACKFILL_DESDE}"
            for v in "$BACKFILL_DESDE" "$HASTA"; do
              if ! [[ "$v" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
                echo "::error::Mes inválido '$v': se espera YYYY-MM"
                exit 1
              fi
            done
            ARGS=(--backfill "${BACKFILL_DESDE%-*}" "$((10#${BACKFILL_DESDE#*-}))"
                  --hasta "${HASTA%-*}" "$((10#${HASTA#*-}))")
            if [ -n "${SOLO_CPV}" ]; then
              if ! [[ "$SOLO_CPV" =~ ^[0-9]{2,8}(,[0-9]{2,8})*$ ]]; then
                echo "::error::solo_cpv inválido '$SOLO_CPV'"
                exit 1
              fi
              ARGS+=(--solo-cpv "$SOLO_CPV")
            fi
          elif [ -n "${SOLO_CPV}" ]; then
            echo "::error::solo_cpv exige backfill_desde"
            exit 1
          else
            ARGS=(--months "$SCRAPER_MONTHS")
          fi
          echo "run_update ${ARGS[*]}"
          MAX_RETRIES=2
          DELAY_SECS=90
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "=== Intento $attempt/$MAX_RETRIES ==="
            python -m scheduler.run_update "${ARGS[@]}" && exit 0
            echo "Intento $attempt fallido."
            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "Reintentando en ${DELAY_SECS}s..."
              sleep $DELAY_SECS
            fi
          done
          echo "Todos los intentos fallaron."
          exit 1

      - name: Healthcheck post-run
        if: always()
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: python -m scheduler.healthcheck --alert
