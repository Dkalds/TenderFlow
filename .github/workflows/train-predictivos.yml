name: Train & publish modelos predictivos

# Re-entrenamiento mensual de los modelos predictivos (baja y retención,
# RFC 20260611-2) **y publicación de sus artefactos en la Release `ml-models`**.
#
# Por qué existe este workflow y no es un paso más de la pipeline canónica:
# hasta 2026-08 `ml_retrain` vivía en `CANONICAL_STEPS` (dentro de
# `scrape-daily.yml`), que corre con `permissions: contents: read`. Entrenaba
# en el runner, registraba `path` + `sha256` en `model_versions`… y el `.pkl`
# moría con el runner efímero. Ninguna Release lo publicaba —`train-model.yml`
# solo sube `sap_classifier`— así que `shared/model_artifacts.py` no podía
# resolver el artefacto de ninguna versión activa y `ml-scoring.yml` servía el
# baseline histórico indefinidamente, en verde. Publicar exige
# `contents: write`, y ese permiso no debe estar en el job de ingesta.
#
# Dónde y con qué nombre se publica (2026-09): en la Release de tag fijo
# `ml-models` (`shared.release_assets.ML_MODELS_RELEASE_TAG`), que nunca es
# *latest*, y con el sha256 en el nombre (`baja_model-3fa9c1d2e4b5.pkl`, ver
# `shared.model_artifacts.rename_to_content_address`). Antes subía con nombre
# fijo a lo que fuera *latest*, y eso fallaba de dos maneras:
#   - el reentrenamiento registra vN+1 SIN activarla, pero `--clobber` pisaba
#     el asset de la vN activa: `ml-scoring` bajaba vN+1 para la fila vN, el
#     sha256 no cuadraba y `ModelArtifactMismatch` tumbaba el scoring cada día
#     hasta que alguien activara la nueva;
#   - `release.yml` crea una *latest* nueva, sin assets de modelo, con cada
#     tag `v*`: publicar una versión de software dejaba al scoring sin
#     artefactos.
# Las versiones registradas antes, con nombre fijo, se siguen resolviendo: el
# resolvedor busca por nombre en `ml-models`, en *latest* y en las Releases
# más recientes.
#
# La activación de la versión nueva sigue siendo decisión humana vía
# `db.model_registry` (salvo `ML_PRED_AUTO_ACTIVATE`): este workflow deja el
# artefacto disponible, no cambia lo que se sirve.

on:
  schedule:
    # Mensual, día 1 a las 03:00 UTC: misma cadencia que tenía el paso
    # `ml_retrain` (_SEGUNDOS_MES), fuera de la ventana del scrape (cada 4 h,
    # 55 min de presupuesto) y antes del scoring diario de las 07:30.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write # necesario para subir los artefactos a la Release

concurrency:
  group: train-predictivos
  cancel-in-progress: false

jobs:
  train:
    name: Retrain baja/retención & upload to release
    runs-on: ubuntu-latest
    # Construye el dataset histórico completo y explora hiperparámetros sobre
    # varios folds para dos modelos: presupuesto holgado frente a los 15 min
    # del clasificador SAP.
    timeout-minutes: 45

    env:
      # Mismos ejes que el resto de jobs de datos: ENV=prod activa los
      # validators (TLS de DATABASE_URL, alertas); APP_PROFILE=scraper omite
      # los secretos del proceso HTTP.
      ENV: prod
      APP_PROFILE: scraper
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
      LOG_FORMAT: json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Overrides de repositorio → $GITHUB_ENV, y SOLO si están definidos.
      #
      # Antes el step de reentrenamiento llevaba
      # `ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL || 'warn' }}`. Ese literal no
      # es un default: SUSTITUYE al de `config/settings.py` cuando la variable
      # no está definida, que es el caso normal. Dos fuentes de verdad para el
      # mismo valor, y gana la del YAML, que ningún test mira — el patrón ya
      # costó dos incidentes (ver ml-scoring.yml). Así el default vigente es
      # siempre el del código y la variable de repo lo pisa solo si alguien la
      # define de verdad. Verificado por scripts/check_env_parity.py.
      - name: Exportar overrides de repositorio definidos
        env:
          IN_ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL }}
        run: |
          set -u
          if [ -n "${IN_ALERT_MIN_LEVEL:-}" ]; then
            echo "ALERT_MIN_LEVEL=$IN_ALERT_MIN_LEVEL" >> "$GITHUB_ENV"
          fi

      # Emite `artefactos` (rutas separadas por espacio, ya con el sha256 en el
      # nombre, más su `.sha256`) por $GITHUB_OUTPUT. Sale vacío si ninguno de
      # los dos modelos tenía histórico suficiente, que no es un fallo: se
      # sigue sirviendo el baseline.
      - name: Retrain predictive models
        id: retrain
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: python -m scheduler.jobs.ml_predicciones retrain

      - name: Upload artifacts to release
        if: steps.retrain.outputs.artefactos != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTEFACTOS: ${{ steps.retrain.outputs.artefactos }}
          # Mismo literal que `shared.release_assets.ML_MODELS_RELEASE_TAG`, la
          # primera Release en la que busca shared/model_artifacts.py. Lo fija
          # tests/test_unit_train_predictivos_workflow.py: si divergen, se
          # publica donde nadie busca.
          TAG: ml-models
        run: |
          set -euo pipefail
          # Tag fijo y nunca *latest* (`--latest=false`): una release de
          # software no la desplaza, y ella no le quita el puesto a ninguna.
          # La crea `github.token`, así que su evento `release: published` no
          # dispara `release-sdk.yml`: GitHub no encadena workflows por
          # eventos de ese token.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No existe la Release $TAG; creándola"
            gh release create "$TAG" --title "ML Models" \
              --notes "Artefactos de los modelos predictivos (baja, retención) con el sha256 en el nombre. Los publica train-predictivos.yml; no es una release de software." \
              --latest=false
          fi
          # `--clobber` ya es inocuo: el nombre lleva el hash del contenido,
          # así que solo puede reescribir los mismos bytes. Se conserva para
          # que relanzar el workflow no falle por un asset que ya está.
          # shellcheck disable=SC2086 -- rutas sin espacios, split intencional
          gh release upload "$TAG" $ARTEFACTOS --clobber
          echo "Artefactos publicados en $TAG: $ARTEFACTOS"

          # `gh release upload` sale 0 aunque el asset acabe con otro nombre
          # (colisiones, sufijos). El scoring busca el asset por el nombre
          # EXACTO del fichero registrado en model_versions, así que se
          # comprueba nombre a nombre en vez de confiar en el código de salida.
          PUBLICADOS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for ruta in $ARTEFACTOS; do
            nombre=$(basename "$ruta")
            if ! echo "$PUBLICADOS" | grep -Fqx "$nombre"; then
              echo "::error::$nombre no aparece en los assets de $TAG; ml-scoring no podrá resolverlo"
              exit 1
            fi
          done
          echo "Verificado: todos los artefactos están en $TAG"
