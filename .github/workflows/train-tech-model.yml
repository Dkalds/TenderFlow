name: Train & publish tech model

# Entrenamiento y publicación del clasificador MULTI-TECNOLOGÍA
# (`scraper/tech_classifier.py`), gemelo de `train-model.yml`, que solo cubre
# el binario SAP.
#
# Por qué existe: `config/settings.py` declara `ML_TECH_ENABLED: bool = True`,
# pero ningún workflow entrenaba ni publicaba este modelo. `data/` no está
# versionado ni entra en la imagen, así que `TechnologyClassifier.is_available()`
# —un `Path.exists()` sin ruta de descarga hasta 2026-09— devolvía False en
# todas las máquinas y `precompute_ml_tecnologias` respondía `sin_modelo` en
# cada corrida mientras el paso de la pipeline salía en verde. Este workflow es
# la mitad que faltaba: el canal de distribución. La otra mitad es
# `TechnologyClassifier.ensure_downloaded()`, que baja este mismo asset.
#
# La promoción la decide `services/ml/promotion_tech.py`, con el mismo criterio
# que el binario: `recall_no_keyword` sobre el golden set HUMANO
# (`tests/fixtures/golden_set_tech.jsonl`, evaluado por `services/ml/eval_tech.py`).
# Las métricas internas del split miden imitación del regex de keywords cuando
# las etiquetas son circulares, así que no pueden decidir una publicación.

on:
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Forzar re-entrenamiento aunque el modelo exista"
        type: boolean
        default: true

permissions:
  contents: write # necesario para crear/actualizar releases

concurrency:
  group: train-tech-model
  cancel-in-progress: false

jobs:
  train:
    name: Train tech classifier & upload to release
    runs-on: ubuntu-latest
    # Sin `seed_negatives` (no hay bulks que descargar: el dataset sale entero
    # de la BD), pero se ajusta un modelo por tecnología con CV, así que el
    # presupuesto es el del entrenamiento, no el de la ingesta.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Entrena, evalúa contra el golden set y publica `data/models/tech_classifier.pkl`
      # SOLO si el gate pasa. Emite `promoted`, `version`, `rejection_reasons`,
      # `recall_no_keyword`, `macro_f1_all_labels`, `n_models` y
      # `labels_circulares` por $GITHUB_OUTPUT.
      - name: Train tech model
        id: train
        env:
          # ENV=prod porque este job lee y escribe en la BD de producción, así
          # que los validators de datos (TLS de DATABASE_URL) deben estar
          # activos. APP_PROFILE=scraper omite los secretos del proceso HTTP.
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          LOG_FORMAT: json
        run: python -m scheduler.jobs.ml_training_run tech

      # El gate solo escribe `tech_classifier.pkl` si el candidato lo supera,
      # así que su ausencia es un desenlace legítimo y no un fallo. Sin este
      # corte, el `ls` de abajo moría con "cannot access" sin explicar nada.
      - name: Report rejected candidate
        if: steps.train.outputs.promoted != 'true'
        # Los valores van por `env` y no interpolados en el script: una
        # expresión de Actions dentro de `run:` se sustituye ANTES de que bash
        # vea la línea, así que un backtick o una comilla en el texto rompería
        # el paso (o algo peor).
        env:
          VERSION: ${{ steps.train.outputs.version }}
          REASONS: ${{ steps.train.outputs.rejection_reasons }}
          RECALL_NO_KEYWORD: ${{ steps.train.outputs.recall_no_keyword }}
          MACRO_F1: ${{ steps.train.outputs.macro_f1_all_labels }}
          N_MODELS: ${{ steps.train.outputs.n_models }}
          CIRCULARES: ${{ steps.train.outputs.labels_circulares }}
          N_TRAIN: ${{ steps.train.outputs.n_train }}
          N_TEST: ${{ steps.train.outputs.n_test }}
        run: |
          {
            echo "## Modelo de tecnologías NO publicado"
            echo
            echo "El entrenamiento terminó correctamente, pero el candidato no superó el"
            echo "gate de promoción, así que la Release conserva el modelo anterior."
            echo
            echo "- Versión registrada (sin activar): \`$VERSION\`"
            echo "- Motivos: \`$REASONS\`"
            echo "- recall_no_keyword (golden humano): \`$RECALL_NO_KEYWORD\`"
            echo "- macro_f1_all_labels: \`$MACRO_F1\`"
            echo "- Etiquetas con modelo ML: \`$N_MODELS\`"
            echo "- Etiquetas circulares (salen del regex): \`$CIRCULARES\`"
            echo "- n_train / n_test: \`$N_TRAIN\` / \`$N_TEST\`"
            echo
            echo "La versión queda en \`model_versions\` para inspección y rollback."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify model artifact
        if: steps.train.outputs.promoted == 'true'
        run: |
          ls -lh data/models/tech_classifier.pkl
          cat data/models/tech_classifier.sha256

      - name: Get or create latest release tag
        id: release_tag
        if: steps.train.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # El MISMO tag que resuelven `shared/model_artifacts.py` y
          # `ensure_downloaded()` (`/releases/latest`): con el asset en otro
          # tag, ninguna máquina podría descargarlo.
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            TAG="v0.0.0-model"
            echo "No releases found, will create $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload model to release
        if: steps.train.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          VERSION: ${{ steps.train.outputs.version }}
          RECALL_NO_KEYWORD: ${{ steps.train.outputs.recall_no_keyword }}
          MACRO_F1: ${{ steps.train.outputs.macro_f1_all_labels }}
          N_MODELS: ${{ steps.train.outputs.n_models }}
          CIRCULARES: ${{ steps.train.outputs.labels_circulares }}
          N_TRAIN: ${{ steps.train.outputs.n_train }}
          N_TEST: ${{ steps.train.outputs.n_test }}
        run: |
          set -euo pipefail
          # `TAG` llega por `env`, no interpolado: una expresión de Actions
          # dentro de `run:` se sustituye antes de que bash lea la línea.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "ML Models" --notes "Artefactos de modelo"
          fi
          # Eliminar asset anterior si existe (gh ignora si no existe)
          gh release delete-asset "$TAG" tech_classifier.pkl --yes 2>/dev/null || true
          gh release delete-asset "$TAG" tech_classifier.sha256 --yes 2>/dev/null || true
          gh release upload "$TAG" \
            data/models/tech_classifier.pkl \
            data/models/tech_classifier.sha256 \
            --clobber

          # `gh release upload` sale 0 aunque el asset acabe con otro nombre
          # (colisiones, sufijos), y `ensure_downloaded()` busca el asset por
          # su nombre EXACTO. Se comprueba en vez de confiar en el exit code.
          PUBLICADOS=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for nombre in tech_classifier.pkl tech_classifier.sha256; do
            if ! echo "$PUBLICADOS" | grep -Fqx "$nombre"; then
              echo "::error::$nombre no aparece en los assets de $TAG; precompute_ml_tecnologias no podrá descargarlo"
              exit 1
            fi
          done

          {
            echo "## Modelo de tecnologías publicado"
            echo
            echo "- Release: \`$TAG\`"
            echo "- Versión: \`$VERSION\`"
            echo "- recall_no_keyword (golden humano): \`$RECALL_NO_KEYWORD\`"
            echo "- macro_f1_all_labels: \`$MACRO_F1\`"
            echo "- Etiquetas con modelo ML: \`$N_MODELS\`"
            echo "- Etiquetas circulares (salen del regex): \`$CIRCULARES\`"
            echo "- n_train / n_test: \`$N_TRAIN\` / \`$N_TEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
