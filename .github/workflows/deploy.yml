name: Deploy a producción (Render)

# Despliegue manual con verificación encadenada.
#
# `render.yaml` fija `autoDeploy: false` a propósito (un merge no debe llegar
# solo a producción), pero no existía ningún workflow que disparase el deploy ni
# que comprobase el resultado: el despliegue era una acción a mano en el
# dashboard y el único chequeo posterior era el cron de smoke, con lo que un
# deploy malo podía pasar desapercibido hasta el siguiente ciclo.
#
# Requiere configurar:
#   - secrets.RENDER_DEPLOY_HOOK_URL  (Render → tenderflow-api → Settings →
#     Deploy Hook). Es una URL con token: va como secret, nunca como variable.
#   - vars.SMOKE_BASE_URL / secrets.SMOKE_API_KEY (los mismos que usa smoke.yml).

on:
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: "Desplegar sin esperar al chequeo posterior (solo para rollbacks urgentes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Disparar deploy y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar configuración
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error title=Falta el deploy hook::Definí el secret RENDER_DEPLOY_HOOK_URL con la URL del Deploy Hook de tenderflow-api."
            exit 1
          fi
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "::error title=Falta SMOKE_BASE_URL::Sin la URL pública no se puede verificar el deploy."
            exit 1
          fi

      - name: Disparar deploy en Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          codigo=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          if [ "$codigo" -ge 300 ]; then
            echo "::error title=Deploy rechazado::Render devolvió HTTP $codigo"
            cat /tmp/deploy.json || true
            exit 1
          fi
          echo "Deploy encolado (HTTP $codigo)."

      # Render no expone el fin del despliegue por el deploy hook, así que se
      # sondea el healthcheck hasta que la instancia nueva responde. El
      # `start-period` cubre además el arranque en frío del plan free.
      - name: Esperar a que la API responda
        if: ${{ !inputs.skip_smoke }}
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          set -uo pipefail
          for intento in $(seq 1 60); do
            estado=$(curl -sS -o /dev/null -w "%{http_code}" "$SMOKE_BASE_URL/api/v1/health/ready" || echo "000")
            if [ "$estado" = "200" ]; then
              echo "API lista tras $intento intentos."
              exit 0
            fi
            echo "Intento $intento: HTTP $estado — reintentando en 15 s."
            sleep 15
          done
          echo "::error title=La API no llegó a responder::15 minutos sin un 200 en /health/ready."
          exit 1

      # Gate de alineación código ↔ schema (S6.2). Va ANTES del smoke y por
      # separado porque su diagnóstico es distinto: aquí el despliegue "funciona"
      # —la API responde 200— pero exige columnas que la BD todavía no tiene, y
      # el fallo aparecerá más tarde, en la primera consulta que las toque. Es el
      # incidente que motivó `migrate.yml` (`column "lote_id" of relation
      # "adjudicaciones" does not exist`), que hasta ahora ningún gate veía.
      - name: Verificar alineación del schema
        if: ${{ !inputs.skip_smoke }}
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          set -uo pipefail
          payload=$(curl -sS --max-time 30 "$SMOKE_BASE_URL/api/v1/health/ready" || echo '{}')
          schema=$(printf '%s' "$payload" | python -c "import json,sys; print(json.load(sys.stdin).get('schema_revision','unknown'))" 2>/dev/null || echo unknown)
          echo "schema_revision = $schema"
          case "$schema" in
            behind*|ahead*)
              echo "::error title=Schema desalineado::/health/ready dice '$schema'. El código desplegado y la BD no son la misma generación: aplicá Actions → 'Apply DB migrations (alembic)' con mode=apply (si es 'behind') o desplegá el commit correcto (si es 'ahead')."
              exit 1
              ;;
            unknown|unconfigured)
              echo "::warning title=Alineación de schema sin verificar::/health/ready devolvió '$schema'. El sondeo no pudo leer alembic_version; el deploy continúa, pero este gate no cubrió nada."
              ;;
            *)
              echo "Schema alineado."
              ;;
          esac

      # El gate real: 200 no significa que la pantalla tenga datos. Este script
      # nació justo de dos incidentes en los que producción respondía 200 con
      # payloads vacíos y nadie se enteró. Desde S6.2 también falla si
      # `schema_revision` viene desalineado (scripts/smoke_prod.py::_status_ok).
      - name: Chequeo sintético post-deploy
        if: ${{ !inputs.skip_smoke }}
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: python scripts/smoke_prod.py

      # Todo lo que viene de `inputs`, `job` o `github` viaja por `env:` y se lee
      # como variable de shell. Interpolar `${{ ... }}` dentro de un bloque
      # `run:` es el patrón que Semgrep marca como
      # `yaml.github-actions.security.run-shell-injection`: el valor se pega en
      # el script ANTES de que exista el shell, así que un input con comillas o
      # `$(...)` ejecuta comandos en el runner. Este hallazgo dejó `security.yml`
      # en rojo desde el 2026-08-17 y con él el escaneo semanal entero
      # (`semgrep --error` aborta el job, y sin job no hay subida de SARIF).
      - name: Resumen
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          SKIP_SMOKE: ${{ inputs.skip_smoke }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$SKIP_SMOKE" = "true" ]; then
            verificacion="omitida (skip_smoke)"
          else
            verificacion="ejecutada"
          fi
          {
            echo "### Deploy a producción"
            echo ""
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Verificación posterior: $verificacion"
            echo "- Resultado: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
