name: Deploy a producción (Render)

# Despliegue manual con verificación encadenada. **Este workflow es el ÚNICO
# disparador de despliegues a producción** (O0.2 del plan de arquitectura v2,
# decisión del 2026-09-06 que cierra D4).
#
# Por qué único y no uno de dos: con `autoDeploy` activo en Render, un push a
# `master` despliega por su cuenta el commit que sea, con CI en rojo o sin CI, y
# además compite con este workflow — un mismo push llega a producir dos deploys.
# Todo el aparato de gates (jobs de CI, ratchets, fuzzing, E2E) queda entonces como
# advisory: informa, no impide. Con `autoDeploy: false` en `render.yaml` el
# único camino es este, que se lanza a mano sobre un commit elegido y verifica
# el resultado en tres pasos (healthcheck, alineación de schema, smoke).
#
# Alcance exacto de «único»: gobierna `tenderflow-api`, que es el servicio que
# atiende internet (y consume la cola a demanda, ADR-028 §G), y
# `tenderflow-mcp` (el servidor MCP interno, ADR-036), los dos con
# `autoDeploy: false` en `render.yaml`. El MCP se despliega del mismo commit y
# solo cuando la API ha pasado su verificación. Hasta el 2026-10-19 había un
# tercero, `tenderflow-worker`: se retiró porque en el plan free de Render
# hibernaba a los ~15 min y su plano de cron solo corría tras un deploy; la
# ingesta y el scoring siguen en Actions y la cola la consume la API. Los tres
# servicios de observabilidad (Prometheus, Alertmanager, Grafana) conservan a
# propósito el autoDeploy por defecto de Render —su configuración va horneada en
# la imagen, así que una regla de alerta editada solo llega a producción con un
# build nuevo—, y por tanto un push a `master` los sigue redesplegando. El porqué
# está en la cabecera de `render.yaml`; se dice aquí para que «único disparador»
# no se lea como «ningún deploy ocurre sin este workflow».
#
# Condición de validez: este fichero solo debe existir mientras `Auto-Deploy`
# esté en **No** en el servicio real. Es el paso 2 del checklist de la cabecera
# de `render.yaml`, todavía sin confirmar el 2026-09-06. Si algún día se decide
# lo contrario —dejar autoDeploy activo—, lo que corresponde es borrar este
# workflow, no dejar los dos caminos abiertos.
#
# Antes de que existiera, el despliegue era una acción a mano en el dashboard y
# el único chequeo posterior era el cron de smoke, con lo que un deploy malo
# podía pasar desapercibido hasta el siguiente ciclo.
#
# Requiere configurar:
#   - secrets.RENDER_DEPLOY_HOOK_URL  (Render → tenderflow-api → Settings →
#     Deploy Hook). Es una URL con token: va como secret, nunca como variable.
#   - secrets.RENDER_MCP_DEPLOY_HOOK_URL  (lo mismo en tenderflow-mcp). A
#     diferencia del de la API es OPCIONAL: sin él el paso se salta con un
#     aviso, para que este workflow no se rompa antes de que el servicio exista
#     (docs/runbooks/mcp-interno.md, paso 3). Cuando exista, defínelo: un MCP que
#     se queda atrás en otra generación del código que la BD lee con un esquema
#     que ya no es el suyo.
#   - vars.SMOKE_BASE_URL / secrets.SMOKE_API_KEY (los mismos que usa smoke.yml).

on:
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: "Desplegar sin esperar al chequeo posterior (solo para rollbacks urgentes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Disparar deploy y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verificar configuración
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error title=Falta el deploy hook::Definí el secret RENDER_DEPLOY_HOOK_URL con la URL del Deploy Hook de tenderflow-api."
            exit 1
          fi
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "::error title=Falta SMOKE_BASE_URL::Sin la URL pública no se puede verificar el deploy."
            exit 1
          fi

      - name: Disparar deploy en Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          codigo=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          if [ "$codigo" -ge 300 ]; then
            echo "::error title=Deploy rechazado::Render devolvió HTTP $codigo"
            cat /tmp/deploy.json || true
            exit 1
          fi
          echo "Deploy encolado (HTTP $codigo)."

      # Render no expone el fin del despliegue por el deploy hook, así que se
      # sondea el healthcheck hasta que responde la instancia nueva. Un 200 a
      # secas no basta: Render despliega sin corte y la instancia anterior sigue
      # respondiendo 200 hasta que la nueva está viva. Hasta el 2026-10-17 esta
      # espera salía al primer intento contra la vieja, y el gate de schema y el
      # smoke la verificaban a ella (run 38766484577). Ahora se espera a que
      # `/health/ready` diga que sirve `github.sha` (campo `commit`), y su
      # payload queda en un fichero para que el gate de schema juzgue esa misma
      # respuesta. Los 15 minutos de margen cubren el build de la imagen, no un
      # spin-down: el servicio corre en `standard` desde antes del 2026-08-28
      # (render.yaml).
      #
      # El deploy hook despliega la punta de `master` del momento, no
      # `github.sha`: si entra otro push entre lanzar el workflow y el hook,
      # esta espera vence y lo dice («sirve X, no Y»), en vez de dar por bueno
      # un commit que no es el elegido.
      - name: Esperar a que la API sirva el commit desplegado
        if: ${{ !inputs.skip_smoke }}
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: python scripts/esperar_deploy.py --commit "$COMMIT_SHA" --salida "$RUNNER_TEMP/health-ready.json"

      # Gate de alineación código ↔ schema (S6.2). Va ANTES del smoke y por
      # separado porque su diagnóstico es distinto: aquí el despliegue "funciona"
      # —la API responde 200— pero exige columnas que la BD todavía no tiene, y
      # el fallo aparecerá más tarde, en la primera consulta que las toque. Es el
      # incidente que motivó `migrate.yml` (`column "lote_id" of relation
      # "adjudicaciones" does not exist`), que hasta ahora ningún gate veía.
      #
      # Lee el payload que el paso anterior verificó, no uno nuevo: así el
      # veredicto es el de la instancia que sirve `github.sha`.
      - name: Verificar alineación del schema
        if: ${{ !inputs.skip_smoke }}
        run: |
          set -uo pipefail
          payload=$(cat "$RUNNER_TEMP/health-ready.json" 2>/dev/null || echo '{}')
          schema=$(printf '%s' "$payload" | python -c "import json,sys; print(json.load(sys.stdin).get('schema_revision','unknown'))" 2>/dev/null || echo unknown)
          echo "schema_revision = $schema"
          case "$schema" in
            behind*|ahead*)
              echo "::error title=Schema desalineado::/health/ready dice '$schema'. El código desplegado y la BD no son la misma generación: aplicá Actions → 'Apply DB migrations (alembic)' con mode=apply (si es 'behind') o desplegá el commit correcto (si es 'ahead')."
              exit 1
              ;;
            unknown|unconfigured)
              echo "::warning title=Alineación de schema sin verificar::/health/ready devolvió '$schema'. El sondeo no pudo leer alembic_version; el deploy continúa, pero este gate no cubrió nada."
              ;;
            *)
              echo "Schema alineado."
              ;;
          esac

      # El gate real: 200 no significa que la pantalla tenga datos. Este script
      # nació justo de dos incidentes en los que producción respondía 200 con
      # payloads vacíos y nadie se enteró. Desde S6.2 también falla si
      # `schema_revision` viene desalineado (scripts/smoke_prod.py::_status_ok).
      - name: Chequeo sintético post-deploy
        if: ${{ !inputs.skip_smoke }}
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: python scripts/smoke_prod.py

      # El servidor MCP va después de que la API haya pasado su verificación:
      # mismo commit, y solo si es bueno. Con `skip_smoke` se despliega igual,
      # que es lo que quiere un rollback urgente. Sin sondeo propio: su
      # `/healthz` no dice qué commit sirve y la versión vieja sigue
      # respondiendo mientras Render construye; si la nueva no arranca, Render
      # la descarta (Render → tenderflow-mcp → Events).
      #
      # Opcional: mientras el servicio no exista no hay hook, y esto no puede
      # tumbar el despliegue de la API. Un hook definido pero rechazado por
      # Render SÍ falla el paso: eso ya es un servicio que existe y se queda
      # atrás.
      - name: Disparar deploy del MCP
        id: mcp
        env:
          MCP_DEPLOY_HOOK: ${{ secrets.RENDER_MCP_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$MCP_DEPLOY_HOOK" ]; then
            echo "::notice title=MCP sin desplegar::No hay secret RENDER_MCP_DEPLOY_HOOK_URL: se omite el deploy de tenderflow-mcp (normal mientras el servicio no exista)."
            echo "omitido=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          codigo=$(curl -sS -o /tmp/deploy-mcp.json -w "%{http_code}" -X POST "$MCP_DEPLOY_HOOK")
          if [ "$codigo" -ge 300 ]; then
            echo "::error title=Deploy del MCP rechazado::Render devolvió HTTP $codigo"
            cat /tmp/deploy-mcp.json || true
            exit 1
          fi
          echo "Deploy del MCP encolado (HTTP $codigo). Su resultado se ve en Render → tenderflow-mcp → Events."

      # Todo lo que viene de `inputs`, `job` o `github` viaja por `env:` y se lee
      # como variable de shell. Interpolar `${{ ... }}` dentro de un bloque
      # `run:` es el patrón que Semgrep marca como
      # `yaml.github-actions.security.run-shell-injection`: el valor se pega en
      # el script ANTES de que exista el shell, así que un input con comillas o
      # `$(...)` ejecuta comandos en el runner. Este hallazgo dejó `security.yml`
      # en rojo desde el 2026-08-17 y con él el escaneo semanal entero
      # (`semgrep --error` aborta el job, y sin job no hay subida de SARIF).
      - name: Resumen
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          SKIP_SMOKE: ${{ inputs.skip_smoke }}
          JOB_STATUS: ${{ job.status }}
          MCP_OUTCOME: ${{ steps.mcp.outcome }}
          MCP_OMITIDO: ${{ steps.mcp.outputs.omitido }}
        run: |
          if [ "$SKIP_SMOKE" = "true" ]; then
            verificacion="omitida (skip_smoke)"
          else
            verificacion="ejecutada"
          fi
          case "$MCP_OUTCOME" in
            success)
              if [ "$MCP_OMITIDO" = "true" ]; then
                mcp="omitido: no hay secret RENDER_MCP_DEPLOY_HOOK_URL"
              else
                mcp="deploy encolado; su resultado, en Render → tenderflow-mcp → Events"
              fi
              ;;
            failure) mcp="Render rechazó el deploy hook" ;;
            *) mcp="no desplegado: un paso anterior falló, y sigue en la versión previa" ;;
          esac
          {
            echo "### Deploy a producción"
            echo ""
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Verificación posterior: $verificacion"
            echo "- MCP: $mcp"
            echo "- Resultado: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
