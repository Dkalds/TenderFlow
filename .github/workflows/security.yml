name: Security scans

# Escaneo programado y subida de SARIF. Bandit, pip-audit y Trivy **también**
# corren en ci.yml en cada push/PR; tenerlos aquí con los mismos triggers hacía
# que cada PR ejecutase dos veces los mismos escáneres y construyese dos veces
# la imagen Docker completa, además de con dos versiones distintas de
# trivy-action. El gate por PR se queda en ci.yml (que es el que bloquea el
# merge) y este workflow conserva lo que allí no hay: Semgrep, detect-secrets,
# el barrido semanal y la subida a code-scanning.
on:
  schedule:
    - cron: "0 5 * * 1"  # Lunes 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: semgrep scan --config=p/ci --config=p/python --config=p/security-audit --config=p/owasp-top-ten --error --sarif --output=semgrep.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  detect-secrets:
    name: detect-secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Audit against baseline
        run: |
          detect-secrets scan --baseline .secrets.baseline
          detect-secrets audit .secrets.baseline --report --only-real

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install bandit
        run: pip install bandit[toml]==1.8.3

      - name: Run bandit
        run: |
          bandit -c pyproject.toml -r api/ db/ scraper/ scheduler/ config/ shared/ \
            --severity-level medium \
            --confidence-level medium \
            -f json \
            -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: bandit-report
          path: bandit-report.json

  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      # NOTA: Los CVE ignorados en ci.yml (audit job) se re-evalúan aquí sin --ignore-vuln.
      # Si este job falla por esos mismos CVE, es señal de que ya tienen fix y se pueden
      # eliminar del ignore list en ci.yml.
      # Refs: PYSEC-2024-277, PYSEC-2026-161
      - name: Run pip-audit
        run: pip-audit --strict --desc

  trivy-image:
    name: Trivy — Docker image scan
    runs-on: ubuntu-latest
    # Sin condición de evento: antes se excluía del cron (`!= 'schedule'`)
    # porque ya corría en cada push, y al dejar este workflow como semanal eso
    # lo habría dejado sin ejecutarse nunca. El escaneo por PR sigue en ci.yml;
    # esta pasada es la que sube el SARIF a code-scanning.
    strategy:
      fail-fast: false
      matrix:
        image:
          - { dockerfile: "docker/Dockerfile.api", tag: "licitaciones-api:ci" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f ${{ matrix.image.dockerfile }} -t ${{ matrix.image.tag }} .

      - name: Run Trivy scan (table — visible in logs)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ matrix.image.tag }}
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          format: "table"

      - name: Run Trivy scan (SARIF — for GitHub Code Scanning)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: always()
        with:
          image-ref: ${{ matrix.image.tag }}
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"
          format: "sarif"
          output: "trivy-${{ matrix.image.tag }}.sarif"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-${{ matrix.image.tag }}.sarif"
          category: "trivy-${{ matrix.image.tag }}"

  secrets-rotation-reminder:
    name: Secrets rotation reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remind about credential rotation
        run: |
          echo "::notice title=Rotación de credenciales::Recuerda rotar la password del rol de BD y API_HMAC_SECRET cada 90 días. Última verificación: $(date -u +%Y-%m-%d). Doc: docs/SECURITY.md"
