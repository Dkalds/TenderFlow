name: Re-key PLACSP — relleno de organo_ref_fuente (manual)

# «Antes de la ventana», pasos 3 y 4 de docs/runbooks/rekey-placsp-organo.md:
# rellena `licitaciones.organo_ref_fuente` del histórico PLACSP desde los ZIP
# mensuales (`scripts/rellenar_organo_ref_placsp.py`) y mide la puerta 1 con
# `scripts/inventario_pisadas_placsp.py`. `v164_identidad_placsp_rekey` aborta
# mientras quede una fila de la familia sin órgano (run 41076300422 del
# 2026-10-30: 24.763), y el script necesita el DATABASE_URL de producción, que
# solo tienen los secrets del repo.
#
# Modos:
#   inventario — solo mide (solo lectura).
#   meses      — lista los ZIP que leería, sin descargar.
#   plan       — descarga y cuenta lo que escribiría, sin escribir (default).
#   aplicar    — escribe mes a mes. Idempotente (solo filas con la columna
#                vacía) y reanudable: si el job se corta, relanzarlo continúa.
#   colisiones — lista las filas escritas ya con la clave nueva que la guarda
#                «ya existen con la clave nueva» de v164 encontraría (solo
#                lectura). Tiene sentido tras el relleno.
#   borrar-colisiones — las borra, salvo las que tengan datos de usuario
#                (`scripts/borrar_colisiones_rekey_placsp.py`). Con
#                `incluir_sin_organo`, también las filas que el relleno no
#                resolvió (último paso del runbook; mirar antes el plan).
#   refrescar  — tras migrar: refresca `licitaciones_canonicas` e invalida las
#                cachés (paso 6 de la ventana).
#   hijas      — tras la reingesta única: cuenta las hijas que una pisada dejó
#                en la fila superviviente y lista los datos de usuario a mover
#                (`scripts/limpiar_hijas_pisadas_placsp.py`, solo lectura).
#                Exige `reingesta_desde`.
#   limpiar-hijas — las borra (paso 5 de docs/runbooks/reingesta-unica-placsp.md).
# Todos terminan con el inventario en el resumen del run.
#
# **Sin el preflight de schema de los carriles de ingesta, a propósito**: la BD
# está en v163 y el código de master exige v166, justo porque v164 espera a este
# relleno. El script solo escribe `organo_ref_fuente`, que existe desde v163.
#
# Comparte `concurrency.group: scrape` con los carriles de ingesta (ADR-012),
# salvo `plan`/`aplicar` con rango: cada rango lleva su grupo y corren en
# paralelo (el cuello es la descarga de PLACSP, 4-15 min por ZIP; un run sin
# rango no cabe en las 6 h del runner, medido en el run 41082387658). Es seguro
# porque el relleno solo escribe filas con la columna vacía: dos rangos que
# resuelvan la misma fila no se pisan. Con la ingesta en marcha no se lanzan
# rangos: la ventana del runbook la para antes.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "inventario · meses · plan (cuenta, no escribe) · aplicar · colisiones · borrar-colisiones · refrescar · hijas · limpiar-hijas"
        type: choice
        options:
          - inventario
          - meses
          - plan
          - aplicar
          - colisiones
          - borrar-colisiones
          - refrescar
          - hijas
          - limpiar-hijas
        default: plan
        required: true
      desde:
        description: "Primer mes YYYY-MM (con hasta, fuerza el rango; vacío = los meses pendientes)"
        default: ""
        required: false
      hasta:
        description: "Último mes YYYY-MM, incluido"
        default: ""
        required: false
      respaldo_por_nombre:
        description: "Al final, deducir el órgano del nombre cuando las demás filas son unánimes"
        type: boolean
        default: false
        required: false
      incluir_sin_organo:
        description: "colisiones/borrar-colisiones: incluir las filas que siguen sin órgano tras el relleno"
        type: boolean
        default: false
        required: false
      reingesta_desde:
        description: "hijas/limpiar-hijas: inicio de la reingesta única, ISO UTC (p. ej. 2026-10-31T15:37:00)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ (inputs.modo == 'plan' || inputs.modo == 'aplicar') && inputs.desde != ''
        && format('rekey-placsp-{0}-{1}', inputs.desde, inputs.hasta) || 'scrape' }}
  cancel-in-progress: false

jobs:
  relleno:
    runs-on: ubuntu-latest
    # Un ZIP mensual por mes pendiente, y hay filas `placsp` actualizadas desde
    # 2017: holgura hasta el máximo de un runner alojado. Si se corta, relanzar.
    timeout-minutes: 350

    env:
      ENV: prod
      APP_PROFILE: scraper
      SCHEDULER_PLANE: actions
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
      LOG_FORMAT: json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Relleno de organo_ref_fuente
        if: contains(fromJSON('["meses", "plan", "aplicar"]'), inputs.modo)
        shell: bash
        env:
          MODO: ${{ inputs.modo }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          RESPALDO: ${{ inputs.respaldo_por_nombre }}
        # `shell: bash` es `bash -eo pipefail`: si el script falla, el `tee` no
        # tapa su código de salida.
        run: |
          # Los inputs llegan por env y se validan antes de usarse.
          ARGS=()
          for par in "desde:$DESDE" "hasta:$HASTA"; do
            v="${par#*:}"
            if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
              echo "::error::${par%%:*} inválido '$v': se espera YYYY-MM"
              exit 1
            fi
          done
          [ -n "$DESDE" ] && ARGS+=(--desde "$DESDE")
          [ -n "$HASTA" ] && ARGS+=(--hasta "$HASTA")
          [ "$RESPALDO" = "true" ] && ARGS+=(--respaldo-por-nombre)
          case "$MODO" in
            meses) ARGS+=(--solo-meses) ;;
            aplicar) ARGS+=(--aplicar) ;;
          esac
          echo "Args: ${ARGS[*]}"
          {
            echo "### Relleno ($MODO)"
            echo '```'
            python -m scripts.rellenar_organo_ref_placsp "${ARGS[@]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Colisiones con la clave nueva
        if: inputs.modo == 'colisiones' || inputs.modo == 'borrar-colisiones'
        shell: bash
        env:
          MODO: ${{ inputs.modo }}
          SIN_ORGANO: ${{ inputs.incluir_sin_organo }}
        run: |
          ARGS=()
          [ "$MODO" = "borrar-colisiones" ] && ARGS+=(--aplicar)
          [ "$SIN_ORGANO" = "true" ] && ARGS+=(--sin-organo)
          {
            echo "### Colisiones ($MODO)"
            echo '```'
            python -m scripts.borrar_colisiones_rekey_placsp "${ARGS[@]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Hijas de las filas pisadas
        if: inputs.modo == 'hijas' || inputs.modo == 'limpiar-hijas'
        shell: bash
        env:
          MODO: ${{ inputs.modo }}
          REINGESTA_DESDE: ${{ inputs.reingesta_desde }}
        run: |
          [ -n "$REINGESTA_DESDE" ] || { echo "::error::falta reingesta_desde"; exit 1; }
          ARGS=(--desde "$REINGESTA_DESDE")
          [ "$MODO" = "limpiar-hijas" ] && ARGS+=(--aplicar)
          {
            echo "### Hijas de las pisadas ($MODO)"
            echo '```'
            python -m scripts.limpiar_hijas_pisadas_placsp "${ARGS[@]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refrescar canónicas e invalidar cachés
        if: inputs.modo == 'refrescar'
        run: |
          python -c "from db.repositories.publico import refrescar_vista_canonicas as r; print(r())"
          python -c "from db.cache_signal import signal_cache_invalidation as s; s()"

      # Corre también si el relleno falla o se corta: lo escrito hasta entonces
      # cuenta, y la cifra dice desde dónde relanzar.
      - name: Inventario (puerta 1 del runbook)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Inventario"
            echo '```'
            python -m scripts.inventario_pisadas_placsp
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
