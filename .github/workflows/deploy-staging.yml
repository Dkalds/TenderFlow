name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deploying (use only for hotfixes)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  id-token: write  # OIDC para autenticación en cloud si se usa

concurrency:
  group: staging-deploy
  cancel-in-progress: false  # no cancelar deploys en curso para evitar estados inconsistentes

jobs:
  # ── 1. Tests (smoke gate) ──────────────────────────────────────────────────
  test:
    name: Smoke tests
    runs-on: ubuntu-latest
    if: ${{ inputs.skip_tests != 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -m "unit and not slow" --tb=short -q

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy . --config-file pyproject.toml

  # ── 2. Build Docker images ─────────────────────────────────────────────────
  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.STAGING_REGISTRY_URL }}
          username: ${{ secrets.STAGING_REGISTRY_USER }}
          password: ${{ secrets.STAGING_REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.STAGING_REGISTRY_URL }}/licitaciones-sap
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ secrets.STAGING_REGISTRY_URL }}/licitaciones-sap-api:sha-${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ${{ secrets.STAGING_REGISTRY_URL }}/licitaciones-sap-dashboard:sha-${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  # ── 3. Deploy ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            # Pull latest compose files
            git fetch origin staging
            git checkout origin/staging -- docker-compose.yml docker-compose.staging.yml

            # Set image tags and environment
            export IMAGE_TAG=sha-${{ needs.build.outputs.short_sha }}
            export ENV=staging
            export REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}"
            export SIGNING_KEY="${{ secrets.SIGNING_KEY }}"
            export API_HMAC_SECRET="${{ secrets.API_HMAC_SECRET }}"
            export DASHBOARD_PASSWORD_HASH="${{ secrets.DASHBOARD_PASSWORD_HASH }}"
            export STAGING_TURSO_DATABASE_URL="${{ secrets.STAGING_TURSO_DATABASE_URL }}"
            export STAGING_TURSO_AUTH_TOKEN="${{ secrets.STAGING_TURSO_AUTH_TOKEN }}"

            # Pull new images
            docker pull ${{ secrets.STAGING_REGISTRY_URL }}/licitaciones-sap-api:${IMAGE_TAG}
            docker pull ${{ secrets.STAGING_REGISTRY_URL }}/licitaciones-sap-dashboard:${IMAGE_TAG}

            # Rolling restart (zero-downtime donde sea posible)
            docker compose -f docker-compose.yml -f docker-compose.staging.yml \
              up -d --remove-orphans --wait

            echo "Deploy complete: ${IMAGE_TAG}"

  # ── 4. Healthcheck post-deploy ─────────────────────────────────────────────
  healthcheck:
    name: Post-deploy healthcheck
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for services
        run: sleep 30

      - name: API healthcheck
        run: |
          curl --fail --silent --max-time 10 \
            "${{ secrets.STAGING_URL }}/api/v1/health" \
            | python3 -c "import sys, json; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='ok' else 1)"

      - name: Dashboard healthcheck
        run: |
          curl --fail --silent --max-time 10 \
            "${{ secrets.STAGING_DASHBOARD_URL }}/_stcore/health"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Staging deploy OK: sha-${{ needs.build.outputs.short_sha }}" \
            >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Staging healthcheck FAILED for sha-${{ needs.build.outputs.short_sha }}" \
            >> $GITHUB_STEP_SUMMARY
          exit 1
