name: Restore Drill

# Un backup que nadie restaura no es un backup. Semanalmente descarga el último
# backup de S3/R2 y verifica que restaura a una BD consultable (integrity_check +
# query de humo). Falla ruidosamente si el backup no es restaurable.

on:
  schedule:
    # Lunes 04:00 UTC (tras el backup diario de las 03:00).
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-drill:
    name: Verify latest backup restores
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt boto3

      - name: Download latest backup from S3/R2
        id: download
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX || 'backups/' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          if [ -z "$BACKUP_S3_BUCKET" ]; then
            echo "::warning::BACKUP_S3_BUCKET no configurado — drill omitido."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p data/backups
          python - <<'EOF'
          import os
          import sys

          import boto3

          bucket = os.environ["BACKUP_S3_BUCKET"]
          prefix = os.environ.get("BACKUP_S3_PREFIX", "backups/")
          endpoint = os.environ.get("AWS_ENDPOINT_URL") or None

          s3 = boto3.client("s3", endpoint_url=endpoint)
          resp = s3.list_objects_v2(Bucket=bucket, Prefix=prefix)
          objs = [o for o in resp.get("Contents", []) if o["Key"].endswith(".db.gz")]
          if not objs:
              print(f"::error::No hay backups .db.gz en s3://{bucket}/{prefix}")
              sys.exit(1)

          latest = max(objs, key=lambda o: o["LastModified"])
          dest = "data/backups/" + latest["Key"].split("/")[-1]
          s3.download_file(bucket, latest["Key"], dest)
          print(f"Descargado: {latest['Key']} -> {dest}")
          EOF
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Verify backup restores
        if: steps.download.outputs.skipped != 'true'
        run: python scripts/restore_db.py --verify
