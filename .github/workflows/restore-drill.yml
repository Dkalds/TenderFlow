name: Restore Drill

# Un backup que nadie restaura no es un backup. Semanalmente descarga el último
# backup de S3/R2 y verifica que restaura a una BD consultable (integrity_check +
# query de humo). Falla ruidosamente si el backup no es restaurable.

on:
  schedule:
    # Lunes 04:00 UTC (tras el backup diario de las 03:00).
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # descarga el artefacto del último backup cuando no hay S3
  id-token: write # credenciales temporales OIDC para el bucket de backup

jobs:
  restore-drill:
    name: Verify latest backup restores
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    services:
      postgres:
        # postgres:16 amd64 digest, refreshed by the dependency-update workflow.
        image: postgres@sha256:da8cf245a60506e50a0a8cbb0f39c559ca622d92490605b67fcadc74ca1ea8e4
        env:
          POSTGRES_USER: tenderflow
          POSTGRES_PASSWORD: tenderflow # pragma: allowlist secret -- contenedor efímero, no es un secreto
          POSTGRES_DB: tenderflow_restore_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate restore-drill configuration
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -eu
          : "${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY es obligatorio para el restore drill}"
          if [ -n "${AWS_ROLE_TO_ASSUME:-}" ] && [ -z "${BACKUP_S3_BUCKET:-}" ] || \
             [ -z "${AWS_ROLE_TO_ASSUME:-}" ] && [ -n "${BACKUP_S3_BUCKET:-}" ]; then
            echo "::error::AWS_ROLE_TO_ASSUME y BACKUP_S3_BUCKET deben configurarse juntos"
            exit 1
          fi

      - name: Configure temporary AWS credentials
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' && env.BACKUP_S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-1' }}

      - name: Download latest backup from S3/R2
        id: download
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX || 'backups/' }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY es obligatorio para el restore drill}"
          mkdir -p data/backups
          if [ -n "${BACKUP_S3_BUCKET:-}" ]; then
            python - <<'EOF'
          import os
          import sys

          import boto3

          bucket = os.environ["BACKUP_S3_BUCKET"]
          prefix = os.environ.get("BACKUP_S3_PREFIX", "backups/")
          endpoint = os.environ.get("AWS_ENDPOINT_URL") or None

          s3 = boto3.client("s3", endpoint_url=endpoint)
          resp = s3.list_objects_v2(Bucket=bucket, Prefix=prefix)
          objs = [
              o for o in resp.get("Contents", [])
              if o["Key"].endswith((".db.gz.gpg", ".dump.gpg"))
          ]
          if not objs:
              print(f"::error::No hay backups cifrados en s3://{bucket}/{prefix}")
              sys.exit(1)

          latest = max(objs, key=lambda o: o["LastModified"])
          dest = "data/backups/" + latest["Key"].split("/")[-1]
          s3.download_file(bucket, latest["Key"], dest)
          print(f"Descargado: {latest['Key']} -> {dest}")
          EOF
          else
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backup.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            test -n "$RUN_ID"
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "db-backup-${RUN_ID}" --dir data/backups
            echo "Descargado artefacto cifrado del run ${RUN_ID}"
          fi
          ENCRYPTED=$(find data/backups -maxdepth 1 -type f -name '*.gpg' -print -quit)
          test -n "$ENCRYPTED"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --output "${ENCRYPTED%.gpg}" --decrypt "$ENCRYPTED"
          rm -f "$ENCRYPTED"

      - name: Verify backup restores
        env:
          PGPASSWORD: tenderflow # pragma: allowlist secret -- servicio PostgreSQL efímero
        run: |
          set -eo pipefail
          DUMP=$(find data/backups -maxdepth 1 -type f -name '*.dump' -print -quit)
          if [ -n "$DUMP" ]; then
            pg_restore --list "$DUMP" >/dev/null
            pg_restore --dbname=postgresql://tenderflow@localhost:5432/tenderflow_restore_drill \
              --no-owner --no-acl "$DUMP"
            psql --dbname=postgresql://tenderflow@localhost:5432/tenderflow_restore_drill \
              --command='SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '\''public'\'';'
          else
            python scripts/restore_db.py --verify
          fi
