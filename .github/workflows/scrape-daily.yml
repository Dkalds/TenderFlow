name: Scrape PLACSP diario (ATOM live feed + conectores)

# Carril diario de ingesta (ADR-012): feed ATOM en vivo de PLACSP cada 4 horas
# más los conectores multi-fuente.
#
# El carril bulk (refresh de N meses) **no vive aquí**: tiene su propio
# workflow manual, `scrape-bulk.yml`, sin `schedule`. Estuvo plegado en este
# archivo como segundo cron (05:30 UTC) durante unas horas en 2026-08 y antes
# como `scrape.yml` diario; en ambos casos reprocesaba a diario meses enteros
# que el ATOM ya había traído, y competía con este carril por la BD. Los dos
# comparten `concurrency.group: scrape`, así que siguen serializados entre sí.

on:
  schedule:
    # Cada 4 horas: 00, 04, 08, 12, 16, 20 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Presupuesto del job >= suma de los presupuestos por step (los seis
    # conectores con continue-on-error suman 45 min de peor caso; hasta
    # 2026-08 el timeout era 30 y los steps de la cola — PSCP y TACRC —
    # quedaban truncados cuando los anteriores se degradaban).
    timeout-minutes: 55

    env:
      # ENV=prod: este job escribe en la BD de producción, así que los
      # validators de datos (TLS de DATABASE_URL, alertas) deben estar activos
      # EN TODOS los steps — hasta 2026-08 Galicia/Euskadi/watched-company
      # corrían con ENV=dev y esos validators desactivados contra la misma BD.
      # APP_PROFILE=scraper omite los secretos que solo necesita el proceso
      # HTTP. La BD de producción es Supabase (ADR-016).
      ENV: prod
      APP_PROFILE: scraper
      # ADR-012: este workflow ES el plano de orquestación activo.
      SCHEDULER_PLANE: actions
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
      LOG_FORMAT: json

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Overrides de repositorio → $GITHUB_ENV, y SOLO si están definidos.
      #
      # Antes esto vivía como `X: ${{ vars.X || 'literal' }}` en el `env:` del
      # step. Ese literal no es un default: SUSTITUYE al de `config/settings.py`
      # cuando la variable no está definida, que es el caso normal. Son dos
      # fuentes de verdad para el mismo valor y gana la del YAML, que ningún
      # test mira. Aquí ya costó un incidente concreto y documentado: el modelo
      # `deepseek-v4-pro` quedó EOL en NVIDIA el 2026-08-07 y devolvía 410; el
      # default de settings ya estaba corregido, pero el literal del workflow lo
      # pisaba y tumbó el lote entero. Así el default vigente es siempre el del
      # código, y la variable de repo lo pisa solo cuando alguien la define.
      # Verificado por scripts/check_env_parity.py.
      - name: Exportar overrides de repositorio definidos
        env:
          IN_ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL }}
          IN_LLM_TECH_LABELING_ENABLED: ${{ vars.LLM_TECH_LABELING_ENABLED }}
          IN_LLM_TECH_LABELING_MODEL: ${{ vars.LLM_TECH_LABELING_MODEL }}
          IN_LLM_TECH_LABELING_BATCH: ${{ vars.LLM_TECH_LABELING_BATCH }}
          IN_LLM_TECH_FEEDBACK_ENABLED: ${{ vars.LLM_TECH_FEEDBACK_ENABLED }}
        run: |
          set -u
          if [ -n "${IN_ALERT_MIN_LEVEL:-}" ]; then
            echo "ALERT_MIN_LEVEL=$IN_ALERT_MIN_LEVEL" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_LLM_TECH_LABELING_ENABLED:-}" ]; then
            echo "LLM_TECH_LABELING_ENABLED=$IN_LLM_TECH_LABELING_ENABLED" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_LLM_TECH_LABELING_MODEL:-}" ]; then
            echo "LLM_TECH_LABELING_MODEL=$IN_LLM_TECH_LABELING_MODEL" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_LLM_TECH_LABELING_BATCH:-}" ]; then
            echo "LLM_TECH_LABELING_BATCH=$IN_LLM_TECH_LABELING_BATCH" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_LLM_TECH_FEEDBACK_ENABLED:-}" ]; then
            echo "LLM_TECH_FEEDBACK_ENABLED=$IN_LLM_TECH_FEEDBACK_ENABLED" >> "$GITHUB_ENV"
          fi

      # INGESTA de PLACSP, sin cerrar la pasada.
      #
      # Este step corría `--daily` a secas, es decir la ingesta MÁS toda la
      # secuencia canónica: KPIs, refresco de `licitaciones_canonicas`,
      # evaluación de las reglas de vigilancia y digests. Y solo entonces
      # arrancaban TED, Galicia, Euskadi, adjudicaciones vigiladas, PSCP y
      # TACRC. O sea que cinco de las siete fuentes ingerían DESPUÉS de que se
      # calculara todo lo que las tiene que incluir: su corpus del ciclo no
      # entraba en la superficie pública, ni en los agregados, ni en las alertas
      # hasta la pasada siguiente, cuatro horas más tarde.
      #
      # Los env del LLM se mudan con él al step de cierre: `llm_tech_labeling`
      # es un paso post-ingesta y aquí ya no corre.
      - name: Run daily scraper
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scheduler.run_update --daily --fase ingesta

      # Los seis conectores llevan `if: !cancelled()`: son fuentes
      # independientes del feed ATOM y no deben caerse con él. Hasta 2026-08 no
      # tenían condición, así que el `success()` implícito los dejaba a todos en
      # `skipped` cuando el step anterior salía != 0. Y ese step falla justo
      # cuando más falta hacen los demás: `run_update --daily` devuelve 1 si
      # falla la INGESTA (run 30950985697 — PLACSP con ConnectTimeout sobre
      # licitacionesPerfilesContratanteCompleto3.atom), o sea que una caída de
      # PLACSP nos dejaba además sin TED, Galicia, Euskadi, PSCP y TACRC.
      #
      # Exit code (scheduler/run_update.py): el carril diario compone el código
      # con `_apply_step_failures`. Devuelve 1 si falla la INGESTA O si
      # `_run_post_ingestion_steps` deja algún `{step: "error"}` en el resumen
      # (ml_retrain/drift_checks/digests…), emitiendo además una anotación
      # `::error` por paso. Antes miraba SOLO `ingestion_result["status"]`, así
      # que un paso post-ingesta roto NO ponía el job en rojo: los runs
      # 30916761519 y 30935191157 salieron verdes con `ml_retrain: error` y
      # `drift_checks: error`. Eso ya no pasa. Cada paso sigue enviando su email
      # de `_notify_step_failure` como antes.
      #
      # Desde que la pasada va partida (`--fase ingesta` aquí, `--fase cierre`
      # al final), esas dos mitades del exit code viven en steps distintos: la
      # ingesta lo devuelve este step y los pasos post-ingesta el de cierre.
      # Los dos ponen el job en rojo; lo que cambia es que un fallo de ingesta
      # ya no arrastra al cierre, que sigue corriendo con lo que sí entró.
      #
      # Se usa `!cancelled()` y no `always()` para que una cancelación
      # (concurrency, timeout del job) sí los detenga.
      #
      # Conector TED — Search API v3 (RFC 20260611-1 / ADR-009: fue el
      # conector usado para validar el framework multi-fuente, ~69 avisos
      # con 38/39 enlazados al maestro en la primera pasada). API pública sin
      # auth y sin dataset/índice por entorno que configurar, así que corre
      # sin gate de variable (a diferencia de PSCP/TACRC más abajo).
      - name: Run TED connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Presupuesto propio: no debe consumir el timeout del job si la API
        # pública se degrada.
        timeout-minutes: 10
        run: python -m scraper.connectors.ted

      # RSS oficiales sin credenciales. Su alcance es de descubrimiento reciente
      # y cada fuente queda aislada para que una indisponibilidad regional no
      # impida la actualización nacional ni las demás fuentes.
      - name: Run Galicia RSS connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m scraper.connectors.galicia

      - name: Run Euskadi RSS connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m scraper.connectors.euskadi

      # Carril independiente del radar TI: solo conserva adjudicaciones cuya
      # empresa está vigilada por NIF canónico. Sin NIF vigilados termina sin
      # descargar el feed; el timeout aísla cualquier degradación de PLACE.
      - name: Run watched-company awards connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m scraper.connectors.watched_company_awards

      # Conectores Fase 5 (RFC 20260611-1). Ya NO llevan gate por variable.
      #
      # Llevaban `vars.PSCP_DATASET_ID != ''` / `vars.TACRC_INDEX_URL != ''`, y
      # un step saltado se ve **exactamente igual que uno que pasa**: check
      # verde, sin anotación, sin línea en el log. Con esas variables sin
      # configurar el job salía verde sin que dos de las siete fuentes hubieran
      # corrido nunca — ausencia de monitorización indistinguible de
      # monitorización que pasa. Es el mismo antipatrón que `smoke.yml` ya
      # corrigió («sin esa variable configurada se saltaba **en verde**»).
      #
      # Ahora el conector corre siempre y es él quien decide: sin su variable
      # escribe estado `disabled` en `ops_events` y termina en 0, así que la
      # ausencia de configuración queda registrada en la tabla que lee
      # `scheduler/healthcheck.py` en vez de en un hueco del log.
      #
      # `continue-on-error` y `timeout-minutes` se mantienen: siguen siendo
      # fuentes independientes que no deben tumbar el carril diario ni comerse
      # el presupuesto del job.
      - name: Run PSCP Catalunya connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Presupuesto propio: si la API pública de Catalunya se cuelga o
        # pagina muchísimo, no debe consumir todo el timeout del job y dejar
        # sin correr al step de TACRC que viene después.
        timeout-minutes: 10
        env:
          PSCP_DATASET_ID: ${{ vars.PSCP_DATASET_ID }}
          PSCP_APP_TOKEN: ${{ secrets.PSCP_APP_TOKEN }}
        run: python -m scraper.connectors.pscp

      - name: Run TACRC resoluciones connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          TACRC_INDEX_URL: ${{ vars.TACRC_INDEX_URL }}
        run: python -m scraper.connectors.tacrc

      # CIERRE de la pasada: la secuencia canónica completa, ahora que las
      # siete fuentes ya han ingerido. Es lo que hace verdadero el contrato de
      # `db/repositories/publico.py` — «la vista va tan fresca como su último
      # REFRESH, al final de la pasada de ingesta».
      #
      # `!cancelled()` y no `success()`: si un conector falla, el cierre tiene
      # que correr igual con lo que sí entró. Sin `continue-on-error`, en
      # cambio: un cierre roto SÍ debe poner el job en rojo — es donde viven el
      # refresco de la vista pública y las alertas de vigilancia.
      - name: Cierre de la pasada (pasos post-ingesta)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          # Paso post-ingesta `llm_tech_labeling` (categorización por LLM sobre
          # la metadata del anuncio). La key va en el `env:` del step y no en el
          # del job para no exponerla a los conectores, que no la necesitan.
          # Sin ella el paso falla en bloque, suelta la ventana diaria y pone el
          # run en rojo — degradación visible, nunca silenciosa.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Flags como `vars` para poder encender/apagar y ajustar el lote desde
          # Actions → Variables, sin tocar código (mismo patrón que pliegos.yml).
          # Con la variable sin definir manda el default de config/settings.py.
        run: python -m scheduler.run_update --daily --fase cierre

      - name: Healthcheck post-run
        if: always()
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: python -m scheduler.healthcheck --alert
