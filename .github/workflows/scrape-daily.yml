name: Scrape PLACSP daily (ATOM live feed)

on:
  schedule:
    # Cada 4 horas: 02, 06, 10, 14, 18, 22 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scrape-daily
  cancel-in-progress: false

jobs:
  scrape-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily scraper
        env:
          # ENV=dev omite los validators de prod que requieren secrets de la
          # aplicación (SIGNING_KEY, API_HMAC_SECRET, REDIS_URL). El scraper no
          # usa ninguno de esos componentes. La BD de producción es Supabase
          # (ADR-016): DATABASE_URL tiene precedencia sobre TURSO_* en
          # db/connection.py. TURSO_* queda como fallback legacy.
          ENV: dev
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL || 'warn' }}
          GITHUB_TOKEN: ${{ github.token }}
          LOG_FORMAT: json
        run: python -m scheduler.run_update --daily

      # Conector TED — Search API v3 (RFC 20260611-1 / ADR-009: fue el
      # conector usado para validar el framework multi-fuente, ~69 avisos
      # con 38/39 enlazados al maestro en la primera pasada). API pública sin
      # auth y sin dataset/índice por entorno que configurar, así que corre
      # sin gate de variable (a diferencia de PSCP/TACRC más abajo).
      - name: Run TED connector
        continue-on-error: true
        # Mismo presupuesto propio que PSCP/TACRC: no debe consumir el
        # timeout del job (30 min) si la API pública se degrada.
        timeout-minutes: 10
        env:
          ENV: dev
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LOG_FORMAT: json
        run: python -m scraper.connectors.ted

      # Conectores Fase 5 (RFC 20260611-1). Se omiten hasta que sus
      # variables estén configuradas tras validar las fuentes vivas
      # (scripts/probe_pscp.py · python -m scraper.connectors.tacrc --check).
      - name: Run PSCP Catalunya connector
        if: vars.PSCP_DATASET_ID != ''
        continue-on-error: true
        # Presupuesto propio: si la API pública de Catalunya se cuelga o
        # pagina muchísimo, no debe consumir todo el timeout del job (30 min)
        # y dejar sin correr al step de TACRC que viene después.
        timeout-minutes: 10
        env:
          ENV: dev
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PSCP_DATASET_ID: ${{ vars.PSCP_DATASET_ID }}
          PSCP_APP_TOKEN: ${{ secrets.PSCP_APP_TOKEN }}
          LOG_FORMAT: json
        run: python -m scraper.connectors.pscp

      - name: Run TACRC resoluciones connector
        if: vars.TACRC_INDEX_URL != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          ENV: dev
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TACRC_INDEX_URL: ${{ vars.TACRC_INDEX_URL }}
          LOG_FORMAT: json
        run: python -m scraper.connectors.tacrc
