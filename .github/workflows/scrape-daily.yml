name: Scrape PLACSP diario (ATOM live feed + conectores)

# Carril diario de ingesta (ADR-012): feed ATOM en vivo de PLACSP cada 4 horas
# más los conectores multi-fuente.
#
# El carril bulk (refresh de N meses) **no vive aquí**: tiene su propio
# workflow manual, `scrape-bulk.yml`, sin `schedule`. Estuvo plegado en este
# archivo como segundo cron (05:30 UTC) durante unas horas en 2026-08 y antes
# como `scrape.yml` diario; en ambos casos reprocesaba a diario meses enteros
# que el ATOM ya había traído, y competía con este carril por la BD. Los dos
# comparten `concurrency.group: scrape`, así que siguen serializados entre sí.

on:
  schedule:
    # Cada 4 horas: 00, 04, 08, 12, 16, 20 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Presupuesto del job >= suma de los presupuestos por step (los seis
    # conectores con continue-on-error suman 45 min de peor caso; hasta
    # 2026-08 el timeout era 30 y los steps de la cola — PSCP y TACRC —
    # quedaban truncados cuando los anteriores se degradaban).
    timeout-minutes: 55

    env:
      # ENV=prod: este job escribe en la BD de producción, así que los
      # validators de datos (TLS de DATABASE_URL, alertas) deben estar activos
      # EN TODOS los steps — hasta 2026-08 Galicia/Euskadi/watched-company
      # corrían con ENV=dev y esos validators desactivados contra la misma BD.
      # APP_PROFILE=scraper omite los secretos que solo necesita el proceso
      # HTTP. La BD de producción es Supabase (ADR-016).
      ENV: prod
      APP_PROFILE: scraper
      # ADR-012: este workflow ES el plano de orquestación activo.
      SCHEDULER_PLANE: actions
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
      LOG_FORMAT: json

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily scraper
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL || 'warn' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scheduler.run_update --daily

      # Los seis conectores llevan `if: !cancelled()`: son fuentes
      # independientes del feed ATOM y no deben caerse con él. Hasta 2026-08 no
      # tenían condición, así que el `success()` implícito los dejaba a todos en
      # `skipped` cuando el step anterior salía != 0. Y ese step falla justo
      # cuando más falta hacen los demás: `run_update --daily` devuelve 1 si
      # falla la INGESTA (run 30950985697 — PLACSP con ConnectTimeout sobre
      # licitacionesPerfilesContratanteCompleto3.atom), o sea que una caída de
      # PLACSP nos dejaba además sin TED, Galicia, Euskadi, PSCP y TACRC.
      #
      # Exit code (scheduler/run_update.py): el carril diario compone el código
      # con `_apply_step_failures`. Devuelve 1 si falla la INGESTA O si
      # `_run_post_ingestion_steps` deja algún `{step: "error"}` en el resumen
      # (ml_retrain/drift_checks/digests…), emitiendo además una anotación
      # `::error` por paso. Antes miraba SOLO `ingestion_result["status"]`, así
      # que un paso post-ingesta roto NO ponía el job en rojo: los runs
      # 30916761519 y 30935191157 salieron verdes con `ml_retrain: error` y
      # `drift_checks: error`. Eso ya no pasa. Cada paso sigue enviando su email
      # de `_notify_step_failure` como antes.
      #
      # Se usa `!cancelled()` y no `always()` para que una cancelación
      # (concurrency, timeout del job) sí los detenga.
      #
      # Conector TED — Search API v3 (RFC 20260611-1 / ADR-009: fue el
      # conector usado para validar el framework multi-fuente, ~69 avisos
      # con 38/39 enlazados al maestro en la primera pasada). API pública sin
      # auth y sin dataset/índice por entorno que configurar, así que corre
      # sin gate de variable (a diferencia de PSCP/TACRC más abajo).
      - name: Run TED connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Presupuesto propio: no debe consumir el timeout del job si la API
        # pública se degrada.
        timeout-minutes: 10
        run: python -m scraper.connectors.ted

      # RSS oficiales sin credenciales. Su alcance es de descubrimiento reciente
      # y cada fuente queda aislada para que una indisponibilidad regional no
      # impida la actualización nacional ni las demás fuentes.
      - name: Run Galicia RSS connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m scraper.connectors.galicia

      - name: Run Euskadi RSS connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m scraper.connectors.euskadi

      # Carril independiente del radar TI: solo conserva adjudicaciones cuya
      # empresa está vigilada por NIF canónico. Sin NIF vigilados termina sin
      # descargar el feed; el timeout aísla cualquier degradación de PLACE.
      - name: Run watched-company awards connector
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: python -m scraper.connectors.watched_company_awards

      # Conectores Fase 5 (RFC 20260611-1). Se omiten hasta que sus
      # variables estén configuradas tras validar las fuentes vivas
      # (scripts/probe_pscp.py · python -m scraper.connectors.tacrc --check).
      - name: Run PSCP Catalunya connector
        if: ${{ !cancelled() && vars.PSCP_DATASET_ID != '' }}
        continue-on-error: true
        # Presupuesto propio: si la API pública de Catalunya se cuelga o
        # pagina muchísimo, no debe consumir todo el timeout del job y dejar
        # sin correr al step de TACRC que viene después.
        timeout-minutes: 10
        env:
          PSCP_DATASET_ID: ${{ vars.PSCP_DATASET_ID }}
          PSCP_APP_TOKEN: ${{ secrets.PSCP_APP_TOKEN }}
        run: python -m scraper.connectors.pscp

      - name: Run TACRC resoluciones connector
        if: ${{ !cancelled() && vars.TACRC_INDEX_URL != '' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          TACRC_INDEX_URL: ${{ vars.TACRC_INDEX_URL }}
        run: python -m scraper.connectors.tacrc

      - name: Healthcheck post-run
        if: always()
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_MIN_LEVEL: ${{ vars.ALERT_MIN_LEVEL || 'warn' }}
        run: python -m scheduler.healthcheck --alert
