name: Pliegos (fetch + chunking + embeddings)

on:
  schedule:
    # Nocturno, tras la ingesta diaria y el scoring ML (07:30 UTC) — deja
    # tiempo a que haya documentos `pending` nuevos del día antes de procesarlos.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pliegos
  cancel-in-progress: false

jobs:
  pliegos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[pliegos,ml-embeddings]"

      - name: Run pliegos batch (fetch + chunk + embed)
        env:
          # ENV=dev omite los validators de prod que requieren secrets de la
          # aplicación (mismo criterio que ml-scoring.yml). La BD de producción
          # es Supabase (ADR-016): DATABASE_URL tiene precedencia sobre TURSO_*.
          ENV: dev
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LOG_FORMAT: json
        run: |
          python -c "
          import json
          from db.database import init_db
          from scheduler.jobs.documentos_embeddings import run

          init_db()
          resumen = run()
          print(json.dumps(resumen, default=str, indent=2))
          if resumen['fetch']['error'] and not resumen['fetch']['extracted']:
              # Todo el lote falló -- señal de un problema sistémico (SSRF/red/breaker),
              # no de PDFs individuales corruptos (eso es normal y esperado).
              raise SystemExit(f\"Lote de fetch falló por completo: {resumen['fetch']}\")
          "

      - name: Report documento_chunks state
        env:
          ENV: dev
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -c "
          from db.database import connect_read

          with connect_read() as c:
              n_docs = c.execute('SELECT COUNT(*) FROM documentos').fetchone()[0]
              n_pending = c.execute(\"SELECT COUNT(*) FROM documentos WHERE status = 'pending'\").fetchone()[0]
              n_extracted = c.execute(\"SELECT COUNT(*) FROM documentos WHERE status = 'extracted'\").fetchone()[0]
              n_error = c.execute(\"SELECT COUNT(*) FROM documentos WHERE status = 'error'\").fetchone()[0]
              n_chunks = c.execute('SELECT COUNT(*) FROM documento_chunks').fetchone()[0]
          print(
              f'documentos: {n_docs} total · {n_pending} pending · '
              f'{n_extracted} extracted · {n_error} error · documento_chunks: {n_chunks}'
          )
          "
