name: Pliegos (fetch + chunking + embeddings + fichas)

on:
  schedule:
    # Nocturno, tras la ingesta diaria y el scoring ML (07:30 UTC) — deja
    # tiempo a que haya documentos `pending` nuevos del día antes de procesarlos.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      fetch_batch:
        description: "Documentos a descargar+extraer en este lote (fetch)"
        required: false
        default: "300"
      embed_batch:
        description: "Documentos a chunkear+embeber en este lote (embed)"
        required: false
        default: "100"
      facts_batch:
        description: "Licitaciones a procesar en la fase de fichas LLM (facts)"
        required: false
        default: "25"
      tech_signal_batch:
        description: "Licitaciones a puntuar en la fase de señal de tecnología (tech_signal)"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: pliegos
  cancel-in-progress: false

jobs:
  # `ci.yml` audita `requirements.txt`, pero los extras `pliegos` y
  # `ml-embeddings` no salen de ningún lockfile: se resuelven en cada pasada y
  # hasta ahora no los miraba nadie. Aquí es donde importan, porque el job
  # `pliegos` los instala con la DATABASE_URL de producción y las claves de
  # OpenAI/Anthropic/NVIDIA en el entorno.
  #
  # Va en un job **aparte y sin secretos**, no como paso previo dentro de
  # `pliegos`, y la razón es la disciplina que `scrape-daily.yml` ya deja
  # escrita: lo auxiliar no debe poder tumbar el camino de datos. Un escáner
  # que falla porque OSV publicó un aviso de `torch` a las 08:00 no puede
  # dejar sin drenar el backlog de ~44k documentos a las 09:00 — y menos sin
  # que nadie se entere, porque `scheduler/healthcheck.py` no cubre esta
  # tubería. Como job independiente el hallazgo se ve (el workflow queda en
  # rojo) sin bloquear la ingesta, y tampoco se ejecuta nada vulnerable con
  # credenciales de producción, que es lo que pasaría con `continue-on-error`.
  audit-extras:
    name: Audit de los extras sin lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[pliegos,ml-embeddings]"

      # Sin `-r`: audita el entorno ya resuelto, que es justo lo que los
      # lockfiles no alcanzan.
      - name: Audit del entorno resuelto
        run: |
          pip install pip-audit
          pip-audit \
            --ignore-vuln PYSEC-2024-277 \
            --ignore-vuln PYSEC-2026-161

  pliegos:
    runs-on: ubuntu-latest
    # El lote diario subió de 50 a 300 (PLIEGO_FETCH_BATCH) para drenar el
    # backlog de ~44k documentos en semanas en vez de meses; 30min medía
    # corto para el lote nuevo.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[pliegos,ml-embeddings]"

      # Overrides de repositorio → $GITHUB_ENV, y SOLO si están definidos.
      #
      # Antes esto vivía como `X: ${{ vars.X || 'literal' }}` en el `env:` del
      # step. Ese literal no es un default: SUSTITUYE al de `config/settings.py`
      # cuando la variable no está definida, que es el caso normal. Son dos
      # fuentes de verdad para el mismo valor y gana la del YAML, que ningún
      # test mira. Aquí ya costó un incidente concreto y documentado: el modelo
      # `deepseek-v4-pro` quedó EOL en NVIDIA el 2026-08-07 y devolvía 410; el
      # default de settings ya estaba corregido, pero el literal del workflow lo
      # pisaba y tumbó el lote entero de fichas. Así el default vigente es
      # siempre el del código, y la variable de repo lo pisa solo cuando alguien
      # la define de verdad.
      # Verificado por scripts/check_env_parity.py.
      - name: Exportar overrides de repositorio definidos
        env:
          IN_PLIEGO_FACTS_ENABLED: ${{ vars.PLIEGO_FACTS_ENABLED }}
          IN_PLIEGO_FACTS_MODEL: ${{ vars.PLIEGO_FACTS_MODEL }}
          IN_FETCH_BATCH: ${{ inputs.fetch_batch }}
          IN_EMBED_BATCH: ${{ inputs.embed_batch }}
          IN_FACTS_BATCH: ${{ inputs.facts_batch }}
          IN_TECH_SIGNAL_BATCH: ${{ inputs.tech_signal_batch }}
        run: |
          set -u
          if [ -n "${IN_PLIEGO_FACTS_ENABLED:-}" ]; then
            echo "PLIEGO_FACTS_ENABLED=$IN_PLIEGO_FACTS_ENABLED" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_PLIEGO_FACTS_MODEL:-}" ]; then
            echo "PLIEGO_FACTS_MODEL=$IN_PLIEGO_FACTS_MODEL" >> "$GITHUB_ENV"
          fi
          # Los cuatro tamaños de lote son inputs de workflow_dispatch, no
          # `vars`: en el cron nocturno llegan vacíos y entonces manda el default
          # de config/settings.py, que es justo lo que se quiere. Antes el
          # `|| '300'` del YAML los fijaba también en el cron, duplicando el
          # default en un sitio que ningún test mira.
          if [ -n "${IN_FETCH_BATCH:-}" ]; then
            echo "PLIEGO_FETCH_BATCH=$IN_FETCH_BATCH" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_EMBED_BATCH:-}" ]; then
            echo "PLIEGO_EMBED_BATCH=$IN_EMBED_BATCH" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_FACTS_BATCH:-}" ]; then
            echo "PLIEGO_FACTS_BATCH=$IN_FACTS_BATCH" >> "$GITHUB_ENV"
          fi
          if [ -n "${IN_TECH_SIGNAL_BATCH:-}" ]; then
            echo "PLIEGO_TECH_SIGNAL_BATCH=$IN_TECH_SIGNAL_BATCH" >> "$GITHUB_ENV"
          fi

      - name: Run pliegos batch (fetch + chunk + embed)
        env:
          # ENV=prod porque este job escribe en la BD de producción, así que
          # los validators de datos (TLS de DATABASE_URL, alertas) deben estar
          # activos. APP_PROFILE=scraper omite los secretos que solo necesita
          # el proceso HTTP (SIGNING_KEY, REDIS_URL, CORS): son ejes distintos.
          ENV: prod
          APP_PROFILE: scraper
          # ADR-012: este workflow ES el plano de orquestación activo para
          # este job (paridad con scrape-daily.yml).
          SCHEDULER_PLANE: actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Canal de alertas. Este cron nocturno drena un backlog de ~44k
          # documentos contra la BD de producción y `scheduler/healthcheck.py`
          # NO cubre esta tubería (lo dice el comentario del job `audit-extras`
          # de más arriba): sin estas variables, cualquier `notify()` del lote
          # se quedaba en el log del runner y moría con él, y el único aviso era
          # el correo por defecto de GitHub al dueño del repo.
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          LOG_FORMAT: json
        run: python -m scheduler.jobs.documentos_embeddings run

      - name: Report documento_chunks state
        env:
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          LOG_FORMAT: json
        run: python -m scheduler.jobs.documentos_embeddings report
