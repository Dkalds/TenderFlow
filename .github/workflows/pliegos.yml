name: Pliegos (fetch + chunking + embeddings + fichas)

on:
  schedule:
    # Nocturno, tras la ingesta diaria y el scoring ML (07:30 UTC) — deja
    # tiempo a que haya documentos `pending` nuevos del día antes de procesarlos.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      fetch_batch:
        description: "Documentos a descargar+extraer en este lote (fetch)"
        required: false
        default: "300"
      embed_batch:
        description: "Documentos a chunkear+embeber en este lote (embed)"
        required: false
        default: "100"
      facts_batch:
        description: "Licitaciones a procesar en la fase de fichas LLM (facts)"
        required: false
        default: "25"
      tech_signal_batch:
        description: "Licitaciones a puntuar en la fase de señal de tecnología (tech_signal)"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: pliegos
  cancel-in-progress: false

jobs:
  pliegos:
    runs-on: ubuntu-latest
    # El lote diario subió de 50 a 300 (PLIEGO_FETCH_BATCH) para drenar el
    # backlog de ~44k documentos en semanas en vez de meses; 30min medía
    # corto para el lote nuevo.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[pliegos,ml-embeddings]"

      - name: Run pliegos batch (fetch + chunk + embed)
        env:
          # ENV=prod porque este job escribe en la BD de producción, así que
          # los validators de datos (TLS de DATABASE_URL, alertas) deben estar
          # activos. APP_PROFILE=scraper omite los secretos que solo necesita
          # el proceso HTTP (SIGNING_KEY, REDIS_URL, CORS): son ejes distintos.
          ENV: prod
          APP_PROFILE: scraper
          # ADR-012: este workflow ES el plano de orquestación activo para
          # este job (paridad con scrape-daily.yml).
          SCHEDULER_PLANE: actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          PLIEGO_FACTS_ENABLED: ${{ vars.PLIEGO_FACTS_ENABLED || 'false' }}
          PLIEGO_FACTS_MODEL: ${{ vars.PLIEGO_FACTS_MODEL || 'deepseek-ai/deepseek-v4-pro' }}
          # Overrides opcionales vía workflow_dispatch para lotes de
          # recuperación manual (backlog); en el cron nocturno los inputs
          # llegan vacíos y caen a los mismos defaults de config/settings.py.
          PLIEGO_FETCH_BATCH: ${{ github.event.inputs.fetch_batch || '300' }}
          PLIEGO_EMBED_BATCH: ${{ github.event.inputs.embed_batch || '100' }}
          PLIEGO_FACTS_BATCH: ${{ github.event.inputs.facts_batch || '25' }}
          PLIEGO_TECH_SIGNAL_BATCH: ${{ github.event.inputs.tech_signal_batch || '500' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOG_FORMAT: json
        run: python -m scheduler.jobs.documentos_embeddings run

      - name: Report documento_chunks state
        env:
          ENV: prod
          APP_PROFILE: scraper
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_ROOT_CERT: ${{ secrets.DATABASE_SSL_ROOT_CERT }}
          LOG_FORMAT: json
        run: python -m scheduler.jobs.documentos_embeddings report
