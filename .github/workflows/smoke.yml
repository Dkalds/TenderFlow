name: Smoke sintético post-deploy

# Chequeo de que los endpoints insignia devuelven DATOS, no solo 200
# (revisión de arquitectura 2026-08: Resumen en blanco y Oportunidades vacío
# pasaron semanas invisibles porque todo respondía 200). Corre cada 6h y
# on-demand tras un deploy.
#
# Requiere configurar:
#   - vars.SMOKE_BASE_URL   (p. ej. https://tenderflow-api.onrender.com)
#   - secrets.SMOKE_API_KEY (API key con scope de lectura; sin ella los
#     endpoints autenticados se omiten y solo se valida /health/ready)

on:
  schedule:
    # Cada 15 minutos. Con el cron cada 6h anterior, el tiempo medio hasta
    # detectar una caída era de ~3 horas —y el SLO de disponibilidad del 99%
    # mensual que promete docs/sli-slo.md ni siquiera es computable a esa
    # granularidad—. La API corre en Render Free (con spin-down), así que este
    # sondeo es además lo que la mantiene despierta.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # El job entero llevaba `if: vars.SMOKE_BASE_URL != ''`: sin esa variable
      # configurada se saltaba **en verde**, así que la ausencia de monitorización
      # se veía igual que una monitorización que pasa. Ahora falla y se ve.
      - name: Verificar configuración
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "::error title=Smoke sin configurar::Definí la variable de repositorio SMOKE_BASE_URL (Settings → Secrets and variables → Actions → Variables) para que este chequeo vigile producción."
            exit 1
          fi

      # `scripts/smoke_prod.py` falla si `/health/ready` reporta
      # `schema_revision: behind|ahead` — la revisión alembic aplicada en la BD
      # no coincide con la cabeza del código desplegado (S6.2). Ese estado NO da
      # 503 (el proceso sirve tráfico), así que sin este gate se ve exactamente
      # igual que un despliegue sano hasta que una consulta toca una columna que
      # todavía no existe.
      - name: Run synthetic checks
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          # Este cron ES el sondeo de disponibilidad de docs/sli-slo.md §1 (cada
          # 15 min) y hasta ahora su único aviso era el correo por defecto de
          # GitHub al dueño del repo: sin ALERT_* no notificaba a nadie más.
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
        run: python scripts/smoke_prod.py
