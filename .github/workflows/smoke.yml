name: Smoke sintético post-deploy

# Chequeo de que los endpoints insignia devuelven DATOS, no solo 200
# (revisión de arquitectura 2026-08: Resumen en blanco y Oportunidades vacío
# pasaron semanas invisibles porque todo respondía 200). Corre cada 6h y
# on-demand tras un deploy.
#
# Requiere configurar:
#   - vars.SMOKE_BASE_URL   (p. ej. https://tenderflow-api.onrender.com)
#   - secrets.SMOKE_API_KEY (API key con scope de lectura; sin ella los
#     endpoints autenticados se omiten y solo se valida /health/ready)

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: vars.SMOKE_BASE_URL != ''
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run synthetic checks
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: python scripts/smoke_prod.py
