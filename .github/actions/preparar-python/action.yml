name: Preparar Python
description: >-
  Python de .python-version con caché de pip y las dependencias de un fichero
  de requirements. El checkout va antes, en el workflow: la acción vive en el
  propio repo y sin él no existe.

inputs:
  requirements:
    description: "Fichero de dependencias que instalar"
    default: requirements.txt

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: .python-version
        cache: pip

    - name: Install dependencies
      shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        python -m pip install --upgrade pip
        pip install -r "$REQUIREMENTS"
