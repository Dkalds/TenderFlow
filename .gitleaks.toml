[extend]
# Extend the default gitleaks ruleset
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
    # detect-secrets baseline contains hashed secrets (not real secrets)
    '''.secrets.baseline''',
    # RFC docs contain example/redacted passwords in code snippets
    '''docs/rfc/.*\.md''',
    # Test files use dummy/fixture passwords for validation testing
    '''tests/test_unit_settings_security\.py''',
    # Agent/skill documentation files contain placeholder tokens and example credentials
    # (e.g. "your-password", base64-encoded demo tokens in Upstash SDK docs)
    '''.agents/skills/.*''',
    '''.claude/skills/.*''',
]
