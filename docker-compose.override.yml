# docker-compose.override.yml — Overrides para desarrollo local
#
# Este fichero se aplica automáticamente sobre docker-compose.yml cuando se
# ejecuta `docker compose up` sin especificar fichero.
#
# Diferencias con el entorno de producción:
# - Volúmenes de código montados (hot-reload sin rebuild de imagen)
# - Variables de entorno de desarrollo (ENV=dev, LOG_FORMAT=console)
# - Sin límites de memoria restrictivos
# - Sin Prometheus ni Grafana (se activan con --profile monitoring)
# - REDIS_PASSWORD simplificada para dev local

services:
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      target: runtime  # evita rebuild completo en dev
    volumes:
      - licitaciones_data:/data
      - ./dashboard:/app/dashboard:ro  # hot-reload dashboard
      - ./shared:/app/shared:ro
      - ./config:/app/config:ro
      - ./db:/app/db:ro
      - ./services:/app/services:ro
      - ./observability:/app/observability:ro
    environment:
      ENV: dev
      LOG_FORMAT: console
      REDIS_URL: redis://:dev-password@redis:6379/0
      REDIS_PASSWORD: dev-password
    mem_limit: "0"  # sin límite en dev
    # Override del healthcheck para arranque más rápido en dev
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "10",
             "http://localhost:8501/_stcore/health"]
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    volumes:
      - licitaciones_data:/data
      - ./api:/app/api:ro
      - ./shared:/app/shared:ro
      - ./config:/app/config:ro
      - ./db:/app/db:ro
      - ./services:/app/services:ro
      - ./observability:/app/observability:ro
      - ./llm:/app/llm:ro
    environment:
      ENV: dev
      LOG_FORMAT: console
      REDIS_URL: redis://:dev-password@redis:6379/0
      REDIS_PASSWORD: dev-password
    mem_limit: "0"

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    volumes:
      - licitaciones_data:/data
      - ./scheduler:/app/scheduler:ro
      - ./scraper:/app/scraper:ro
      - ./shared:/app/shared:ro
      - ./config:/app/config:ro
      - ./db:/app/db:ro
      - ./services:/app/services:ro
      - ./observability:/app/observability:ro
    environment:
      ENV: dev
      LOG_FORMAT: console
      REDIS_URL: redis://:dev-password@redis:6379/0
      REDIS_PASSWORD: dev-password
    mem_limit: "0"

  redis:
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass dev-password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev-password", "ping"]
    mem_limit: "0"
    ports:
      - "127.0.0.1:6379:6379"  # exponer Redis en dev para debugging
