# docker-compose.override.yml — Overrides para desarrollo local
#
# Este fichero se aplica automáticamente sobre docker-compose.yml cuando se
# ejecuta `docker compose up` sin especificar fichero.
#
# Diferencias con producción:
# - Volúmenes de código montados (hot-reload sin rebuild de imagen)
# - ENV=dev, LOG_FORMAT=console
# - Sin límites de memoria restrictivos
# - Redis desactivado por defecto; activar con: docker compose --profile redis up
#   (Upstash en producción; fallbacks de memoria en dev local)
# - Prometheus/Grafana opcionales: docker compose --profile monitoring up
# - Postgres es el único motor (ADR-021): el servicio `postgres` de
#   docker-compose.yml arranca por defecto y la API/scheduler dependen de su
#   healthcheck. Ya no hay fallback a SQLite local.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    volumes:
      - ./api:/app/api:ro
      - ./shared:/app/shared:ro
      - ./config:/app/config:ro
      - ./db:/app/db:ro
      - ./services:/app/services:ro
      - ./observability:/app/observability:ro
      - ./llm:/app/llm:ro
    environment:
      ENV: dev
      LOG_FORMAT: console
    mem_limit: "0"

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    volumes:
      - ./scheduler:/app/scheduler:ro
      - ./scraper:/app/scraper:ro
      - ./shared:/app/shared:ro
      - ./config:/app/config:ro
      - ./db:/app/db:ro
      - ./services:/app/services:ro
      - ./observability:/app/observability:ro
    environment:
      ENV: dev
      LOG_FORMAT: console
    mem_limit: "0"

  # Override Redis cuando se activa el profile redis en dev
  redis:
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-dev-password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-password}", "ping"]
    mem_limit: "0"
    ports:
      - "127.0.0.1:6379:6379"  # exponer Redis en dev para debugging

  # ── Postgres local para desarrollo (F4d) ──────────────────────────────────
  # Motor destino de F3 (migración Supabase). En dev usamos postgres:17-alpine
  # directamente — NO el stack completo de Supabase local (demasiado pesado).
  #
  # Arrancar solo postgres: docker compose up postgres
  # Detener y borrar datos: docker compose down -v
  postgres:
    image: postgres:17-alpine
    container_name: tenderflow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenderflow
      POSTGRES_PASSWORD: tenderflow  # pragma: allowlist secret -- dev-only placeholder, no produccion
      POSTGRES_DB: tenderflow
    volumes:
      - tenderflow_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderflow -d tenderflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: "0"

volumes:
  tenderflow_pg_data:
