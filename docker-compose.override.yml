# docker-compose.override.yml — Overrides para desarrollo local
#
# Este fichero se aplica automáticamente sobre docker-compose.yml cuando se
# ejecuta `docker compose up` sin especificar fichero.
#
# Diferencias con producción:
# - Volúmenes de código montados (hot-reload sin rebuild de imagen)
# - ENV=dev, LOG_FORMAT=console
# - Sin límites de memoria restrictivos
# - Redis desactivado por defecto; activar con: docker compose --profile redis up
#   (Upstash en producción; fallbacks de memoria en dev local)
# - Prometheus/Grafana opcionales: docker compose --profile monitoring up

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    volumes:
      - tenderflow_data:/data
      - ./api:/app/api:ro
      - ./shared:/app/shared:ro
      - ./config:/app/config:ro
      - ./db:/app/db:ro
      - ./services:/app/services:ro
      - ./observability:/app/observability:ro
      - ./llm:/app/llm:ro
    environment:
      ENV: dev
      LOG_FORMAT: console
    mem_limit: "0"

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    volumes:
      - tenderflow_data:/data
      - ./scheduler:/app/scheduler:ro
      - ./scraper:/app/scraper:ro
      - ./shared:/app/shared:ro
      - ./config:/app/config:ro
      - ./db:/app/db:ro
      - ./services:/app/services:ro
      - ./observability:/app/observability:ro
    environment:
      ENV: dev
      LOG_FORMAT: console
    mem_limit: "0"

  # Override Redis cuando se activa el profile redis en dev
  redis:
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-dev-password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-password}", "ping"]
    mem_limit: "0"
    ports:
      - "127.0.0.1:6379:6379"  # exponer Redis en dev para debugging
