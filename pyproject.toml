[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licitaciones-sap"
version = "1.0.0"
description = "Detección y análisis de licitaciones SAP del Sector Público español"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0,<3",
    "lxml>=5.0.0,<7",
    "pandas>=2.1.0,<3",
    "streamlit>=1.33.0,<2",
    "plotly>=5.18.0,<7",
    "python-dateutil>=2.8.2,<3",
    "tenacity>=8.2.0,<10",
    "openpyxl>=3.1.0,<4",
    "libsql>=0.1.0,<1",
    "python-dotenv>=1.0.0,<2",
    "pydantic-settings>=2.0.0,<3",
    "streamlit-aggrid>=0.3.3,<1",
    "structlog>=24.1.0,<26",
    "pybreaker>=1.0.0,<2",
    "reportlab>=4.0,<5",
    "scikit-learn>=1.3.0,<2",
    "joblib>=1.3.0,<2",
    "prometheus_client>=0.19.0,<1",
    "prometheus-fastapi-instrumentator>=7.0,<8",
    "bcrypt>=4.0,<5",
    "argon2-cffi>=23.1.0,<25",
    "alembic>=1.13.0,<2",
    "fastapi>=0.110.0,<1",
    "redis>=5.0,<6",
]

[project.optional-dependencies]
# Deps opcionales para búsqueda semántica y vectorización.
# Instalar con: pip install licitaciones-sap[ml]
# NOTA: sentence-transformers arrastra PyTorch (~2 GB). No instalar en entornos sin GPU si no se usa.
ml = [
    "faiss-cpu>=1.7.4,<2",
    "sentence-transformers>=2.2.0,<3",
]
# Validación de DataFrames con pandera.
# Instalar con: pip install licitaciones-sap[schemas]
schemas = [
    "pandera>=0.18,<1",
]
# Deps opcionales para embeddings pre-entrenados en el pipeline ML.
# Instalar con: pip install licitaciones-sap[ml-embeddings]
ml-embeddings = [
    "sentence-transformers>=2.2.0,<4",
]
# Deps opcionales para observabilidad distribuida (OTLP/OpenTelemetry).
# Instalar con: pip install licitaciones-sap[tracing]
# Sin este extra, observability/tracing.py opera en modo NoOp sin overhead.
tracing = [
    "opentelemetry-api>=1.20.0,<3",
    "opentelemetry-sdk>=1.20.0,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<3",
    "opentelemetry-instrumentation-fastapi>=0.45b0,<2",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", ".agents*"]

[tool.setuptools.package-data]
shared = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "PERF",# perflint
    "PIE", # flake8-pie
    "LOG", # flake8-logging
]
ignore = [
    "S101",    # assert allowed in tests
    "S603",    # subprocess calls allowed in scheduler
    "E501",    # line length managed by formatter
    "S110",    # try-except-pass allowed in best-effort persisters
    "PERF401", # list.append in loops is often more readable than extend
    "SIM105",  # contextlib.suppress is less explicit than try/except pass
    "B008",    # FastAPI Depends/Query/Header in argument defaults is the canonical pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S105", "S320", "S311", "S607", "RUF002", "SIM117", "F841", "E402"]
"dashboard/*" = ["S110", "RUF001", "RUF002", "RUF003"]  # unicode UI chars are intentional
"dashboard/session_keys.py" = ["S105"]  # LOGIN_PWD is a session-state key name, not a password
"db/database.py" = ["S608", "E402", "RUF022"]  # SQL built from internal dataclass-field constants; E402 intentional facade re-exports
"scraper/ml_classifier.py" = ["S608", "E402"]  # SQL built from internal schema-detection strings; E402 re-exports at module bottom
"api/routes/licitaciones.py" = ["E402"]  # TypeVar declared before imports for Python 3.11 compatibility
"db/alembic/*" = ["S608"]   # SQL in migrations is schema-only, not user-controlled
"db/events.py" = ["S608"]   # SQL built from internal event-type constants
"db/feature_store.py" = ["S608"]  # SQL built from internal feature-name constants
"db/repositories/licitaciones.py" = ["S608"]  # SQL filter builder uses validated column names
"dashboard/pages/investigador.py" = ["S608"]  # SQL built from validated filter params
"services/investigador/*" = ["S608"]  # SQL built from escaped FTS5 queries and placeholders
"db/connection.py" = ["S608"]  # get_table_columns uses table param from internal callers only
"db/upsert.py" = ["S608"]  # SQL built from internal dataclass-field constants, not user input
"scraper/ml_training.py" = ["S608"]  # SQL built from internal schema strings, not user input
"api/routes/ask.py" = ["S608"]  # SQL built from FTS5 query with validated user input
"db/dlq.py" = ["S608"]  # SQL with placeholders for internal IDs
"db/notifications.py" = ["S608"]  # SQL with placeholders for internal IDs
"db/repositories/adjudicaciones.py" = ["S608"]  # SQL filter builder uses validated column names
"db/repositories/extraction_runs.py" = ["S608"]  # SQL built from internal column constants
"db/repositories/watchlist.py" = ["S608"]  # SQL built from internal column constants and placeholders
"db/repositories/api_keys.py" = ["S608"]  # SQL built from internal column constants
"db/repositories/base.py" = ["S608"]  # SQL built from internal column constants
"db/repositories/webhooks.py" = ["S608"]  # SQL built from internal column constants
"scheduler/retention.py" = ["S608"]  # SQL built from internal table/column constants
"services/auth.py" = ["S608"]  # SQL built from internal column constants
"services/extraction_runs.py" = ["S608"]  # SQL built from internal column constants
"services/gdpr.py" = ["S608"]  # SQL built from internal table constants
"services/licitaciones.py" = ["S608"]  # SQL filter builder uses validated column names
"services/watchlist.py" = ["S608"]  # SQL built from internal column constants

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["scripts/"]

# ── Módulos que PASAN mypy strict (sin override) ─────────────────────────
# dashboard.bootstrap, dashboard.session_keys, dashboard.theme.*,
# dashboard.pages._base, dashboard.router, dashboard.filters.*,
# config.*, db.database, db.users, shared.*
# Añadir módulos aquí al limpiarlos; retirarlos del bloque de overrides.

# Módulos que aún no pasan strict — ir reduciendo esta lista progresivamente
[[tool.mypy.overrides]]
module = [
    "dashboard.app",
    "dashboard.components.*",
    "dashboard.embeddings",
    "dashboard.kpi_bar",
    "dashboard.pages.admin",
    "dashboard.pages.calidad_datos",
    "dashboard.pages.clusters",
    "dashboard.pages.competidores.*",
    "dashboard.pages.detalle",
    "dashboard.pages.geografia",
    "dashboard.pages.mi_watchlist",
    "dashboard.pages.observabilidad",
    "dashboard.pages.organos",
    "dashboard.pages.pipeline_alertas",
    "dashboard.pages.proyectos_modulos",
    "dashboard.pages.resumen",
    "dashboard.pages.tecnologias",
    "dashboard.pages.tendencias",
    "tests.*",
    "scripts.*",
]
ignore_errors = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = false
disallow_untyped_calls = false

# Módulos con errores type-arg / no-any-return / no-untyped-call pre-existentes
[[tool.mypy.overrides]]
module = [
    "scraper.atom_live",
    "dashboard.utils.dates",
    "services.rate_limit_redis",
    "shared.cache",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_unused_ignores = false

# Dependencias sin stubs útiles
[[tool.mypy.overrides]]
module = [
    "libsql",
    "libsql.*",
    "libsql_experimental",
    "libsql_experimental.*",
    "pybreaker",
    "lxml",
    "lxml.*",
    "dateutil",
    "dateutil.*",
    "streamlit",
    "streamlit.*",
    "st_aggrid",
    "st_aggrid.*",
    "plotly",
    "plotly.*",
    "reportlab",
    "reportlab.*",
    "faiss",
    "faiss.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "sklearn",
    "sklearn.*",
    "bcrypt",
    "prometheus_client",
    "prometheus_client.*",
    "alembic",
    "alembic.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "joblib",
    "opentelemetry",
    "opentelemetry.*",
    "pandera",
    "pandera.*",
    "polars",
    "polars.*",
    "brotli_asgi",
    "redis",
    "redis.*",
    "rq",
    "rq.*",
    "duckdb",
    "duckdb.*",
    "requests",
    "requests.*",
]
ignore_missing_imports = true

# Módulos pendientes de tipado estricto — ir limpiando progresivamente
# P8 (2026-05-23): config.settings, shared.auth_core, api.auth, db.audit, db.totp
#                  cerrados (mypy clean). Removidos de ignore_errors.
[[tool.mypy.overrides]]
module = [
    "shared.i18n",
    "shared.schemas",
    "api.cache",
    "api.app",
    "api.routes.licitaciones",
    "api.routes.webhooks",
    "api.routes.security",
    "api.routes.meta",
    "api.routes.me",
    "api.routes.exports",
    "api.routes.feedback",
    "api.routes.health",
    "db.analytics",
    "db.webhooks",
    "db.repositories.webhooks",
    "db.repositories.feedback",
    "observability.sentry",
    "scraper.ml_pipeline",
    "scraper.ml_classifier",
    "dashboard.pages.tendencias_cpv",
    "dashboard.pages.comparador",
    "dashboard.pages.investigador",
    "dashboard.pages.active_learning",
    "dashboard.forecast",
    "dashboard.stats._base",
    "scheduler.concept_drift",
    "scheduler.drift_monitor",
    "scheduler.drift_report",
    "scheduler.queue",
    "scheduler.loop",
]
ignore_errors = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:libsql",
]
markers = [
    "unit: tests unitarios rápidos (default, sin I/O externo)",
    "integration: tests de integración (requieren BD/FS, sin red externa)",
    "e2e: tests end-to-end (UI/API completa, opcionalmente Playwright)",
    "property: tests basados en propiedades (hypothesis)",
    "load: tests de carga/benchmark (locust/pytest-benchmark)",
    "slow: marca explícita de tests lentos (excluibles con -m 'not slow')",
]

[tool.coverage.run]
branch = true
source = ["api", "db", "scraper", "scheduler", "services", "shared", "observability", "config", "dashboard", "llm"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "dashboard/utils/chart_helpers.py",
    "dashboard/utils/lazy.py",
    "scripts/*",
    "scheduler/register_daily_task_windows.ps1",
]

[tool.coverage.report]
# Historial de umbrales:
# 51 → 55 (2026-05-23): tests de threshold_tuning, model_registry, feature_store, drift_report
# 55 → 60 (2026-05-23): Bloque 4 Fase 1 — tests de middleware, shared/cache, scheduler/loop,
#                        contract tests DTOs, tests de api/middleware y scraper/resilience
# 60 → 65 (2026-05-23): Bloque 4 Fase 2 — tests de services/watchlist, services/analytics_engine,
#                        cerrando overrides mypy para dashboard.cache y dashboard.data_loader
# 65 → 70 (2026-05-23): B12 — tests para api/routes/ask.py, stream.py, search.py (22 tests nuevos)
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
# Configuración para el hook de pre-commit: bandit -c pyproject.toml -r
targets = ["api", "db", "scraper", "scheduler", "dashboard", "shared", "config"]
skips = [
    "B101",  # assert — cubierto por ruff S101 ya ignorado en tests
    "B603",  # subprocess sin shell — permitido en scheduler
    "B110",  # try-except-pass — permitido en best-effort persisters
    "B311",  # random — sólo usado para salt de demo, no crypto
    "B608",  # hardcoded SQL — todas las queries usan parámetros SQLAlchemy
    "B324",  # hashlib MD5 — usado sólo como cache key (no crypto)
    "B108",  # hardcoded tmp dir — paths de modelos bajo control interno
    "B105",  # hardcoded password — cadenas vacías como defaults, no secrets
    "B403",  # import pickle — aceptado para faiss cache interno
    "B301",  # pickle — aceptado para faiss cache interno
    "B112",  # try-except-continue — aceptado en best-effort loops
    "B310",  # urllib urlopen — URLs controladas internamente
]
exclude_dirs = ["tests", ".agents", ".venv"]
