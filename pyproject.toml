[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "licitaciones-sap"
version = "1.0.0"
description = "Detección y análisis de licitaciones SAP del Sector Público español"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0,<3",
    "lxml>=5.0.0,<7",
    "pandas>=2.1.0,<4",
    "streamlit>=1.30.0,<2",
    "plotly>=5.18.0,<7",
    "python-dateutil>=2.8.2,<3",
    "tenacity>=8.2.0,<10",
    "openpyxl>=3.1.0,<4",
    "libsql>=0.1.0,<1",
    "python-dotenv>=1.0.0,<2",
    "pydantic-settings>=2.0.0,<3",
    "streamlit-aggrid>=0.3.3,<1",
    "structlog>=24.1.0,<26",
    "pybreaker>=1.0.0,<2",
    "reportlab>=4.0,<5",
    "scikit-learn>=1.3.0,<2",
    "joblib>=1.3.0,<2",
    "prometheus_client>=0.19.0,<1",
]

[project.optional-dependencies]
# Deps opcionales para búsqueda semántica y vectorización.
# Instalar con: pip install licitaciones-sap[ml]
# NOTA: sentence-transformers arrastra PyTorch (~2 GB). No instalar en entornos sin GPU si no se usa.
ml = [
    "faiss-cpu>=1.7.4,<2",
    "sentence-transformers>=2.2.0,<4",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "PERF",# perflint
    "PIE", # flake8-pie
    "LOG", # flake8-logging
]
ignore = [
    "S101",    # assert allowed in tests
    "S603",    # subprocess calls allowed in scheduler
    "E501",    # line length managed by formatter
    "S110",    # try-except-pass allowed in best-effort persisters
    "PERF401", # list.append in loops is often more readable than extend
    "SIM105",  # contextlib.suppress is less explicit than try/except pass
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S105", "S320"]
"dashboard/*" = ["S110", "RUF001", "RUF002", "RUF003"]  # unicode UI chars are intentional
"dashboard/app.py" = ["E402"]  # sys.path insert requires imports after path manipulation
"dashboard/session_keys.py" = ["S105"]  # LOGIN_PWD is a session-state key name, not a password
"db/database.py" = ["S608"]  # SQL built from internal dataclass-field constants, not user input

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false

# Módulos con tipado estricto validado
[[tool.mypy.overrides]]
module = [
    "config",
    "db.*",
    "observability.*",
    "dashboard.utils.*",
    "dashboard.classifiers",
    "dashboard.normalize",
    "dashboard.forecast",
    "scraper.resilience",
    "scraper.filters",
    "scraper.pipeline",
    "scraper.codice_parser",
    "scraper.bulk_downloader",
    "scheduler.*",
    "shared.*",
]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

# Dependencias sin stubs útiles
[[tool.mypy.overrides]]
module = [
    "libsql",
    "libsql.*",
    "pybreaker",
    "requests",
    "requests.*",
    "lxml",
    "lxml.*",
    "dateutil",
    "dateutil.*",
    "streamlit",
    "streamlit.*",
    "st_aggrid",
    "st_aggrid.*",
    "plotly",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:libsql",
]
markers = [
    "integration: tests de integración E2E (más lentos, requieren BD completa)",
]

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "dashboard/pages/*",
    "dashboard/components/*",
    "dashboard/filters/*",
    "dashboard/theme/*",
    "dashboard/app.py",
    "dashboard/auth.py",
    "dashboard/router.py",
    "dashboard/data_loader.py",
    "dashboard/stats.py",
    "dashboard/faiss_index.py",
    "observability/prometheus.py",
    "config/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
