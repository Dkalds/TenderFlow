[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licitaciones-sap"
version = "1.0.0"
description = "Detección y análisis de licitaciones SAP del Sector Público español"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0,<3",
    "lxml>=5.0.0,<7",
    "pandas>=2.1.0,<4",
    "streamlit>=1.30.0,<2",
    "plotly>=5.18.0,<7",
    "python-dateutil>=2.8.2,<3",
    "tenacity>=8.2.0,<10",
    "openpyxl>=3.1.0,<4",
    "libsql>=0.1.0,<1",
    "python-dotenv>=1.0.0,<2",
    "pydantic-settings>=2.0.0,<3",
    "streamlit-aggrid>=0.3.3,<1",
    "structlog>=24.1.0,<26",
    "pybreaker>=1.0.0,<2",
    "reportlab>=4.0,<5",
    "scikit-learn>=1.3.0,<2",
    "joblib>=1.3.0,<2",
    "prometheus_client>=0.19.0,<1",
    "bcrypt>=4.0,<5",
]

[project.optional-dependencies]
# Deps opcionales para búsqueda semántica y vectorización.
# Instalar con: pip install licitaciones-sap[ml]
# NOTA: sentence-transformers arrastra PyTorch (~2 GB). No instalar en entornos sin GPU si no se usa.
ml = [
    "faiss-cpu>=1.7.4,<2",
    "sentence-transformers>=2.2.0,<4",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", ".agents*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "PERF",# perflint
    "PIE", # flake8-pie
    "LOG", # flake8-logging
]
ignore = [
    "S101",    # assert allowed in tests
    "S603",    # subprocess calls allowed in scheduler
    "E501",    # line length managed by formatter
    "S110",    # try-except-pass allowed in best-effort persisters
    "PERF401", # list.append in loops is often more readable than extend
    "SIM105",  # contextlib.suppress is less explicit than try/except pass
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S105", "S320"]
"dashboard/*" = ["S110", "RUF001", "RUF002", "RUF003"]  # unicode UI chars are intentional
"dashboard/session_keys.py" = ["S105"]  # LOGIN_PWD is a session-state key name, not a password
"db/database.py" = ["S608"]  # SQL built from internal dataclass-field constants, not user input
"scraper/ml_classifier.py" = ["S608"]  # SQL built from internal schema-detection strings, not user input

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true

# Módulos que aún no pasan strict — ir reduciendo esta lista progresivamente
[[tool.mypy.overrides]]
module = [
    "dashboard.app",
    "dashboard.auth",
    "dashboard.data_loader",
    "dashboard.embeddings",
    "dashboard.faiss_index",
    "dashboard.filters.*",
    "dashboard.kpi_bar",
    "dashboard.kpi_config",
    "dashboard.pages.*",
    "dashboard.router",
    "dashboard.session_keys",
    "dashboard.stats.*",
    "dashboard.theme.*",
    "dashboard.components.*",
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = false
disallow_untyped_calls = false

# Módulos con errores type-arg / no-any-return / no-untyped-call pre-existentes
[[tool.mypy.overrides]]
module = [
    "db.rate_limits",
    "scraper.atom_live",
    "scraper.pipeline",
    "scheduler.healthcheck",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_unused_ignores = false

# Dependencias sin stubs útiles
[[tool.mypy.overrides]]
module = [
    "libsql",
    "libsql.*",
    "pybreaker",
    "lxml",
    "lxml.*",
    "dateutil",
    "dateutil.*",
    "streamlit",
    "streamlit.*",
    "st_aggrid",
    "st_aggrid.*",
    "plotly",
    "plotly.*",
    "reportlab",
    "reportlab.*",
    "faiss",
    "faiss.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "sklearn",
    "sklearn.*",
    "bcrypt",
    "prometheus_client",
    "prometheus_client.*",
    "alembic",
    "alembic.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "joblib",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:libsql",
]
markers = [
    "integration: tests de integración E2E (más lentos, requieren BD completa)",
]

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "dashboard/pages/*",
    "dashboard/components/*",
    "dashboard/filters/*",
    "dashboard/theme/*",
    "dashboard/app.py",
    "dashboard/auth.py",
    "dashboard/router.py",
    "dashboard/data_loader.py",
    "dashboard/stats.py",
    "dashboard/faiss_index.py",
    "dashboard/utils/chart_helpers.py",
    "dashboard/utils/lazy.py",
    "observability/prometheus.py",
    "config/*",
    "scripts/*",
    "scheduler/register_daily_task_windows.ps1",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
