[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderflow"
version = "1.0.0"
description = "Inteligencia de licitaciones del Sector Público español"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0,<3",
    "lxml>=5.0.0,<7",
    "pandas>=2.1.0,<3",
    "python-dateutil>=2.8.2,<3",
    "tenacity>=8.2.0,<10",
    "openpyxl>=3.1.0,<4",
    "python-dotenv>=1.0.0,<2",
    "pydantic-settings>=2.0.0,<3",
    "structlog>=24.1.0,<26",
    "pybreaker>=1.0.0,<2",
    "reportlab>=4.0,<5",
    "scikit-learn>=1.3.0,<2",
    "joblib>=1.3.0,<2",
    "networkx>=3.0,<4",
    "prometheus_client>=0.19.0,<1",
    "prometheus-fastapi-instrumentator>=7.0,<8",
    "bcrypt>=4.0,<5",
    "argon2-cffi>=23.1.0,<25",
    "alembic>=1.13.0,<2",
    "fastapi>=0.110.0,<1",
    "redis>=5.0,<6",
    "cachetools>=5.3.0,<8",
    "brotli-asgi>=1.4.0,<2",
    # F3: Postgres/Supabase (ADR-016). Optional: solo se activa cuando DATABASE_URL
    # apunta a postgres. Sin este extra, db/connection.py opera sobre SQLite/Turso.
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "boto3>=1.43.56,<1.44",
]

[project.optional-dependencies]
# Deps opcionales para el endpoint RAG /api/v1/ask (LLM).
# Instalar con: pip install tenderflow[llm]
# El SDK de OpenAI cubre OpenAI y NVIDIA NIM (API compatible, base_url propio).
# Sin este extra, llm/providers/*.py operan en modo NoOp (log warning + sin respuesta).
llm = [
    "openai>=1.30.0,<3",
    "anthropic>=0.40.0,<1",
]
# Deps opcionales para búsqueda semántica y vectorización.
# Instalar con: pip install tenderflow[ml]
# NOTA: sentence-transformers arrastra PyTorch (~2 GB). No instalar en entornos sin GPU si no se usa.
# faiss-cpu eliminado en Fase 3 (2026-07-04): /search usa FTS5/BM25+LIKE; sentence-transformers
# se mantiene porque lo usan ml_classifier, clustering_engine y embeddings.
ml = [
    "sentence-transformers>=2.2.0,<4",
]
# Validación de DataFrames con pandera.
# Instalar con: pip install licitaciones-sap[schemas]
schemas = [
    "pandera>=0.18,<1",
]
# Deps opcionales para embeddings pre-entrenados en el pipeline ML.
# Instalar con: pip install licitaciones-sap[ml-embeddings]
ml-embeddings = [
    "sentence-transformers>=2.2.0,<4",
]
# Deps opcionales para observabilidad distribuida (OTLP/OpenTelemetry).
# Instalar con: pip install licitaciones-sap[tracing]
# Sin este extra, observability/tracing.py opera en modo NoOp sin overhead.
tracing = [
    "opentelemetry-api>=1.20.0,<3",
    "opentelemetry-sdk>=1.20.0,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0,<3",
    "opentelemetry-instrumentation-fastapi>=0.45b0,<2",
]
# Motor DuckDB para exports Parquet analíticos pesados.
# Instalar con: pip install tenderflow[analytics]
# Sin este extra, db/analytics.py usa pandas como fallback.
analytics = [
    "duckdb>=0.10.0,<2",
]
# Cifrado de webhooks y secretos derivados.
# Instalar con: pip install tenderflow[crypto]
crypto = [
    # Suelo alineado con requirements.in: por debajo de 50.0.0 el extra
    # arrastraría CVE-2026-69247/69248/69249 (ver nota allí).
    "cryptography>=50.0.0,<51",
]
# Extracción de texto de adjuntos (pliegos), plan Pliegos+RAG (F7).
# Instalar con: pip install tenderflow[pliegos]
# Sin este extra, scraper/document_fetcher.py falla al extraer PDF (import
# diferido) pero no rompe el resto del pipeline de scraping.
pliegos = [
    "pypdf>=4.0,<7",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", ".agents*"]

[tool.setuptools.package-data]
shared = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Skills vendored desde skills-lock.json: código de terceros, no del proyecto.
# `.claude/skills` y `.agents/skills` son el mismo contenido para dos herramientas.
exclude = [".agents", ".claude/skills"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "PERF",# perflint
    "PIE", # flake8-pie
    "LOG", # flake8-logging
    "TID", # flake8-tidy-imports (ratchet de acceso directo a BD)
]
ignore = [
    "S101",    # assert allowed in tests
    "S603",    # subprocess calls allowed in scheduler
    "E501",    # line length managed by formatter
    "S110",    # try-except-pass allowed in best-effort persisters
    "PERF401", # list.append in loops is often more readable than extend
    "SIM105",  # contextlib.suppress is less explicit than try/except pass
    "B008",    # FastAPI Depends/Query/Header in argument defaults is the canonical pattern
]

[tool.ruff.lint.per-file-ignores]
# ── RATCHET TID251 — whitelist congelada: solo se QUITAN líneas, nunca se añaden ──
# Infraestructura de BD (legítima por diseño — no tocar)
"db/**" = ["TID251", "S608"]
"tests/*" = ["S101", "S106", "S105", "S320", "S311", "S607", "RUF002", "SIM117", "F841", "E402", "TID251"]
# Archivos con acceso directo legacy (eliminar TID251 al pasar por F5)
"api/routes/empresas.py" = ["TID251"]
"api/routes/eventos.py" = ["TID251"]
"api/routes/exports.py" = ["TID251"]
"api/routes/watchlist_rules.py" = ["TID251"]
"scheduler/aggregates_precompute.py" = ["TID251"]
"scheduler/anomaly_alerts.py" = ["TID251"]
"scheduler/competitor_alerts.py" = ["TID251"]
"scheduler/concept_drift.py" = ["TID251"]
"scheduler/drift_report.py" = ["TID251"]
"scheduler/healthcheck.py" = ["TID251"]
"scheduler/kpi_precompute.py" = ["TID251"]
"scheduler/retention.py" = ["TID251"]
"scheduler/watchlist_rules_alerts.py" = ["TID251"]
"scraper/ml_training.py" = ["TID251", "S608"]  # SQL built from internal schema strings
"scraper/tech_classifier.py" = ["TID251"]
"scripts/dedupe_licitaciones.py" = ["TID251"]
"scripts/fix_dates_adjudicaciones.py" = ["TID251"]
"scripts/retrain.py" = ["TID251"]
"scripts/rotate_api_keys.py" = ["TID251"]
"scripts/seed_dev.py" = ["TID251"]
"services/analytics/scoring_signals.py" = ["TID251"]
"services/competitive/bajas.py" = ["TID251"]
"services/competitive/mercado.py" = ["TID251"]
"services/competitive/renovaciones.py" = ["TID251"]
"services/contract_events.py" = ["TID251"]
"services/deadline_reminders.py" = ["TID251"]
"services/dedupe.py" = ["TID251"]
"services/entity_resolution.py" = ["TID251"]
"services/health.py" = ["TID251"]
"services/job_locks.py" = ["TID251"]
"services/licitaciones.py" = ["TID251", "S608"]
"services/ml/retencion_labels.py" = ["TID251"]
"services/ml/scoring.py" = ["TID251"]
"services/notifications.py" = ["TID251"]
"services/resoluciones.py" = ["TID251"]
"services/watchlist_rules.py" = ["TID251"]
# ── fin RATCHET TID251 ──
# Archivos no-TID con permisos especiales
"db/database.py" = ["E402", "RUF022"]  # E402 intentional facade re-exports
"scraper/ml_classifier.py" = ["E402"]  # E402 re-exports at module bottom
"api/routes/licitaciones.py" = ["E402"]  # TypeVar declared before imports for Python 3.11 compatibility
# S608: SQL built from internal dataclass-field/schema constants, not user input.
# These files ONLY construct SQL from controlled code constants — no user data reaches the column/table names.
"db/acl.py" = ["S608"]
"db/analytics.py" = ["S608"]
"db/connection.py" = ["S608"]  # get_table_columns uses table param from internal callers only
"db/dlq.py" = ["S608"]  # placeholders-for-IDs pattern, not user data
"db/notifications.py" = ["S608"]  # placeholders-for-IDs pattern, not user data
"db/users.py" = ["S608"]  # WHERE clause from controlled boolean, not user input
"db/upsert.py" = ["S608"]  # SQL built from internal dataclass-field constants
"db/alembic/*" = ["S608"]  # SQL in migrations is schema-only, not user-controlled
"db/repositories/adjudicaciones.py" = ["S608"]
"db/repositories/api_keys.py" = ["S608"]
"db/repositories/extraction_runs.py" = ["S608"]
"db/repositories/licitaciones.py" = ["S608"]  # SQL filter builder uses validated column names
"db/repositories/watchlist.py" = ["S608"]
"db/repositories/webhooks.py" = ["S608"]
"api/routes/ask.py" = ["S608"]  # FTS5 query with validated user input via parameterized queries
"services/investigador/*" = ["S608"]
"services/auth.py" = ["S608"]
"services/extraction_runs.py" = ["S608"]
"services/gdpr.py" = ["S608"]
"services/watchlist.py" = ["S608"]
# S608 removed from these files — handled inline with # noqa: S608 + justification:
#   db/events.py, db/feature_store.py, db/repositories/base.py, scheduler/retention.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Las migraciones Alembic ya publicadas son append-only: se siguen analizando
# con Ruff, pero no se reescriben mecánicamente mediante el formateador.
# La documentación (incluidos ejemplos de skills) no es código ejecutable y
# no debe ser reescrita por un formateador Python al actualizar Ruff.
exclude = ["db/alembic/versions/v58_security_identity_hardening.py", "*.md"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# RATCHET TID251: todo el SQL vive en db/ (ADR-022, AGENTS.md §3.10).
# Para añadir un nuevo archivo al ratchet: PROHIBIDO. Solo se quitan líneas de la whitelist.
"db.connection.connect".msg = "Abrir conexiones solo dentro de db/ (repository o función de módulo) — AGENTS.md §3.10, ADR-022."
"db.connection.connect_read".msg = "Lectura: abrir conexiones solo dentro de db/ — AGENTS.md §3.10, ADR-022."
"db.database.connect".msg = "Facade: mismo ban que db.connection.connect."
"db.database.connect_read".msg = "Facade: mismo ban que db.connection.connect_read."

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["scripts/"]

# ── Módulos que PASAN mypy strict (sin override) ─────────────────────────
# Todos los módulos de producción pasan strict desde 2026-05-29.
# Solo tests y scripts mantienen override (no requieren strict).

# Tests y scripts — no requieren strict typing
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
]
ignore_errors = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
disallow_any_generics = false
warn_unused_ignores = false
disallow_untyped_calls = false

# Dependencias sin stubs útiles
[[tool.mypy.overrides]]
module = [
    "duckdb",
    "duckdb.*",
    "pybreaker",
    "lxml",
    "lxml.*",
    "dateutil",
    "dateutil.*",
    "reportlab",
    "reportlab.*",
    "faiss",
    "faiss.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "sklearn",
    "sklearn.*",
    "bcrypt",
    "prometheus_client",
    "prometheus_client.*",
    "alembic",
    "alembic.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "joblib",
    "opentelemetry",
    "opentelemetry.*",
    "pandera",
    "pandera.*",
    "polars",
    "polars.*",
    "brotli_asgi",
    "redis",
    "redis.*",
    "rq",
    "rq.*",
    "requests",
    "requests.*",
    "cachetools",
    "cachetools.*",
    "statsmodels",
    "statsmodels.*",
    "networkx",
    "networkx.*",
    "openai",
    "openai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"
filterwarnings = [
]
markers = [
    "unit: tests unitarios rápidos (default, sin I/O externo)",
    "integration: tests de integración (requieren BD/FS, sin red externa)",
    "e2e: tests end-to-end (UI/API completa, opcionalmente Playwright)",
    "property: tests basados en propiedades (hypothesis)",
    "load: tests de carga/benchmark (locust/pytest-benchmark)",
    "slow: marca explícita de tests lentos (excluibles con -m 'not slow')",
]

[tool.coverage.run]
branch = true
source = ["api", "db", "scraper", "scheduler", "services", "shared", "observability", "config", "llm"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "scripts/*",
    "scheduler/register_daily_task_windows.ps1",
]

[tool.coverage.report]
# Historial de umbrales:
# 51 → 55 (2026-05-23): tests de threshold_tuning, model_registry, feature_store, drift_report
# 55 → 60 (2026-05-23): Bloque 4 Fase 1 — tests de middleware, shared/cache, scheduler/loop,
#                        contract tests DTOs, tests de api/middleware y scraper/resilience
# 60 → 65 (2026-05-23): Bloque 4 Fase 2 — tests de services/watchlist, services/analytics_engine
# 65 → 70 (2026-05-23): B12 — tests para api/routes/ask.py, stream.py, search.py (22 tests nuevos)
# 70 → 78 (2026-07-04): wrappers de services (users/dlq/audit/saved_filters), rutas
#                        webhooks/auth/eventos/empresas/competitive/predicciones,
#                        analytics resumen+pipeline, adjudicaciones, repo licitaciones,
#                        faiss con modulo fake — 144 tests nuevos, 80.30% medido local
fail_under = 78
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
# Configuración para el hook de pre-commit: bandit -c pyproject.toml -r
targets = ["api", "db", "scraper", "scheduler", "shared", "config"]
skips = [
    "B101",  # assert — cubierto por ruff S101 ya ignorado en tests
    "B603",  # subprocess sin shell — permitido en scheduler
    "B110",  # try-except-pass — permitido en best-effort persisters
    "B311",  # random — sólo usado para salt de demo, no crypto
    "B608",  # hardcoded SQL — todas las queries usan parámetros SQLAlchemy
    "B324",  # hashlib MD5 — usado sólo como cache key (no crypto)
    "B108",  # hardcoded tmp dir — paths de modelos bajo control interno
    "B105",  # hardcoded password — cadenas vacías como defaults, no secrets
    "B403",  # import pickle — aceptado para faiss cache interno
    "B301",  # pickle — aceptado para faiss cache interno
    "B112",  # try-except-continue — aceptado en best-effort loops
    "B310",  # urllib urlopen — URLs controladas internamente
]
exclude_dirs = ["tests", ".agents", ".venv"]
