[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "S101",  # assert allowed in tests
    "S603",  # subprocess calls allowed in scheduler
    "E501",  # line length managed by formatter
    "S110",  # try-except-pass allowed in best-effort persisters
    "B904",  # raise ... from ... — not always needed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S105", "S320"]
"dashboard/*" = ["S110", "RUF001", "RUF002", "RUF003"]  # unicode UI chars are intentional
"dashboard/app.py" = ["E402"]  # sys.path manipulation must precede imports
"dashboard/session_keys.py" = ["S105"]  # LOGIN_PWD is a session-state key name, not a password
"db/database.py" = ["S608"]  # SQL built from internal dataclass-field constants, not user input

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false

# Módulos con tipado estricto validado
[[tool.mypy.overrides]]
module = [
    "config",
    "db.*",
    "observability.*",
    "dashboard.utils.*",
    "dashboard.classifiers",
    "dashboard.normalize",
    "dashboard.forecast",
    "scraper.resilience",
    "scraper.filters",
    "scraper.pipeline",
    "scraper.codice_parser",
    "scraper.bulk_downloader",
]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

# Dependencias sin stubs útiles
[[tool.mypy.overrides]]
module = [
    "libsql",
    "libsql.*",
    "pybreaker",
    "requests",
    "requests.*",
    "lxml",
    "lxml.*",
    "dateutil",
    "dateutil.*",
    "streamlit",
    "streamlit.*",
    "st_aggrid",
    "st_aggrid.*",
    "plotly",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:libsql",
]
markers = [
    "integration: tests de integración E2E (más lentos, requieren BD completa)",
]

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
    "dashboard/pages/*",
    "dashboard/components/*",
    "dashboard/filters/*",
    "dashboard/theme/*",
    "dashboard/app.py",
    "dashboard/auth.py",
    "dashboard/query_params_sync.py",
    "dashboard/router.py",
    "dashboard/data_loader.py",
    "dashboard/stats.py",
    "dashboard/faiss_index.py",
    "scheduler/run_update.py",
    "scheduler/kpi_precompute.py",
    "scraper/ml_classifier.py",
    "observability/prometheus.py",
    "db/rate_limits.py",
    "config.py",
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
