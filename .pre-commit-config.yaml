repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pandas-stubs
          - types-requests
          - types-python-dateutil
        args:
          - "--ignore-missing-imports"
          - "--disable-error-code=misc"
          - "--disable-error-code=no-untyped-def"
          - "--disable-error-code=no-untyped-call"
          - "--disable-error-code=no-any-return"
          - "--disable-error-code=type-arg"
          - "--disable-error-code=arg-type"
          - "--disable-error-code=unused-ignore"
        files: '^(scraper|db|scheduler|dashboard)/.*\.py$|^config/.*\.py$'

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast)
        entry: python -m pytest -x -q --no-header --no-cov -k "not slow" --ignore=tests/test_property_based.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: "^(\\.secrets\\.baseline|tests/fixtures/.*)$"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        # Complementa a detect-secrets con reglas adicionales (AWS, GCP, JWTs, etc.)
        # Configurable vía .gitleaks.toml en la raíz si se requiere personalizar.

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r"]
        files: '^(api|db|scraper|scheduler|dashboard|shared|config)/.*\.py$'
        exclude: '^tests/'

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (dependency vulnerability scan)
        entry: pip-audit --requirement requirements.txt --skip-editable
        language: system
        pass_filenames: false
        stages: [pre-push]
