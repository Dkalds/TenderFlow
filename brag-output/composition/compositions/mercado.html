      const SCROLL = [520, 600, 480, 560];

        "#m-q .w",
        { opacity: 0, filter: "blur(10px)" },

        0.56,

      tl.to("#m-q .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in", stagger: 0.03 }, 3.08);
      tl.to("#m-plate", { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.1);

      // El filtro: lo que no es TI se apaga; lo TI se enciende con su motivo.

        ".m-ti",
        { borderColor: "hsla(34, 12%, 60%, 0.22)", backgroundColor: "hsl(30 8% 8%)" },

          borderColor: "#f39349",

          duration: 0.3,
          ease: "power2.out",
          stagger: 0.06,
        },
        FREEZE + 0.1,
      );
      tl.fromTo(".m-motivo", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", stagger: 0.06 }, FREEZE + 0.18);

      // La línea del filtro, por palabras, y quieta hasta la salida.
