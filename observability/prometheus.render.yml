# Configuración de Prometheus para el despliegue en Render (ADR-019).
#
# Distinta de observability/prometheus.yml, que apunta a los hostnames de
# docker-compose (`api:8080`, `scheduler:9091`) y solo sirve en local. Aquí los
# targets son los nombres de servicio de Render, resolubles entre servicios de
# la misma cuenta y región por la red privada.
#
# Qué NO cubre: los jobs de GitHub Actions (scrape, ML, pliegos) son procesos
# efímeros en runners públicos; Prometheus no puede scrapearlos y exponer un
# Pushgateway público sería una superficie de ataque sin autenticación. Esos
# planos siguen reportando vía la tabla `ops_events`, que lee
# `scheduler/healthcheck.py` cada 6h (ver observability/ops_events.py).

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: prod
    deployment: render

rule_files:
  - /etc/prometheus/alert_rules.yml

# ── Enrutado de alertas (S6.3) ──────────────────────────────────────────────
# Este bloque NO existía. `alert_rules.yml` define diez reglas —dos de ellas
# `severity: critical`— y Prometheus las evalúa de verdad desde ADR-019, pero
# sin `alerting:` una alerta que se dispara no sale de Prometheus: se queda en
# su página /alerts, que no mira nadie. Las etiquetas `severity` solo las
# consume el enrutado de Alertmanager, así que hasta ahora decoraban un enrutado
# inexistente — la capa estaba diseñada y sin cablear.
#
# `tenderflow-alertmanager` es un `pserv` de render.yaml, resoluble por la red
# privada de Render entre servicios de la misma cuenta y región (el mismo
# mecanismo que el target `tenderflow-api:8080` de abajo).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["tenderflow-alertmanager:9093"]

scrape_configs:
  - job_name: "tenderflow-api"
    metrics_path: /metrics
    # /metrics exige en prod una API key con scope metrics:read. Prometheus no
    # puede enviar X-API-Key, así que la API acepta la misma credencial como
    # `Authorization: Bearer` (api/app.py::_prometheus_metrics). ACCIÓN MANUAL
    # (Render dashboard → tenderflow-prometheus → Secret Files): crear el
    # secret file /etc/secrets/metrics_token con una API key metrics:read
    # (scripts/rotate_api_keys.py o make api-key). Sin este fichero el scrape
    # sigue recibiendo 401 — que es exactamente lo que pasaba hasta 2026-08 y
    # dejaba los SLOs de ADR-019 sin medición.
    authorization:
      type: Bearer
      credentials_file: /etc/secrets/metrics_token
    static_configs:
      - targets: ["tenderflow-api:8080"]
        labels:
          service: "api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
