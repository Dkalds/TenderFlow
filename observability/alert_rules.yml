# Reglas de alerta de Prometheus.
#
# NOTA: estas reglas NO se evaluan en produccion porque no hay Prometheus
# scrapeando el endpoint /metrics del API de Render, y los counters son
# por-proceso (el writer principal, scheduler.run_update en GH Actions,
# muere al terminar cada run).
#
# Los umbrales de estas reglas se espejan en scheduler/healthcheck.py
# (check "ops_events_*"), que lee la tabla ops_events de la BD -- la unica
# fuente de verdad comun entre planos efimeros. El healthcheck SI corre en
# prod (GH Actions healthcheck.yml cada 6h) y envia alertas por email.
#
# Para usar Prometheus localmente con monitoring activo:
#   docker compose --profile monitoring up
# Runbook: docs/runbooks/persistence-tripwires.md
#
# F3d (post-cutover ADR-016): los tripwires de SQLite se mantienen para el
# periodo de rollback (>=14 dias); tras confirmar estabilidad en Postgres,
# retirar el grupo persistence_tripwires y activar postgres_pool_alerts.
#

groups:
  - name: persistence_tripwires
    # Tripwires SQLite/Turso (ADR-004).
    # POST-CUTOVER: estas alertas dejaran de dispararse cuando DATABASE_URL apunte
    # a Postgres (sqlite_busy_errors_total quedara en 0). Retirar este grupo en F3d
    # tras 2 semanas estables en Postgres.
    rules:
      - alert: SQLiteBusyErrorsHigh
        # ADR-004: >10 BUSY/h sostenido → evaluar migración a Postgres.
        # POST-CUTOVER ADR-016: si esta alerta salta tras el flip, hay un
        # call-site que no usa DATABASE_URL. Investigar db/connection.py logs.
        expr: rate(sqlite_busy_errors_total[1h]) * 3600 > 10
        for: 15m
        labels:
          severity: warning
          adr: "004"
        annotations:
          summary: "SQLite BUSY errors por encima del tripwire (>10/h)"
          description: >
            rate(sqlite_busy_errors_total[1h]) supera 10/h sostenido.
            Indica contención de escritura. Seguir
            docs/runbooks/persistence-tripwires.md.

      - alert: DBWriteLatencyHigh
        # ADR-004: p99 de escritura >500ms → investigar contención.
        expr: histogram_quantile(0.99, rate(db_write_duration_seconds_bucket[10m])) > 0.5
        for: 15m
        labels:
          severity: warning
          adr: "004"
        annotations:
          summary: "Latencia p99 de escritura DB > 500ms"
          description: >
            El p99 de db_write_duration_seconds supera 500ms durante 15m.
            Investigar contención de escritura (ver runbook).

      - alert: DBConcurrentWritersHigh
        # ADR-004: >3 escritores concurrentes sostenido → review de arquitectura.
        expr: max_over_time(db_concurrent_writers[10m]) > 3
        for: 15m
        labels:
          severity: warning
          adr: "004"
        annotations:
          summary: "Escritores concurrentes DB > 3"
          description: >
            db_concurrent_writers supera 3 sostenido. El supuesto single-writer
            de ADR-004 ya no se sostiene; revisar arquitectura de persistencia.

  - name: llm_budget
    # Presupuesto LLM (RFC llm-dependencia-gestionada). En modo monitor estas
    # alertas son la unica senal de que el enforcement habria cortado trafico.
    rules:
      - alert: LLMBudgetExceeded
        expr: increase(llm_budget_exceeded_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          rfc: "2026-06-30-llm"
        annotations:
          summary: "Presupuesto LLM agotado (ventana {{ $labels.window }}, modo {{ $labels.mode }})"
          description: >
            llm_budget_exceeded_total sube: el gasto acumulado supero
            LLM_BUDGET_USD_DAILY/_MONTHLY. En modo monitor no se corta trafico;
            evaluar subir el presupuesto o activar LLM_BUDGET_MODE=enforce.

  - name: dedupe_quality
    # Banda del match-rate del dedupe cross-fuente (RFC validacion-dedupe-linaje).
    # Un cambio de normalizacion que de golpe dispara el rate es una regresion de
    # matching detectable en vivo (el gate absoluto vive en test_dedupe_quality.py).
    rules:
      - alert: DedupeMatchRateHigh
        # Baseline esperado: el solape PSCP<->PLACSP es una fraccion minoritaria de
        # las filas nuevas. Si mas de la mitad de una pasada se marca como duplicado,
        # lo mas probable es una regresion de normalize_organo/natural_expediente.
        expr: dedupe_match_rate > 0.5
        for: 30m
        labels:
          severity: warning
          rfc: "2026-06-30-dedupe"
        annotations:
          summary: "Dedupe: match-rate anómalo (>50% de filas nuevas marcadas)"
          description: >
            dedupe_match_rate{fuente} supera 0.5 sostenido. Revisar el último
            cambio en services/dedupe.py / services/normalization.py y correr
            tests/test_dedupe_quality.py contra el golden set.

      - alert: DedupeConfirmedBurst
        # Rafaga de marcados confirmados: un backfill legitimo puede dispararla,
        # pero fuera de backfills indica clave debil sobre-matcheando.
        expr: rate(dedupe_marked_total{status="confirmed"}[1h]) * 3600 > 500
        for: 30m
        labels:
          severity: warning
          rfc: "2026-06-30-dedupe"
        annotations:
          summary: "Dedupe: >500 confirmados/hora sostenido"
          description: >
            dedupe_marked_total{status=confirmed} crece a más de 500/h fuera de
            un backfill conocido. Verificar precision con el golden set antes de
            que exclude_duplicados_sql() borre señal real del análisis.

  - name: postgres_pool_alerts
    # Alertas de pool Postgres (ADR-016, activas post-cutover F3d).
    # Activar cuando DATABASE_URL esté configurada en producción.
    rules:
      - alert: PgPoolAcquireTimeoutHigh
        # El pool psycopg_pool está saturado: las conexiones tardan en obtenerse.
        expr: rate(db_pool_acquire_timeout_total[5m]) * 300 > 3
        for: 5m
        labels:
          severity: warning
          adr: "016"
        annotations:
          summary: "Pool Postgres: timeouts de adquisición de conexión (>3 en 5m)"
          description: >
            db_pool_acquire_timeout_total sube >3 en 5 minutos. El pool está
            saturado. Considera aumentar DB_POOL_SIZE o revisar conexiones lentas.
            Runbook: docs/runbooks/migracion-persistencia.md

      - alert: PgWriteLatencyHigh
        # p99 de escritura en Postgres >1s (threshold más permisivo que SQLite
        # porque pg_dump y queries complejas pueden ser más lentas).
        expr: histogram_quantile(0.99, rate(db_write_duration_seconds_bucket[10m])) > 1.0
        for: 10m
        labels:
          severity: warning
          adr: "016"
        annotations:
          summary: "Latencia p99 de escritura Postgres > 1s"
          description: >
            El p99 de db_write_duration_seconds supera 1s durante 10m con backend
            Postgres. Investigar queries lentas en Supabase Dashboard →
            Query Performance.

      - alert: PgPoolHealthCheckFailed
        # La API no puede conectar al pool de Postgres.
        # Se emite cuando el health endpoint devuelve db!=ok.
        expr: up{job="tenderflow_api"} == 0
        for: 2m
        labels:
          severity: critical
          adr: "016"
        annotations:
          summary: "API Tenderflow no disponible (posible fallo de pool Postgres)"
          description: >
            El scrape de Prometheus a tenderflow_api devuelve 0 durante 2 minutos.
            Verificar DATABASE_URL, pool psycopg y Supabase status.
