# Reglas de alerta de Prometheus.
#
# ESTADO (2026-07-26, ADR-019): estas reglas SI se evaluan en produccion desde
# que Prometheus corre como servicio en Render y scrapea /metrics del API
# (observability/prometheus.render.yml).
#
# Salvedad: los counters de los planos EFIMEROS (scraper/ML/pliegos en GH
# Actions) siguen sin ser scrapeables -- el proceso muere al terminar el job.
# Esos siguen reportando via la tabla ops_events, que lee
# scheduler/healthcheck.py cada 6h.
#
# Los umbrales de estas reglas se espejan en scheduler/healthcheck.py
# (check "ops_events_*"), que lee la tabla ops_events de la BD -- la unica
# fuente de verdad comun entre planos efimeros. El healthcheck SI corre en
# prod (GH Actions healthcheck.yml cada 6h) y envia alertas por email.
#
# Para usar Prometheus localmente con monitoring activo:
#   docker compose --profile monitoring up
# Runbook: docs/runbooks/persistence-tripwires.md
#
# El grupo persistence_tripwires (tripwires SQLite de ADR-004) se retiro en
# 2026-08 tras ADR-021 (SQLite eliminado): sus metricas ya no se emiten. La
# latencia de escritura la cubre PgWriteLatencyHigh (postgres_pool_alerts).
#

groups:
  # El grupo analytics_degradation (AnalyticsDegradedServing) se retiro en
  # 2026-08 al completar ADR-023: todos los endpoints analiticos agregan en
  # SQL o usan proyecciones acotadas, el cortacircuitos full-table ya no
  # existe y su metrica analytics_degraded_responses_total dejo de emitirse.

  - name: api_availability
    # Salud de LECTURA de la API vista desde el tráfico real (métricas RED de
    # prometheus-fastapi-instrumentator, api/app.py).
    #
    # Existe porque el 2026-08-28 la superficie pública devolvió 500 durante
    # horas sin que se disparara nada: PgPoolHealthCheckFailed mira
    # `up{job="tenderflow-api"}`, y un proceso que contesta 500 a todo sigue
    # sirviendo /metrics, así que `up` vale 1. La señal existía —el
    # instrumentador va con should_group_status_codes=False, o sea que hay
    # `http_requests_total{status="500"}` desglosado— y se dibujaba en el panel
    # RED de Grafana, pero ninguna regla la miraba.
    rules:
      - alert: ApiErrorRateHigh
        # Misma expresión que el panel "error rate" de
        # observability/grafana/dashboards/api_red.json, para que lo que alerta
        # y lo que se mira al diagnosticar sean el mismo número.
        #
        # El clamp_min(…, 1) del denominador no es cosmético: con tráfico casi
        # nulo (madrugada) un puñado de 5xx daría un ratio de 1.0 y la alerta
        # sería ruido permanente. Al suelo de 1 req/s hace falta volumen real
        # de errores para cruzar el 5 %.
        #
        # OJO: /api/v1/health.* está en `excluded_handlers`, así que el
        # healthcheck verde no diluye el ratio — que es justo el escenario del
        # incidente.
        expr: >-
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API: más del 5% de respuestas 5xx durante 5m"
          description: >
            Más del 5% del tráfico HTTP acaba en 5xx sostenido durante 5
            minutos. El proceso puede seguir vivo (up=1) y aun así no servir
            nada útil. Revisar logs de la API en Render y el panel
            api_red.json antes de mirar la base de datos.

  - name: llm_budget
    # Presupuesto LLM (RFC llm-dependencia-gestionada). En modo monitor estas
    # alertas son la unica senal de que el enforcement habria cortado trafico.
    rules:
      - alert: LLMBudgetExceeded
        expr: increase(llm_budget_exceeded_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          rfc: "2026-06-30-llm"
        annotations:
          summary: "Presupuesto LLM agotado (ventana {{ $labels.window }}, modo {{ $labels.mode }})"
          description: >
            llm_budget_exceeded_total sube: el gasto acumulado supero
            LLM_BUDGET_USD_DAILY/_MONTHLY. En modo monitor no se corta trafico;
            evaluar subir el presupuesto o activar LLM_BUDGET_MODE=enforce.

  - name: dedupe_quality
    # Banda del match-rate del dedupe cross-fuente (RFC validacion-dedupe-linaje).
    # Un cambio de normalizacion que de golpe dispara el rate es una regresion de
    # matching detectable en vivo (el gate absoluto vive en test_dedupe_quality.py).
    rules:
      - alert: DedupeMatchRateHigh
        # Baseline esperado: el solape PSCP<->PLACSP es una fraccion minoritaria de
        # las filas nuevas. Si mas de la mitad de una pasada se marca como duplicado,
        # lo mas probable es una regresion de normalize_organo/natural_expediente.
        expr: dedupe_match_rate > 0.5
        for: 30m
        labels:
          severity: warning
          rfc: "2026-06-30-dedupe"
        annotations:
          summary: "Dedupe: match-rate anómalo (>50% de filas nuevas marcadas)"
          description: >
            dedupe_match_rate{fuente} supera 0.5 sostenido. Revisar el último
            cambio en services/dedupe.py / services/normalization.py y correr
            tests/test_dedupe_quality.py contra el golden set.

      - alert: DedupeConfirmedBurst
        # Rafaga de marcados confirmados: un backfill legitimo puede dispararla,
        # pero fuera de backfills indica clave debil sobre-matcheando.
        expr: rate(dedupe_marked_total{status="confirmed"}[1h]) * 3600 > 500
        for: 30m
        labels:
          severity: warning
          rfc: "2026-06-30-dedupe"
        annotations:
          summary: "Dedupe: >500 confirmados/hora sostenido"
          description: >
            dedupe_marked_total{status=confirmed} crece a más de 500/h fuera de
            un backfill conocido. Verificar precision con el golden set antes de
            que exclude_duplicados_sql() borre señal real del análisis.

  - name: postgres_pool_alerts
    # Alertas de pool Postgres (ADR-016, activas post-cutover F3d).
    # Activar cuando DATABASE_URL esté configurada en producción.
    rules:
      - alert: PgPoolAcquireTimeoutHigh
        # El pool psycopg_pool está saturado: las conexiones tardan en obtenerse.
        expr: rate(db_pool_acquire_timeout_total[5m]) * 300 > 3
        for: 5m
        labels:
          severity: warning
          adr: "016"
        annotations:
          summary: "Pool Postgres: timeouts de adquisición de conexión (>3 en 5m)"
          description: >
            db_pool_acquire_timeout_total sube >3 en 5 minutos. El pool está
            saturado. Considera aumentar DB_POOL_SIZE o revisar conexiones lentas.
            Runbook: docs/runbooks/migracion-persistencia.md

      - alert: PgWriteLatencyHigh
        # p99 de escritura en Postgres >1s (threshold más permisivo que SQLite
        # porque pg_dump y queries complejas pueden ser más lentas).
        expr: histogram_quantile(0.99, rate(db_write_duration_seconds_bucket[10m])) > 1.0
        for: 10m
        labels:
          severity: warning
          adr: "016"
        annotations:
          summary: "Latencia p99 de escritura Postgres > 1s"
          description: >
            El p99 de db_write_duration_seconds supera 1s durante 10m con backend
            Postgres. Investigar queries lentas en Supabase Dashboard →
            Query Performance.

      - alert: PgReadLatencyHigh
        # Simétrica de PgWriteLatencyHigh sobre db_read_duration_seconds, que
        # db/connection.py ya observa en cada lectura. El umbral es mucho más
        # alto (5s, no 1s) a propósito: una lectura lenta no bloquea a nadie
        # como sí lo hace una escritura, y las agregaciones analíticas tardan
        # segundos de forma legítima. A 5s de p99 el timeout del cliente ya
        # está cerca y la pantalla se ve rota, que es cuando importa.
        expr: histogram_quantile(0.99, rate(db_read_duration_seconds_bucket[10m])) > 5.0
        for: 10m
        labels:
          severity: warning
          adr: "016"
        annotations:
          summary: "Latencia p99 de lectura Postgres > 5s"
          description: >
            El p99 de db_read_duration_seconds supera 5s durante 10m.
            Sospechar de un índice que dejó de usarse o de un anti-join sin
            acotar; investigar en Supabase Dashboard → Query Performance.

      - alert: PgConcurrentWritersHigh
        # ADR-004: >3 escritores concurrentes sostenido → review de arquitectura.
        # Se retiró por error junto con SQLiteBusyErrorsHigh al limpiar
        # tripwires SQLite (2026-08): db_concurrent_writers sigue vivo con el
        # pool psycopg_pool y el supuesto single-writer de ADR-004 es igual de
        # relevante en Postgres -- de hecho más, porque el pool sí permite
        # concurrencia real donde SQLite/WAL la impedía a nivel de motor.
        expr: max_over_time(db_concurrent_writers[10m]) > 3
        for: 15m
        labels:
          severity: warning
          adr: "004"
        annotations:
          summary: "Escritores concurrentes DB > 3"
          description: >
            db_concurrent_writers supera 3 sostenido. El supuesto single-writer
            de ADR-004 ya no se sostiene; revisar arquitectura de persistencia.

      - alert: PgPoolHealthCheckFailed
        # La API no responde al scrape de Prometheus.
        # OJO: el nombre del job debe coincidir con prometheus.render.yml
        # ("tenderflow-api", con guion). Hasta 2026-08 esta regla usaba
        # "tenderflow_api" (guion bajo) y la unica alerta critical no podia
        # dispararse nunca.
        expr: up{job="tenderflow-api"} == 0
        for: 2m
        labels:
          severity: critical
          adr: "016"
        annotations:
          summary: "API Tenderflow no disponible (posible fallo de pool Postgres)"
          description: >
            El scrape de Prometheus a tenderflow-api devuelve 0 durante 2 minutos.
            Verificar DATABASE_URL, pool psycopg y Supabase status.
