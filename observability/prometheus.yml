global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "licitaciones-scraper"
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:9091"]
        labels:
          service: "scraper"

  - job_name: "licitaciones-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: "api"

  - job_name: "licitaciones-dashboard"
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["dashboard:9092"]
        labels:
          service: "dashboard"
