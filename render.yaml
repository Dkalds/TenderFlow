services:
  - type: web
    name: tenderflow-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: prod
      # Perfil de componentes: este servicio sirve la API HTTP, así que exige
      # SIGNING_KEY, API_HMAC_SECRET, REDIS_URL y CORS_ALLOWED_ORIGINS. Los
      # jobs de GitHub Actions usan APP_PROFILE=scraper contra la misma BD.
      - key: APP_PROFILE
        value: api
      # Postgres/Supabase (ADR-016, F3) — tiene precedencia sobre SQLite local.
      # Usar Supavisor session pooler (puerto 5432). TLS: se recomienda
      # ?sslmode=verify-full + DATABASE_SSL_ROOT_CERT (CA de Supabase) para
      # prevenir MITM; sslmode=disable/allow/prefer se rechazan en prod.
      - key: DATABASE_URL
        sync: false
      # Ruta a la CA de Supabase para verify-full (cert público). Ver db/certs/README.md.
      - key: DATABASE_SSL_ROOT_CERT
        sync: false
      # Tamaño del pool psycopg hacia el session pooler de Supavisor. El
      # default de config/settings.py (5) se quedaba corto: las agregaciones
      # de analytics retenían las 5 conexiones y el resto de endpoints
      # esperaba en cola (pool-1 connection timeout, 2026-08-01).
      - key: DB_POOL_SIZE
        value: "12"
      # ── Redis (cache compartido + rate limiting) — OBLIGATORIO en prod ──
      # Formato: redis://[:password@]host[:port][/db]
      - key: REDIS_URL
        sync: false
      # Debe coincidir con --requirepass del servidor Redis. Obligatorio si REDIS_URL está definida.
      - key: REDIS_PASSWORD
        sync: false

      # ── OAuth Google (opcional) ─────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      # Opcional. Si se dejan ambas vacías, cualquier cuenta de Google puede
      # iniciar sesión (solo un warning en logs, no bloquea el arranque).
      - key: OAUTH_ALLOWED_DOMAINS
        sync: false
      - key: OAUTH_ALLOWED_EMAILS
        sync: false
      - key: OAUTH_ADMIN_EMAILS
        sync: false

      # ── Secretos de firma — independientes entre sí, 32+ caracteres ──
      # Genera cada uno con: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SIGNING_KEY
        sync: false
      - key: API_HMAC_SECRET
        sync: false
      # Firma de la cadena de auditoría (db/audit.py). Obligatorio en prod;
      # sin versionado/rotación — configúralo una vez y no lo cambies.
      - key: AUDIT_HMAC_KEY
        sync: false
      # Firma de webhooks salientes. Opcional: cae a SIGNING_KEY si está vacío.
      - key: WEBHOOK_SIGNING_KEY
        sync: false
      # Allowlist de destinos de webhooks salientes (dominios separados por
      # coma). Sin ella, los webhooks quedan deshabilitados en prod. No uses '*'.
      - key: WEBHOOK_ALLOWED_HOSTS
        sync: false
      # Cifrado de secretos TOTP (2FA). Clave Fernet, no un hex normal:
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: TOTP_ENCRYPTION_KEY
        sync: false

      # ── Asistente RAG /api/v1/ask (opcional) ─────────────────────────
      # Proveedor por defecto: NVIDIA NIM. Alternativos: OPENAI_API_KEY, ANTHROPIC_API_KEY.
      - key: NVIDIA_API_KEY
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Sentry: observability/sentry.py es opt-in por SENTRY_DSN. Sin esta
      # variable, configure_sentry() en api/app.py es un no-op y producción
      # corre sin captura de errores ni trazas.
      - key: SENTRY_DSN
        sync: false

  # ── Observabilidad (ADR-019) ────────────────────────────────────────────
  # El código expone /metrics desde siempre, pero hasta ahora nadie lo
  # scrapeaba: el único Prometheus vivía en docker-compose.yml apuntando a
  # hostnames de compose local. Resultado: 5 de los 6 SLOs de docs/sli-slo.md
  # no tenían medición y el error budget no era computable.
  #
  # Prometheus es un servicio privado (no expuesto a internet); Grafana es web
  # porque hay que abrirlo desde el navegador y trae su propia autenticación.
  - type: pserv
    name: tenderflow-prometheus
    runtime: image
    image:
      url: docker.io/prom/prometheus:v2.53.0
    plan: starter
    region: frankfurt
    dockerCommand: >-
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=30d
      --web.enable-lifecycle
    disk:
      name: prometheus-data
      mountPath: /prometheus
      sizeGB: 10

  - type: web
    name: tenderflow-grafana
    runtime: image
    image:
      url: docker.io/grafana/grafana-oss:11.1.0
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: grafana-data
      mountPath: /var/lib/grafana
      sizeGB: 1
    envVars:
      # Contraseña fuerte obligatoria: config/settings.py la valida con
      # check_password_strength (mínimo 16 caracteres) en ENV=prod.
      - key: GF_SECURITY_ADMIN_PASSWORD
        sync: false
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_SERVER_ROOT_URL
        sync: false
