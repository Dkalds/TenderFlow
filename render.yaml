services:
  - type: web
    name: tenderflow-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: prod
      # Postgres/Supabase (ADR-016, F3) — tiene precedencia sobre TURSO_* y SQLite.
      # Usar Supavisor session pooler (puerto 5432). TLS: se recomienda
      # ?sslmode=verify-full + DATABASE_SSL_ROOT_CERT (CA de Supabase) para
      # prevenir MITM; sslmode=disable/allow/prefer se rechazan en prod.
      - key: DATABASE_URL
        sync: false
      # Ruta a la CA de Supabase para verify-full (cert público). Ver db/certs/README.md.
      - key: DATABASE_SSL_ROOT_CERT
        sync: false
      # Turso/libSQL (legacy) — se ignora si DATABASE_URL está definida.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: SIGNING_KEY
        sync: false
      - key: API_HMAC_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FORWARDED_ALLOW_IPS
        value: "*"
