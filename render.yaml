# Blueprint de Render. **Decisión tomada el 2026-09-06 (O0.2 del plan de
# arquitectura v2, cierra D4): se vincula el Blueprint y manda este fichero.**
#
# Por qué esta opción y no la contraria (declararlo documental, dejar
# `autoDeploy` activo y borrar `.github/workflows/deploy.yml`): con autoDeploy
# activo un push a `master` despliega el commit sea cual sea el estado de CI,
# así que los jobs de CI, los ratchets, el fuzzing y los E2E quedan como advisory
# —informan, no impiden—. Vincular el Blueprint es la única de las dos ramas que
# preserva el gate: `autoDeploy: false` + `deploy.yml` como único disparador
# significa que a producción solo llega lo que alguien lanza a sabiendas sobre
# un commit verde.
#
# ── Qué es verdad hoy y con qué fecha ──────────────────────────────────────
# Verificado el 2026-08-28 contra la API de Render (no contra el dashboard, que
# no expone el vínculo con el Blueprint):
#
#   - Nombre lógico del servicio: `tenderflow-api` (coincide con este fichero).
#   - Host real: `tenderflow-jrtr.onrender.com`. NO es
#     `tenderflow-api.onrender.com`: el sufijo aleatorio lo pone Render al crear
#     el servicio a mano. Es el valor que tienen que llevar `vars.SMOKE_BASE_URL`
#     (smoke.yml, deploy.yml) y `CORS_ALLOWED_ORIGINS`/`FRONTEND_URL`.
#   - `plan`: **standard** en el servicio real (este fichero ya dice `standard`).
#   - `autoDeploy`: estaba **ACTIVO** en el servicio real; se apagó el
#     2026-10-18 desde el dashboard (`autoDeployTrigger: off`, leído por la API
#     de Render), igual que en `tenderflow-mcp`. Ya coincide con este fichero.
#   - `healthCheckPath`: el 2026-08-04 el servicio real no tenía ninguno
#     configurado. Sin re-verificar desde entonces.
#
# El servicio se creó a mano por el dashboard y **todavía no está vinculado** a
# este Blueprint. Mientras el checklist de abajo no esté completo, lo que sigue
# describe el estado **DESEADO**: editarlo no cambia nada en Render. En cuanto
# el checklist se complete, este fichero pasa a ser la configuración vigente y
# cualquier cambio aquí sí llega al servicio.
#
# ── Checklist HUMANO (dashboard de Render, en ventana) ─────────────────────
# Vincular un Blueprint a un servicio existente puede recrearlo: hacerlo en
# ventana de baja actividad y con `plan: standard` ya escrito aquí (enlazar con
# `free` degradaría el servicio a un plan con spin-down).
#
#   [ ] 1. Dashboard → Blueprints → New Blueprint Instance sobre este repo, o
#          Settings del servicio → vincularlo a este `render.yaml`.
#   [x] 2. Settings → Build & Deploy → confirmar que `Auto-Deploy` queda en
#          **No**. Es lo que impide el segundo camino de despliegue. Hecho el
#          2026-10-18 sin vincular el Blueprint: queda comprobar que vincular
#          no lo vuelve a encender.
#   [ ] 3. Settings → Health Check Path → confirmar `/api/v1/health`. Sin él
#          Render corta la instancia vieja antes de saber si la nueva arranca,
#          y no hay rollback automático de un arranque roto.
#   [ ] 4. Settings → confirmar `plan` = **standard** después de vincular (es
#          el valor que se degradaría si el Blueprint entrara con otro).
#   [ ] 5. Anotar aquí el resultado con su fecha, y cambiar la frase «estado
#          DESEADO» de arriba por «estado VIGENTE».
#   [ ] 6. Durante los 7 días siguientes, comprobar en el dashboard que un push
#          a `master` produce **exactamente un** deploy de `tenderflow-api`
#          —el que dispara `deploy.yml`, y ninguno más— (criterio de aceptación
#          de O0.2), y que `smoke.yml` sigue verde en sus 96 ejecuciones de las
#          primeras 24 h.
#
# Mientras el paso 2 no esté hecho, conviven los dos caminos: el push
# despliega por su cuenta y `deploy.yml` dispara otro. Es el estado que O0.2
# existe para terminar.
#
# ── autoDeploy: solo lo apaga `tenderflow-api`, y a propósito ──────────────
# Los tres servicios de observabilidad no declaran `autoDeploy` y se quedan con
# el default de Render (activo). No es un descuido: su configuración va HORNEADA
# en la imagen (`docker/Dockerfile.prometheus`, `docker/Dockerfile.alertmanager`
# copian los `.yml` dentro), así que un cambio en `observability/alert_rules.yml`
# solo llega a producción con un build nuevo. Apagarles el autoDeploy
# significaría que una regla de alerta editada aquí no alerta allí hasta que
# alguien se acuerde de redesplegar a mano — el fallo silencioso que el plano de
# alertas existe para terminar. El que necesita el gate es el servicio que
# atiende internet, y ese es el único que lo lleva.
#
# Consecuencia que hay que tener presente al contar deploys en el dashboard: un
# push a `master` sigue redesplegando esos tres. Si ese ruido molesta, la
# herramienta correcta son los build filters de Render por ruta de fichero, no
# apagarles el autoDeploy.
#
# ── healthCheckPath: qué servicio lo declara y por qué ─────────────────────
# Verificado sobre este fichero el 2026-09-06:
#
#   - `tenderflow-api` (web) → `/api/v1/health`. Es el que atiende internet y
#     el único cuyo arranque roto se ve desde fuera; sin healthcheck no hay
#     rollback automático.
#   - `tenderflow-grafana` (web) → `/api/health`, el de la propia imagen.
#   - `tenderflow-prometheus` y `tenderflow-alertmanager` (`pserv`) → **no lo
#     declaran**. No es un olvido: son servicios privados que Render no expone,
#     escuchan en un puerto fijado por el proyecto (9090 y 9093, este último vía
#     la variable `PORT` de más abajo) y no se ha verificado desde aquí que el
#     validador de Blueprints acepte `healthCheckPath` en un `pserv`. Añadirlo a
#     ciegas arriesga que falle la validación justo en la ventana del paso 1.
#     Que el Alertmanager esté vivo lo cubre la regla `Watchdog`
#     (observability/alert_rules.yml), que es precisamente una comprobación
#     externa del canal — ver docs/runbooks/observability-alerts.md §3.
#
# `docs/sli-slo.md` todavía suspende el SLO de disponibilidad «mientras
# `tenderflow-api` use Render Free»: ese documento no es de este ítem y queda
# reportado como desajuste pendiente.
services:
  - type: web
    name: tenderflow-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    # `free` hasta 2026-08-28, cuando se verificó por la API de Render que el
    # servicio real corre en `standard`, que es lo que dice esta línea. Es el
    # valor que el paso 4 del checklist tiene que reconfirmar DESPUÉS de
    # vincular: enlazar el Blueprint con `free` escrito aquí degradaría el
    # servicio a un plan con spin-down.
    plan: standard
    region: frankfurt
    # Pendiente del paso 2 del checklist: el servicio real tenía autoDeploy
    # ACTIVO el 2026-08-28. Hasta que se confirme `Auto-Deploy: No`, esta línea
    # es intención; después es la configuración vigente.
    #
    # Deploy NO automático en cada push: sin esto Render despliega código en
    # cada commit a la rama conectada, incluso con CI en rojo, dejando todo el
    # aparato de gates (jobs de CI, ratchets, fuzzing, E2E) como puramente
    # advisory para producción. Con autoDeploy:false el único disparador es
    # `.github/workflows/deploy.yml`, que corre a mano sobre un commit elegido
    # y verifica el resultado. Un despliegue solo debe ocurrir sobre un commit
    # verde.
    autoDeploy: false
    # Pendiente del paso 3 del checklist: el 2026-08-04 el servicio real no
    # tenía healthcheck configurado. Sin él Render no espera a que la instancia
    # nueva esté sana antes de cortar la vieja, así que un arranque roto
    # reemplaza igualmente al proceso que funcionaba.
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: prod
      # Perfil de componentes: este servicio sirve la API HTTP, así que exige
      # SIGNING_KEY, API_HMAC_SECRET, REDIS_URL y CORS_ALLOWED_ORIGINS. Los
      # jobs de GitHub Actions usan APP_PROFILE=scraper contra la misma BD.
      - key: APP_PROFILE
        value: api
      # Postgres/Supabase (ADR-016, F3) — tiene precedencia sobre SQLite local.
      # Usar Supavisor session pooler (puerto 5432). TLS: se recomienda
      # ?sslmode=verify-full + DATABASE_SSL_ROOT_CERT (CA de Supabase) para
      # prevenir MITM; sslmode=disable/allow/prefer se rechazan en prod.
      - key: DATABASE_URL
        sync: false
      # Ruta a la CA de Supabase para verify-full (cert público). Ver db/certs/README.md.
      - key: DATABASE_SSL_ROOT_CERT
        sync: false
      # ── Presupuesto de conexiones ────────────────────────────────────
      # Hay DOS pools psycopg, no uno: escritura (`connect`) y lectura
      # (`connect_read`), porque el modo solo-lectura se fija en la sesión.
      # Cada uno abre su propia conexión de sesión contra Supavisor, así que
      # el techo de este servicio es la SUMA de los dos, no `DB_POOL_SIZE`.
      # (Con más precisión: `min(API_THREADPOOL_TOKENS, escritura + lectura)`,
      # porque cada hilo síncrono sostiene como mucho una conexión. Hoy los
      # dos términos valen 24 —el threadpool por un lado, 12+12 por otro—,
      # así que el techo queda en 24 mires por donde mires.)
      #
      # Ese techo tiene que caber en el `Pool Size` del session pooler de
      # Supabase (Project Settings → Database → Connection pooling). Si no
      # cabe, la API se queda sin ranuras ella sola bajo carga, y cualquier
      # otro cliente —el `alembic upgrade` de .github/workflows/migrate.yml,
      # los jobs con APP_PROFILE=scraper— muere en el connect con
      # `FATAL: (EMAXCONNSESSION) max clients reached in session mode`.
      # Fue exactamente lo que pasó el 2026-08-24: pooler en 15, techo en 24.
      #
      # A fecha de este commit: 12 + 12 = 24, con el pooler en 30. Ese 30 se
      # configura en el panel de Supabase, no aquí, así que este número es
      # una nota — la verdad está en el dashboard.
      #
      # Al subir cualquiera de los dos valores, subir antes el pooler. El
      # margen que queda arriba lo marca `max_connections` de la instancia
      # (60, menos 3 reservadas para superusuario), del que los servicios de
      # la propia plataforma (PostgREST, Storage, mgmt-api, exporter) ya
      # consumen ~8 conexiones directas que NO pasan por el pooler.
      #
      # Subir de 5 a 12 vino de un incidente concreto: las agregaciones de
      # analytics retenían las 5 conexiones del default de
      # config/settings.py y el resto de endpoints esperaba en cola
      # (pool-1 connection timeout, 2026-08-01).
      - key: DB_POOL_SIZE
        value: "12"
      # Declarado explícitamente aunque coincida con el de escritura: el
      # default de config/settings.py es 0, que NO significa «sin pool de
      # lectura» sino «hereda DB_POOL_SIZE» (db/connection.py, `0 or
      # default_size`). Sin esta línea el 24 de arriba es emergente y nadie
      # que lea este fichero lo ve venir.
      - key: DB_READ_POOL_SIZE
        value: "12"
      # ── Redis (cache compartido + rate limiting) — OBLIGATORIO en prod ──
      # Formato: redis://[:password@]host[:port][/db]
      - key: REDIS_URL
        sync: false
      # Debe coincidir con --requirepass del servidor Redis. Obligatorio si REDIS_URL está definida.
      - key: REDIS_PASSWORD
        sync: false

      # ── OAuth Google (opcional) ─────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      # OBLIGATORIO si GOOGLE_CLIENT_ID está definido: con ambos allowlists
      # vacíos el arranque en prod se rechaza (fail-closed, 2026-08). Para
      # login abierto deliberado usar OAUTH_ALLOWED_DOMAINS=*.
      - key: OAUTH_ALLOWED_DOMAINS
        sync: false
      - key: OAUTH_ALLOWED_EMAILS
        sync: false
      - key: OAUTH_ADMIN_EMAILS
        sync: false

      # ── Secretos de firma — independientes entre sí, 32+ caracteres ──
      # Genera cada uno con: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SIGNING_KEY
        sync: false
      - key: API_HMAC_SECRET
        sync: false
      # Firma de la cadena de auditoría (db/audit.py). Obligatorio en prod;
      # sin versionado/rotación — configúralo una vez y no lo cambies.
      - key: AUDIT_HMAC_KEY
        sync: false
      # Firma de webhooks salientes. Opcional: cae a SIGNING_KEY si está vacío.
      - key: WEBHOOK_SIGNING_KEY
        sync: false
      # Allowlist de destinos de webhooks salientes (dominios separados por
      # coma). Sin ella, los webhooks quedan deshabilitados en prod. No uses '*'.
      - key: WEBHOOK_ALLOWED_HOSTS
        sync: false
      # Cifrado de secretos TOTP (2FA). Clave Fernet, no un hex normal:
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: TOTP_ENCRYPTION_KEY
        sync: false

      # ── Asistente RAG /api/v1/ask (opcional) ─────────────────────────
      # Proveedor por defecto: NVIDIA NIM. Alternativos: OPENAI_API_KEY, ANTHROPIC_API_KEY.
      - key: NVIDIA_API_KEY
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # IPs o rangos CIDR del proxy cuyo X-Forwarded-For se honra.
      # **No es lo que da la IP del visitante** (RFC 2026-10-24): tras Vercel,
      # Cloudflare y el proxy de Render, recorrer X-Forwarded-For solo llega al
      # egreso de Vercel, compartido por todos. Eso lo resuelve
      # API_ORIGIN_SECRET, más abajo. No la abras a 10.0.0.0/8 por separado:
      # uvicorn reescribiría el peer con un salto igual de compartido.
      # Gestionado por entorno (sync: false); nunca "*".
      # Con "*" uvicorn acepta la cabecera de cualquier peer y el cliente elige
      # qué IP ve la aplicación, tumbando rate limiting, lockout de login y la
      # trazabilidad del audit log. El validator
      # _validate_prod_forwarded_allow_ips hace fallar el arranque en ese caso:
      # fallo ruidoso en el deploy, en vez de degradación silenciosa en runtime.
      # Defensa en profundidad si "*" llegara a colarse fuera de prod/staging
      # (dev, test): api/middleware.py::_trusted_client_ip trata ese caso como
      # "un salto de confianza" y toma el ÚLTIMO hop de X-Forwarded-For (el que
      # appendea el proxy), nunca el primero (que escribe el cliente) — ver
      # RFC-051. No sustituye al validator: es la red bajo la red.
      - key: FORWARDED_ALLOW_IPS
        sync: false
      # Secreto compartido con Vercel (RFC 2026-10-24, opción B): Vercel lo
      # pone en x-tf-origin-secret al reenviar /api/* y, si casa, la API toma
      # la IP del visitante de x-real-ip para el rate limiting, el bloqueo de
      # login y el access log. El mismo valor, como variable sensible de
      # Production, en el proyecto de Vercel. _PREVIOUS solo durante una
      # rotación. Alta, verificación y rotación: docs/runbooks/ip-del-cliente.md.
      # Sin él la API arranca (aviso api_origin_secret_not_configured) y cuenta
      # por el nodo del proxy, como antes.
      - key: API_ORIGIN_SECRET
        sync: false
      - key: API_ORIGIN_SECRET_PREVIOUS
        sync: false
      # Sentry: observability/sentry.py es opt-in por SENTRY_DSN. Sin esta
      # variable, configure_sentry() en api/app.py es un no-op y producción
      # corre sin captura de errores ni trazas.
      - key: SENTRY_DSN
        sync: false
      # ADR-028 §G: ESTE servicio consume la cola a demanda (la ficha del
      # pliego, los embeddings de un expediente, el PDF grande) en un hilo
      # propio, y desde el 2026-10-19 es el único consumidor: `tenderflow-worker`
      # se retiró (ver la nota de abajo). Sin definir = consume en prod; `0` lo
      # apagaría y dejaría la cola sin nadie. `sync: false` para que un
      # despliegue del Blueprint no lo cambie sin que nadie lo decida.
      - key: JOBS_CONSUMIDOR_EN_API
        sync: false

      # ── Correo (alertas y correo de producto) ─────────────────────────
      # Sin estas variables no sale NINGÚN correo: ni el aviso de solicitud
      # al operador, ni el de acceso concedido, ni la verificación del alta,
      # ni el reset de contraseña, ni los digests. Hasta 2026-10-21 no estaban
      # declaradas y en producción no salía nada sin que se notara (RFC
      # 2026-10-21-alta-con-contrasena-tras-concesion §7). Con el backend `smtp`
      # bastan ALERT_SMTP_USER y ALERT_SMTP_PASSWORD (contraseña de aplicación
      # de Google); con `resend`/`postmark`, EMAIL_FROM y EMAIL_API_KEY. Ver
      # docs/runbooks/correo-transaccional.md.
      - key: EMAIL_BACKEND
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      # Buzón del operador: aquí llegan los avisos de solicitud de acceso.
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_SMTP_USER
        sync: false
      - key: ALERT_SMTP_PASSWORD
        sync: false

  # ── Worker de la cola de trabajo: RETIRADO (2026-10-19) ─────────────────
  # Aquí se declaraba `tenderflow-worker` (S5.3, D14; plano de cron de ADR-033).
  # Se creó a mano el 2026-10-10 en el plan free de Render, que hiberna un web
  # service a los ~15 min sin tráfico HTTP: el consumidor de la cola y el plano
  # de cron solo corrían en los minutos siguientes a cada deploy, y su
  # intervalo de 4 h no llegó a dispararse nunca. Se retiró en vez de pagar
  # `standard`, porque no hacía nada que no esté cubierto:
  #
  # - la ingesta (`daily_atom`) y el scoring siguen en Actions
  #   (`scrape-daily.yml`, `ml-scoring.yml`), que nunca dejaron de correr;
  # - la cola a demanda la consume `tenderflow-api` (ADR-028 §G, arriba).
  #
  # El código del perfil (`APP_PROFILE=worker`, `scheduler/worker.py`,
  # `scheduler/cron_plane.py`) se queda: `python -m scheduler.worker` sigue
  # siendo el consumidor en local, y volver a tener worker es recrear este
  # bloque desde el historial de git en un plan que no hiberne.

  # ── Servidor MCP interno (ADR-036, 2026-10-15) ──────────────────────────
  # Acceso de lectura a los datos para el equipo (3 personas, todas admin) desde
  # claude.ai y otros clientes MCP: `python -m mcp_server`, OAuth 2.1 con login
  # de Google. Es un proceso aparte de la API (ADR-036 §Alternativas): otra
  # superficie pública, otro rol de BD (`tenderflow_mcp`, solo lectura) y su
  # propio ritmo de despliegue. Procedimiento de alta y operación en
  # `docs/runbooks/mcp-interno.md`.
  #
  # ALTA A MANO, NO POR BLUEPRINT: mientras el Blueprint no esté vinculado
  # (checklist de la cabecera), una «New Blueprint Instance» sobre este fichero
  # crearía TODOS sus servicios, incluida una segunda API contra producción.
  # `tenderflow-mcp` se crea por el dashboard con los valores de abajo:
  # docs/runbooks/mcp-interno.md, paso 3.
  #
  # Creado el 2026-10-17 (`srv-db9cr1om7kps73ctg25g`, host
  # `https://tenderflow-mcp.onrender.com`). Comprobado en el primer deploy:
  #   - `dockerCommand` llega al entrypoint como comando completo
  #     (`docker/docker-entrypoint-api.sh` lo ejecuta tal cual).
  #   - `REQUIREMENTS_FILE` llega como build arg: la imagen instala
  #     `requirements-mcp.txt` (con `mcp-2.3.0`).
  # SIN VERIFICAR: que `plan: starter` (512 MB) baste bajo uso real. El proceso
  # es uvicorn + el SDK y un pool de 5 conexiones; las respuestas están acotadas
  # a 100 000 caracteres y `consultar_sql` lee por lotes de 50 filas (para en
  # cuanto no caben). Una sola celda enorme sí se carga entera. Si hay OOM,
  # `standard`.
  #
  # `APP_PROFILE: mcp` es un perfil propio (config/settings.py): no es la API
  # (con `api` los validadores de `Settings` exigirían `API_HMAC_SECRET`,
  # `CORS_ALLOWED_ORIGINS`, `WEBHOOK_SIGNING_KEY`... que este servicio no usa)
  # ni un worker (con `worker` se saltaría la longitud mínima de `SIGNING_KEY` y
  # `AUDIT_HMAC_KEY` y subiría el techo de consulta a 300 s). Sí exige esas dos
  # claves, con la longitud de la API. Lo demás lo valida
  # `mcp_server/servidor.py::validar_configuracion` al arrancar (aborta en prod).
  - type: web
    name: tenderflow-mcp
    runtime: docker
    dockerfilePath: docker/Dockerfile.api
    dockerContext: .
    dockerCommand: python -m mcp_server
    plan: starter
    region: frankfurt
    # Mismo gate que la API: solo llega lo que lanza `deploy.yml`.
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: prod
      - key: APP_PROFILE
        value: mcp
      # Variante de dependencias: la API más el SDK `mcp` (`requirements-mcp.in`).
      # Render pasa las variables del servicio como build args.
      - key: REQUIREMENTS_FILE
        value: requirements-mcp.txt
      # Solo lo usa el HEALTHCHECK de Docker (la API monta otra ruta).
      - key: HEALTHCHECK_PATH
        value: /healthz
      # Rol de la aplicación: tablas OAuth (`mcp_oauth_*`), usuarios, auditoría
      # **y las tres tools de dominio** (`buscar_licitaciones`,
      # `buscar_en_pliegos`, `ficha_licitacion`), que leen datos de negocio con
      # los repositorios de la app: SQL fijo, sin texto del LLM. El SQL libre
      # (`consultar_sql`) y las tools de esquema van solo por `MCP_DATABASE_URL`.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_ROOT_CERT
        sync: false
      # Rol de solo lectura `tenderflow_mcp` (`scripts/setup_pg_role_mcp.sql`),
      # el único con el que se ejecuta el SQL que escribe el LLM. DSN del
      # session pooler de Supavisor con usuario `tenderflow_mcp.<project-ref>`.
      - key: MCP_DATABASE_URL
        sync: false
      # `https://<host>`, sin barra final ni `:443`. Es el issuer OAuth y la base
      # de la URL que se pega en el conector.
      - key: MCP_PUBLIC_URL
        sync: false
      # Debe valer exactamente `{MCP_PUBLIC_URL}/oauth/google/callback` y estar
      # dado de alta como URI de redirección autorizado en el cliente OAuth de
      # Google. Si no coincide, el arranque lo rechaza.
      - key: MCP_GOOGLE_REDIRECT_URI
        sync: false
      # Mismo cliente OAuth de Google que la API: solo cambia el redirect URI.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Allowlist del login (`services.access_grants.acceso_oauth_permitido`,
      # la misma regla que la API): además de `is_admin`, el correo de Google
      # tiene que estar aquí o tener una concesión en `access_grants`. Sin ella
      # todo login vuelve a claude.ai con `access_denied` («Tenderflow wasn't
      # connected») y `audit_log` registra `mcp.login_denegado` con motivo
      # `fuera_de_allowlist`. Correos exactos separados por comas: los de los
      # admins que usan el MCP. `OAUTH_ALLOWED_DOMAINS` (dominios enteros)
      # también vale; no se declara porque un `sync: false` vacío bloquea el
      # alta del Blueprint.
      - key: OAUTH_ALLOWED_EMAILS
        sync: false
      - key: SIGNING_KEY
        sync: false
      # Cuota por usuario (60/min, 1 000/día) y nonce del estado OAuth. Sin
      # Redis cada reinicio los olvida.
      - key: REDIS_URL
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      # Firma de la cadena de auditoría. **El mismo valor que `tenderflow-api`**:
      # el MCP escribe en la misma `audit_log`, y con otra clave la cadena firmada
      # dejaría de verificar. Sin ella `log_action` no lanza (no rompe la
      # petición) pero tampoco escribe: el MCP funcionaría sin dejar rastro.
      - key: AUDIT_HMAC_KEY
        sync: false
      # Presupuesto de conexiones al pooler de Supabase (ver la nota larga de
      # `tenderflow-api`): el tráfico de la app es mínimo (login y tokens).
      # Aparte, el pool de `MCP_DATABASE_URL` tiene su máximo de 5 en código y
      # el rol tiene `CONNECTION LIMIT 5`.
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_READ_POOL_SIZE
        value: "2"
      # Opcional, no declarada a propósito (un `sync: false` vacío bloquea el
      # alta del Blueprint): `MCP_REDIRECT_URIS_EXTRA`, redirect URIs exactos
      # que el registro dinámico admite además de los de Claude y el loopback
      # (p. ej. el de ChatGPT). Se pone desde el dashboard; ver el runbook.

  # ── Observabilidad (ADR-019) ────────────────────────────────────────────
  # El código expone /metrics desde siempre, pero hasta ahora nadie lo
  # scrapeaba: el único Prometheus vivía en docker-compose.yml apuntando a
  # hostnames de compose local. Resultado: 5 de los 6 SLOs de docs/sli-slo.md
  # no tenían medición y el error budget no era computable.
  #
  # Prometheus es un servicio privado (no expuesto a internet); Grafana es web
  # porque hay que abrirlo desde el navegador y trae su propia autenticación.
  # Se construye desde docker/Dockerfile.prometheus en vez de usar la imagen
  # upstream: `runtime: image` arrancaba con la config de fábrica porque nada
  # copiaba prometheus.render.yml ni alert_rules.yml dentro del contenedor (el
  # único disco montado es el de datos). Con la config de fábrica Prometheus
  # solo se scrapea a sí mismo, así que ni había targets de la API ni se
  # evaluaba una sola regla de alerta.
  - type: pserv
    name: tenderflow-prometheus
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.prometheus
    dockerContext: .
    plan: starter
    region: frankfurt
    dockerCommand: >-
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=30d
      --web.enable-lifecycle
    disk:
      name: prometheus-data
      mountPath: /prometheus
      sizeGB: 10

  # ── Alertmanager (S6.3) ────────────────────────────────────────────────
  # Nueve reglas de alerta sin receptor. `observability/alert_rules.yml` define
  # diez (con el Watchdog nuevo), dos de ellas `severity: critical`
  # —`ApiErrorRateHigh`, escrita justo después del incidente del 2026-08-28 en
  # que «la superficie pública devolvió 500 durante horas sin que se disparara
  # nada», y `PgPoolHealthCheckFailed`—, pero `prometheus.render.yml` no tenía
  # bloque `alerting:` y no existía Alertmanager en ningún sitio del repo. Las
  # etiquetas `severity` solo las consume el enrutado de Alertmanager: se
  # diseñó la capa y no se cableó, así que una alerta que se disparaba se
  # quedaba en la página /alerts de Prometheus, que no mira nadie.
  #
  # `pserv` y no `web`: no tiene por qué ser accesible desde internet — quien lo
  # consulta es Prometheus, por la red privada. Exponerlo sería publicar la
  # superficie de silenciado de alertas sin autenticación.
  #
  # Disco pequeño pero necesario: `--storage.path` guarda las silences y el
  # estado de notificación (`nflog`). Sin él, cada redeploy reenvía todo lo que
  # siga activo y borra los silencios que alguien haya puesto durante un
  # incidente.
  #
  # Cómo llega a existir: si el Blueprint se vincula (checklist de la cabecera),
  # este bloque lo crea. Mientras no lo esté, hay que darlo de alta a mano — el
  # procedimiento, con las variables que hay que inyectar y cómo comprobar que
  # el Watchdog llega, está en docs/runbooks/observability-alerts.md.
  - type: pserv
    name: tenderflow-alertmanager
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.alertmanager
    dockerContext: .
    plan: starter
    region: frankfurt
    disk:
      name: alertmanager-data
      mountPath: /alertmanager
      sizeGB: 1
    envVars:
      # Puerto FIJADO a mano, y no es cosmético. El entrypoint arranca con
      # `--web.listen-address=0.0.0.0:${PORT:-9093}` y Render inyecta su propio
      # `PORT` (10000 por defecto) cuando el servicio no lo declara: el
      # Alertmanager escucharía en 10000 mientras
      # `observability/prometheus.render.yml` enruta a
      # `tenderflow-alertmanager:9093`. El síntoma sería el que este servicio
      # existe para terminar — alertas que se disparan y no llegan a ningún
      # sitio— y ningún test lo vería. Declararlo aquí gana sobre el default de
      # Render y deja las dos puntas del cable en el mismo número.
      - key: PORT
        value: "9093"
      # Las MISMAS variables ALERT_* que ya usa observability/alerts.py desde
      # Python y que docs/SECURITY.md lista como secretos gestionados. No se
      # inventa un segundo juego de credenciales SMTP: el proyecto tiene un solo
      # buzón remitente.
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_SMTP_USER
        sync: false
      - key: ALERT_SMTP_PASSWORD
        sync: false
      - key: ALERT_SMTP_HOST
        value: smtp.gmail.com
      - key: ALERT_SMTP_PORT
        value: "587"
      # Segundo canal, opcional. Vacío por defecto y sin romper nada: el
      # entrypoint sustituye la variable ausente por un destino local
      # inexistente, Alertmanager registra el fallo de ESE receptor y sigue
      # sirviendo el de email. Aquí es donde va la URL de un dead-man's-switch
      # (healthchecks.io, Better Stack, Cronitor) para que el Watchdog sirva de
      # algo — hoy dispara y se enruta, pero nadie nota su ausencia.
      - key: ALERTMANAGER_WEBHOOK_URL
        sync: false

  - type: web
    name: tenderflow-grafana
    runtime: image
    image:
      url: docker.io/grafana/grafana-oss:11.1.0
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: grafana-data
      mountPath: /var/lib/grafana
      sizeGB: 1
    envVars:
      # Contraseña fuerte obligatoria: config/settings.py la valida con
      # check_password_strength (mínimo 16 caracteres) en ENV=prod.
      - key: GF_SECURITY_ADMIN_PASSWORD
        sync: false
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_SERVER_ROOT_URL
        sync: false
