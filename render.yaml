# ⚠️ ANTES DE FIARTE DE ESTE FICHERO: NO gobierna el servicio de producción.
#
# El servicio de producción se creó a mano por el dashboard y **nunca se vinculó
# a este Blueprint**, así que lo de aquí es una intención y no una configuración:
# editarlo no cambia nada en Render, y leerlo como si fuera la verdad induce a
# error sobre cómo está configurado el servicio real.
#
# ── Estado: VERIFICADO el 2026-08-28 contra la API de Render ────────────────
# (no contra el dashboard, que sigue sin comprobar; ver "Pregunta abierta").
#
#   - Nombre lógico del servicio: `tenderflow-api` (coincide con este fichero).
#   - Host real: `tenderflow-jrtr.onrender.com`. NO es
#     `tenderflow-api.onrender.com`: el sufijo aleatorio lo pone Render al crear
#     el servicio a mano. Es el valor que tienen que llevar `vars.SMOKE_BASE_URL`
#     (smoke.yml, deploy.yml) y `CORS_ALLOWED_ORIGINS`/`FRONTEND_URL`.
#   - `autoDeploy`: **ACTIVO** en el servicio real.
#   - `plan`: **standard** en el servicio real.
#
# ── Líneas de este fichero que NO describen la realidad ─────────────────────
# Se conservan porque son la configuración deseada, no porque estén vigentes:
#
#   1. `autoDeploy: false` (abajo). El servicio real despliega en cada push a la
#      rama conectada, con CI en rojo o sin CI: los 12 jobs, los ratchets, el
#      fuzzing y los E2E son advisory para producción, no un gate. Y un deploy
#      que arranque mal reemplaza igualmente al que funcionaba.
#   2. `healthCheckPath: /api/v1/health` (abajo). El 2026-08-04 no había
#      healthcheck configurado en el servicio real; sin él Render no espera a
#      que la instancia nueva esté sana antes de cortar la vieja, así que no hay
#      rollback automático de un arranque roto. Sin re-verificar desde entonces.
#   3. Los servicios `tenderflow-prometheus`, `tenderflow-grafana` y
#      `tenderflow-alertmanager` de más abajo: al no estar vinculado el
#      Blueprint, declararlos aquí NO los crea. Existen en Render solo si
#      alguien los creó a mano.
#
# `plan: free` SÍ estaba desalineado y se corrigió a `standard` en este cambio
# (ver el comentario en la propia línea). `docs/sli-slo.md` todavía suspende el
# SLO de disponibilidad "mientras `tenderflow-api` use Render Free": ese
# documento no es de este stream y queda reportado como desajuste pendiente.
#
# ── Pregunta abierta (decisión pendiente, no un TODO más) ───────────────────
# Hay que elegir una de las dos, y hasta que se elija este fichero seguirá
# mintiendo por omisión:
#
#   (a) **Vincular el Blueprint** y que este fichero mande de verdad. Ojo:
#       vincular un Blueprint a un servicio existente puede recrearlo — hacerlo
#       en ventana, con el `plan` ya correcto aquí (por eso el cambio a
#       `standard`: enlazarlo con `free` degradaría el servicio).
#   (b) **Declararlo documental**: renombrarlo a algo que no parezca activo y
#       replicar a mano en el dashboard `autoDeploy: false` y `healthCheckPath`.
#
# Verificación de dos minutos, en el dashboard de Render (nadie la ha hecho aún
# — la verificación del 2026-08-28 fue por API, que no expone el vínculo):
#   1. Settings del servicio → ¿aparece vinculado a un Blueprint?
#   2. Settings → Build & Deploy → ¿`Auto-Deploy` está en `No`?
#   3. Settings → Health Check Path → ¿dice `/api/v1/health`?
#   4. Anotá aquí el resultado con su fecha, para que el siguiente que lea este
#      fichero no tenga que volver a preguntárselo.
services:
  - type: web
    name: tenderflow-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.api
    # `free` hasta 2026-08-28, cuando se verificó por la API de Render que el
    # servicio real corre en `standard`. Corregirlo aquí es seguro precisamente
    # porque el Blueprint NO está vinculado: esta línea no dispara ningún cambio
    # de plan. Y dejarla en `free` era lo peligroso — si algún día se vincula el
    # Blueprint (opción (a) de la cabecera), un `free` aquí DEGRADARÍA el
    # servicio a un plan con spin-down.
    plan: standard
    region: frankfurt
    # ⚠️ NO VIGENTE (ver cabecera, punto 1): el servicio real tiene autoDeploy
    # ACTIVO. Esto es la configuración deseada, no la observada.
    #
    # Deploy NO automático en cada push: sin esto Render despliega código en
    # cada commit a la rama conectada, incluso con CI en rojo, dejando todo el
    # aparato de gates (16 jobs, ratchets, fuzzing, E2E) como puramente
    # advisory para producción. Con autoDeploy:false el deploy se dispara
    # manualmente o vía deploy hook gateado por el job `test` de CI (ver
    # docs/runbooks). Un despliegue solo debe ocurrir sobre un commit verde.
    autoDeploy: false
    # ⚠️ NO VIGENTE (ver cabecera, punto 2): el 2026-08-04 el servicio real no
    # tenía healthcheck configurado. Sin él Render no espera a que la instancia
    # nueva esté sana antes de cortar la vieja.
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: prod
      # Perfil de componentes: este servicio sirve la API HTTP, así que exige
      # SIGNING_KEY, API_HMAC_SECRET, REDIS_URL y CORS_ALLOWED_ORIGINS. Los
      # jobs de GitHub Actions usan APP_PROFILE=scraper contra la misma BD.
      - key: APP_PROFILE
        value: api
      # Postgres/Supabase (ADR-016, F3) — tiene precedencia sobre SQLite local.
      # Usar Supavisor session pooler (puerto 5432). TLS: se recomienda
      # ?sslmode=verify-full + DATABASE_SSL_ROOT_CERT (CA de Supabase) para
      # prevenir MITM; sslmode=disable/allow/prefer se rechazan en prod.
      - key: DATABASE_URL
        sync: false
      # Ruta a la CA de Supabase para verify-full (cert público). Ver db/certs/README.md.
      - key: DATABASE_SSL_ROOT_CERT
        sync: false
      # ── Presupuesto de conexiones ────────────────────────────────────
      # Hay DOS pools psycopg, no uno: escritura (`connect`) y lectura
      # (`connect_read`), porque el modo solo-lectura se fija en la sesión.
      # Cada uno abre su propia conexión de sesión contra Supavisor, así que
      # el techo de este servicio es la SUMA de los dos, no `DB_POOL_SIZE`.
      # (Con más precisión: `min(API_THREADPOOL_TOKENS, escritura + lectura)`,
      # porque cada hilo síncrono sostiene como mucho una conexión. Hoy los
      # dos términos valen 24 —el threadpool por un lado, 12+12 por otro—,
      # así que el techo queda en 24 mires por donde mires.)
      #
      # Ese techo tiene que caber en el `Pool Size` del session pooler de
      # Supabase (Project Settings → Database → Connection pooling). Si no
      # cabe, la API se queda sin ranuras ella sola bajo carga, y cualquier
      # otro cliente —el `alembic upgrade` de .github/workflows/migrate.yml,
      # los jobs con APP_PROFILE=scraper— muere en el connect con
      # `FATAL: (EMAXCONNSESSION) max clients reached in session mode`.
      # Fue exactamente lo que pasó el 2026-08-24: pooler en 15, techo en 24.
      #
      # A fecha de este commit: 12 + 12 = 24, con el pooler en 30. Ese 30 se
      # configura en el panel de Supabase, no aquí, así que este número es
      # una nota — la verdad está en el dashboard.
      #
      # Al subir cualquiera de los dos valores, subir antes el pooler. El
      # margen que queda arriba lo marca `max_connections` de la instancia
      # (60, menos 3 reservadas para superusuario), del que los servicios de
      # la propia plataforma (PostgREST, Storage, mgmt-api, exporter) ya
      # consumen ~8 conexiones directas que NO pasan por el pooler.
      #
      # Subir de 5 a 12 vino de un incidente concreto: las agregaciones de
      # analytics retenían las 5 conexiones del default de
      # config/settings.py y el resto de endpoints esperaba en cola
      # (pool-1 connection timeout, 2026-08-01).
      - key: DB_POOL_SIZE
        value: "12"
      # Declarado explícitamente aunque coincida con el de escritura: el
      # default de config/settings.py es 0, que NO significa «sin pool de
      # lectura» sino «hereda DB_POOL_SIZE» (db/connection.py, `0 or
      # default_size`). Sin esta línea el 24 de arriba es emergente y nadie
      # que lea este fichero lo ve venir.
      - key: DB_READ_POOL_SIZE
        value: "12"
      # ── Redis (cache compartido + rate limiting) — OBLIGATORIO en prod ──
      # Formato: redis://[:password@]host[:port][/db]
      - key: REDIS_URL
        sync: false
      # Debe coincidir con --requirepass del servidor Redis. Obligatorio si REDIS_URL está definida.
      - key: REDIS_PASSWORD
        sync: false

      # ── OAuth Google (opcional) ─────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      # OBLIGATORIO si GOOGLE_CLIENT_ID está definido: con ambos allowlists
      # vacíos el arranque en prod se rechaza (fail-closed, 2026-08). Para
      # login abierto deliberado usar OAUTH_ALLOWED_DOMAINS=*.
      - key: OAUTH_ALLOWED_DOMAINS
        sync: false
      - key: OAUTH_ALLOWED_EMAILS
        sync: false
      - key: OAUTH_ADMIN_EMAILS
        sync: false

      # ── Secretos de firma — independientes entre sí, 32+ caracteres ──
      # Genera cada uno con: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SIGNING_KEY
        sync: false
      - key: API_HMAC_SECRET
        sync: false
      # Firma de la cadena de auditoría (db/audit.py). Obligatorio en prod;
      # sin versionado/rotación — configúralo una vez y no lo cambies.
      - key: AUDIT_HMAC_KEY
        sync: false
      # Firma de webhooks salientes. Opcional: cae a SIGNING_KEY si está vacío.
      - key: WEBHOOK_SIGNING_KEY
        sync: false
      # Allowlist de destinos de webhooks salientes (dominios separados por
      # coma). Sin ella, los webhooks quedan deshabilitados en prod. No uses '*'.
      - key: WEBHOOK_ALLOWED_HOSTS
        sync: false
      # Cifrado de secretos TOTP (2FA). Clave Fernet, no un hex normal:
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: TOTP_ENCRYPTION_KEY
        sync: false

      # ── Asistente RAG /api/v1/ask (opcional) ─────────────────────────
      # Proveedor por defecto: NVIDIA NIM. Alternativos: OPENAI_API_KEY, ANTHROPIC_API_KEY.
      - key: NVIDIA_API_KEY
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # IPs o rangos CIDR del proxy de Render cuyo X-Forwarded-For se honra.
      # Gestionado por entorno (sync: false) porque el rango depende de la
      # región/plan: cópialo del panel de Render y ponlo aquí, nunca "*".
      # Con "*" uvicorn acepta la cabecera de cualquier peer y el cliente elige
      # qué IP ve la aplicación, tumbando rate limiting, lockout de login y la
      # trazabilidad del audit log. El validator
      # _validate_prod_forwarded_allow_ips hace fallar el arranque en ese caso:
      # fallo ruidoso en el deploy, en vez de degradación silenciosa en runtime.
      # Defensa en profundidad si "*" llegara a colarse fuera de prod/staging
      # (dev, test): api/middleware.py::_trusted_client_ip trata ese caso como
      # "un salto de confianza" y toma el ÚLTIMO hop de X-Forwarded-For (el que
      # appendea el proxy), nunca el primero (que escribe el cliente) — ver
      # RFC-051. No sustituye al validator: es la red bajo la red.
      - key: FORWARDED_ALLOW_IPS
        sync: false
      # Sentry: observability/sentry.py es opt-in por SENTRY_DSN. Sin esta
      # variable, configure_sentry() en api/app.py es un no-op y producción
      # corre sin captura de errores ni trazas.
      - key: SENTRY_DSN
        sync: false

  # ── Observabilidad (ADR-019) ────────────────────────────────────────────
  # El código expone /metrics desde siempre, pero hasta ahora nadie lo
  # scrapeaba: el único Prometheus vivía en docker-compose.yml apuntando a
  # hostnames de compose local. Resultado: 5 de los 6 SLOs de docs/sli-slo.md
  # no tenían medición y el error budget no era computable.
  #
  # Prometheus es un servicio privado (no expuesto a internet); Grafana es web
  # porque hay que abrirlo desde el navegador y trae su propia autenticación.
  # Se construye desde docker/Dockerfile.prometheus en vez de usar la imagen
  # upstream: `runtime: image` arrancaba con la config de fábrica porque nada
  # copiaba prometheus.render.yml ni alert_rules.yml dentro del contenedor (el
  # único disco montado es el de datos). Con la config de fábrica Prometheus
  # solo se scrapea a sí mismo, así que ni había targets de la API ni se
  # evaluaba una sola regla de alerta.
  - type: pserv
    name: tenderflow-prometheus
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.prometheus
    dockerContext: .
    plan: starter
    region: frankfurt
    dockerCommand: >-
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=30d
      --web.enable-lifecycle
    disk:
      name: prometheus-data
      mountPath: /prometheus
      sizeGB: 10

  # ── Alertmanager (S6.3) ────────────────────────────────────────────────
  # Nueve reglas de alerta sin receptor. `observability/alert_rules.yml` define
  # diez (con el Watchdog nuevo), dos de ellas `severity: critical`
  # —`ApiErrorRateHigh`, escrita justo después del incidente del 2026-08-28 en
  # que «la superficie pública devolvió 500 durante horas sin que se disparara
  # nada», y `PgPoolHealthCheckFailed`—, pero `prometheus.render.yml` no tenía
  # bloque `alerting:` y no existía Alertmanager en ningún sitio del repo. Las
  # etiquetas `severity` solo las consume el enrutado de Alertmanager: se
  # diseñó la capa y no se cableó, así que una alerta que se disparaba se
  # quedaba en la página /alerts de Prometheus, que no mira nadie.
  #
  # `pserv` y no `web`: no tiene por qué ser accesible desde internet — quien lo
  # consulta es Prometheus, por la red privada. Exponerlo sería publicar la
  # superficie de silenciado de alertas sin autenticación.
  #
  # Disco pequeño pero necesario: `--storage.path` guarda las silences y el
  # estado de notificación (`nflog`). Sin él, cada redeploy reenvía todo lo que
  # siga activo y borra los silencios que alguien haya puesto durante un
  # incidente.
  - type: pserv
    name: tenderflow-alertmanager
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.alertmanager
    dockerContext: .
    plan: starter
    region: frankfurt
    disk:
      name: alertmanager-data
      mountPath: /alertmanager
      sizeGB: 1
    envVars:
      # Las MISMAS variables ALERT_* que ya usa observability/alerts.py desde
      # Python y que docs/SECURITY.md lista como secretos gestionados. No se
      # inventa un segundo juego de credenciales SMTP: el proyecto tiene un solo
      # buzón remitente.
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_SMTP_USER
        sync: false
      - key: ALERT_SMTP_PASSWORD
        sync: false
      - key: ALERT_SMTP_HOST
        value: smtp.gmail.com
      - key: ALERT_SMTP_PORT
        value: "587"
      # Segundo canal, opcional. Vacío por defecto y sin romper nada: el
      # entrypoint sustituye la variable ausente por un destino local
      # inexistente, Alertmanager registra el fallo de ESE receptor y sigue
      # sirviendo el de email. Aquí es donde va la URL de un dead-man's-switch
      # (healthchecks.io, Better Stack, Cronitor) para que el Watchdog sirva de
      # algo — hoy dispara y se enruta, pero nadie nota su ausencia.
      - key: ALERTMANAGER_WEBHOOK_URL
        sync: false

  - type: web
    name: tenderflow-grafana
    runtime: image
    image:
      url: docker.io/grafana/grafana-oss:11.1.0
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: grafana-data
      mountPath: /var/lib/grafana
      sizeGB: 1
    envVars:
      # Contraseña fuerte obligatoria: config/settings.py la valida con
      # check_password_strength (mínimo 16 caracteres) en ENV=prod.
      - key: GF_SECURITY_ADMIN_PASSWORD
        sync: false
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_SERVER_ROOT_URL
        sync: false
