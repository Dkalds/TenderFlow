# Configuración de mutmut (E2 — mutation testing).
#
# Mutmut introduce pequeños cambios ("mutaciones") al código fuente y verifica
# que la suite de tests detecte cada cambio. Un mutante "sobreviviente"
# señala una rama no cubierta por aserciones.
#
# **La forma soportada de ejecutarlo es `make mutation-sample`**
# (`scripts/run_mutation_sample.py`), que muta uno o dos módulos por ejecución
# y lanza solo los tests que cubren cada uno. Los valores de abajo son el
# fallback para un `mutmut run` a pelo.
#
# El `runner` anterior era `pytest tests/`: la suite entera por cada mutante,
# con Postgres y migraciones incluidos. Con cientos de mutantes eso son horas,
# que es la razón por la que esta configuración existía desde hacía tiempo sin
# que nadie la ejecutara nunca. `-p no:cacheprovider` evita que los mutantes
# se pisen la caché entre sí.
#
# Limitamos los paths a la lógica de negocio crítica para mantener el tiempo
# de ejecución acotado. Excluimos código UI (web/) y migraciones, que no
# aportan valor para mutation testing.

[mutmut]
paths_to_mutate = scraper/codice_parser.py,scraper/filters.py,shared/geo.py,shared/dates.py,api/auth.py,api/scopes.py,services/dedupe.py,services/normalization.py
runner = python -m pytest -x -q --no-cov --no-header -p no:cacheprovider tests/
tests_dir = tests/
backup = false
