# Configuración de mutmut (E2 — mutation testing).
#
# Mutmut introduce pequeños cambios ("mutaciones") al código fuente y verifica
# que la suite de tests detecte cada cambio. Un mutante "sobreviviente"
# señala una rama no cubierta por aserciones.
#
# Uso:
#   pip install mutmut
#   mutmut run                 # ejecuta todas las mutaciones (lento)
#   mutmut results             # muestra mutantes vivos
#   mutmut show <id>           # muestra el diff de una mutación concreta
#
# Limitamos los paths a la lógica de negocio crítica para mantener el
# tiempo de ejecución acotado. Excluimos código UI (dashboard) y migrations
# que no aportan valor para mutation testing.

[mutmut]
paths_to_mutate = scraper/codice_parser.py,scraper/filters.py,scraper/ml_classifier.py,db/database.py,api/auth.py,scheduler/concept_drift.py,observability/logging.py,shared/geo.py
runner = python -m pytest -x --no-cov -q tests/
tests_dir = tests/
backup = false
