services:
  dashboard:
    build:
      context: .
      target: runtime
    image: tenderflow:latest
    container_name: tenderflow-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      # Base de datos SQLite persistente fuera del contenedor
      - tenderflow_data:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/tenderflow.db
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5",
             "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: licitaciones-sap-api:latest
    container_name: licitaciones-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - licitaciones_data:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/licitaciones.db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RATE_LIMIT_BACKEND: redis
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5",
             "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      target: runtime
    image: tenderflow:latest
    container_name: tenderflow-scheduler
    restart: unless-stopped
    # El scheduler no expone puerto â€” solo escribe en la BD compartida
    volumes:
      - tenderflow_data:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/tenderflow.db
    command: ["python", "-m", "scheduler.run_update"]
    # Iniciar despuÃ©s del dashboard para que la BD ya estÃ© inicializada
    depends_on:
      redis:
        condition: service_healthy

  # â”€â”€ Redis (cache compartido + rate limiting) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  redis:
    image: redis:7-alpine
    container_name: licitaciones-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # â”€â”€ Monitoring (opcional): activar con `docker compose --profile monitoring up` â”€
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: licitaciones-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      scheduler:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: licitaciones-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      test: ["CMD-SHELL",
             "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  tenderflow_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
