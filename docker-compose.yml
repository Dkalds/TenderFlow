services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: tenderflow-web:latest
    container_name: tenderflow-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
      API_BASE_URL: http://api:8080
      NODE_ENV: production
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: tenderflow-api:latest
    container_name: tenderflow-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - tenderflow_data:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/tenderflow.db
      # Redis es opt-in: configura REDIS_URL en .env para activar cache compartido.
      # Sin Redis, el API opera con fallbacks (rate limit sqlite, cache memoria).
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5",
             "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: tenderflow-api:latest
    container_name: tenderflow-scheduler
    restart: unless-stopped
    # El scheduler no expone puerto — solo escribe en la BD compartida
    volumes:
      - tenderflow_data:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/tenderflow.db
      SCHEDULER_DAILY_INTERVAL_MINUTES: ${SCHEDULER_DAILY_INTERVAL_MINUTES:-240}
      SCHEDULER_BULK_INTERVAL_MINUTES: ${SCHEDULER_BULK_INTERVAL_MINUTES:-1440}
      SCHEDULER_BULK_MONTHS: ${SCHEDULER_BULK_MONTHS:-3}
    entrypoint: ["python", "-m", "scheduler.loop"]
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c",
             "import libsql, os; libsql.connect(os.environ['DB_PATH']).execute('SELECT 1').fetchone()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  # ── Redis (cache compartido, opt-in) ─────────────────────────────────────
  # Para desarrollo local con Redis: añadir --profile redis
  #   docker compose --profile redis up
  # En producción se usa Upstash (configurar REDIS_URL en .env).
  redis:
    image: redis:7-alpine
    container_name: tenderflow-redis
    profiles: ["redis"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-dev-password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── Monitoring (opcional): activar con `docker compose --profile monitoring up` ─
  # Prometheus/Grafana son la definición de referencia de los umbrales; alerting
  # de producción se realiza via scheduler/healthcheck.py + ops_events en BD.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tenderflow-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: tenderflow-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      test: ["CMD-SHELL",
             "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  tenderflow_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
