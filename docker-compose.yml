services:
  dashboard:
    build:
      context: .
      target: runtime
    image: licitaciones-sap:latest
    container_name: licitaciones-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      # Base de datos SQLite persistente fuera del contenedor
      - licitaciones_data:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/licitaciones.db
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    build:
      context: .
      target: runtime
    image: licitaciones-sap:latest
    container_name: licitaciones-scheduler
    restart: unless-stopped
    # El scheduler no expone puerto — solo escribe en la BD compartida
    volumes:
      - licitaciones_data:/data
    env_file:
      - .env
    environment:
      DB_PATH: /data/licitaciones.db
      SCHEDULER_DAILY_INTERVAL_MINUTES: ${SCHEDULER_DAILY_INTERVAL_MINUTES:-240}
      SCHEDULER_BULK_INTERVAL_MINUTES: ${SCHEDULER_BULK_INTERVAL_MINUTES:-1440}
      SCHEDULER_BULK_MONTHS: ${SCHEDULER_BULK_MONTHS:-3}
    entrypoint: ["python", "-m", "scheduler.loop"]
    # Iniciar después del dashboard para que la BD ya esté inicializada
    depends_on:
      dashboard:
        condition: service_healthy

  # ── Monitoring (opcional): activar con `docker compose --profile monitoring up` ─
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: licitaciones-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      scheduler:
        condition: service_started

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: licitaciones-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin  # pragma: allowlist secret
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  licitaciones_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
