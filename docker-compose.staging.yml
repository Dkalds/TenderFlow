# docker-compose.staging.yml — Entorno de staging
#
# Uso: docker compose -f docker-compose.yml -f docker-compose.staging.yml up
#
# Diferencias con producción:
# - ENV=staging (permite configuración específica de staging en settings.py)
# - DB: Turso cloud con BD de staging separada
# - Logs en JSON (igual que prod) pero ALERT_MIN_LEVEL=warn
# - Sin FAISS (staging puede no tener sentence-transformers instalado)
# - Límites de memoria más generosos que prod para pruebas de carga

services:
  api:
    environment:
      ENV: staging
      LOG_FORMAT: json
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TURSO_DATABASE_URL: ${STAGING_TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${STAGING_TURSO_AUTH_TOKEN:-}
      ALERT_MIN_LEVEL: warn
      SIGNING_KEY: ${SIGNING_KEY}
      API_HMAC_SECRET: ${API_HMAC_SECRET}
    mem_limit: 512m

  scheduler:
    environment:
      ENV: staging
      LOG_FORMAT: json
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TURSO_DATABASE_URL: ${STAGING_TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${STAGING_TURSO_AUTH_TOKEN:-}
      ALERT_MIN_LEVEL: warn
      SCHEDULER_DAILY_INTERVAL_MINUTES: 480   # menos frecuente en staging
      SCHEDULER_BULK_INTERVAL_MINUTES: 10080  # semanal en staging
    mem_limit: 768m
